# Deploys CUE's server (server/) to Cloudflare Workers whenever it, or a game file it plays shots with, changes on main.
# Separate from build.yml (the APK): this one never touches signing. Needs the repository secrets CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID.
name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'web/physics.js'
      - 'web/game.js'
      - 'web/ai/**'
      - 'web/puzzles.js'
      - 'web/highlights.js'
      - 'web/tables.js'
      - 'web/economy.js'
      - 'web/content/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

concurrency: server-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Server checks
        run: npm test
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy 2>&1 | tee deploy.log
      - name: Where it is, and is it working
        run: |
          U=$(grep -o 'https://[a-z0-9.-]*workers.dev' deploy.log | head -1)
          echo "$U"
          node tools/live.mjs "$U"
