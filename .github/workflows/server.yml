# Deploys CUE's server (server/) to Cloudflare Workers whenever it, or a game file it plays shots with, changes on main.
# Separate from build.yml (the APK): this one never touches signing. Needs the repository secrets CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID.
name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'web/physics.js'
      - 'web/game.js'
      - 'web/ai/**'
      - 'web/puzzles.js'
      - 'web/highlights.js'
      - 'web/tables.js'
      - 'web/economy.js'
      - 'web/content/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

concurrency: server-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Server checks
        run: npm test
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy 2>&1 | tee deploy.log
      - name: Where it is, and is it working
        run: |
          U=$(grep -o 'https://[a-z0-9.-]*workers.dev' deploy.log | head -1)
          echo "$U"
          # (the app must be asking this address: the Cloudflare subdomain once changed under it, and every device went
          # quiet while the checks here, which read the address from the deploy, kept passing - web/app/07-net.js SERVER)
          A=$(grep -o "const SERVER = '[^']*'" ../web/app/07-net.js | cut -d"'" -f2)
          # (or its own domain, danguuu.com since 11-10 - the workers.dev address stays for apps already out there)
          D=$(grep -oE '[a-z0-9.-]+ \(custom domain\)' deploy.log | head -1 | cut -d' ' -f1)
          test "$A" = "$U" || { test -n "$D" && test "$A" = "https://$D"; } || { echo "FAIL the app asks $A, the server is at $U ${D:+and https://$D} - change SERVER in web/app/07-net.js"; exit 1; }
          echo "ok   the app asks this address"
          node tools/live.mjs "$U"
          if [ -n "$D" ]; then echo "https://$D"; node tools/live.mjs "https://$D"; fi
