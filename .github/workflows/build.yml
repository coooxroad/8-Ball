name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every push and every pull request: the rules, the computer player, the lessons and puzzles are checked, the page is
  # built from its sources and checked too. A pull request stops here - nothing is released from one.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: node web/test/run.js
      - name: Build the page
        run: sh web/build.sh
      - name: Check the page
        run: node web/tools/check.js

  # Only what lands on main becomes an APK and a release.
  apk:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the page inside the app is made here from web/, never committed
      - name: Build the page
        run: sh web/build.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Optional fixed signing key. Without these two secrets the APK is signed with a
      # throwaway key, which installs fine but cannot update an earlier install in place.
      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ] && [ -n "$SIGNING_PASSWORD" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$SIGNING_PASSWORD"
              echo "KEY_ALIAS=eightball"
            } >> "$GITHUB_ENV"
            echo "SIGNED_WITH=고정 키" >> "$GITHUB_ENV"
          else
            echo "SIGNED_WITH=임시 키 (이전 설치본 위에 업데이트하려면 먼저 삭제 필요)" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: gradle --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }}

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/CUE-2.0.${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.0.${{ github.run_number }}" out/*.apk \
            --target "$GITHUB_SHA" \
            --title "CUE 2.0 (빌드 ${{ github.run_number }})" \
            --notes "서명: $SIGNED_WITH"
