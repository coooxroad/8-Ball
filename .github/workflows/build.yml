name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rules, computer player and every practice layout are checked before anything is built
      - name: Test
        run: node web/test/run.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Optional fixed signing key. Without these two secrets the APK is signed with a
      # throwaway key, which installs fine but cannot update an earlier install in place.
      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ] && [ -n "$SIGNING_PASSWORD" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$SIGNING_PASSWORD"
              echo "KEY_ALIAS=eightball"
            } >> "$GITHUB_ENV"
            echo "SIGNED_WITH=고정 키" >> "$GITHUB_ENV"
          else
            echo "SIGNED_WITH=임시 키 (이전 설치본 위에 업데이트하려면 먼저 삭제 필요)" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: gradle --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }}

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/BreakTime-1.${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" out/*.apk \
            --target "$GITHUB_SHA" \
            --title "브레이크타임 1.${{ github.run_number }}" \
            --notes "서명: $SIGNED_WITH"
