plugins {
    id 'com.android.application'
}

// CI passes the run number so every build installs over the previous one.
def buildNumber = (project.findProperty('buildNumber') ?: '1') as int
// Fixed signing key, supplied by the workflow from repository secrets (optional).
def keystorePath = System.getenv('KEYSTORE_FILE')

android {
    namespace 'io.github.coooxroad.eightball'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.coooxroad.eightball'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.${buildNumber}"
    }

    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Without the secrets the APK is still installable, signed with a throwaway debug key.
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
