<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
body{margin:0}
[hidden]{display:none!important}
@font-face{font-family:'Jua';font-display:swap;src:url(fonts/Jua-Regular.woff2) format('woff2')}
@font-face{font-family:'Black Han Sans';font-display:swap;src:url(fonts/BlackHanSans-Regular.woff2) format('woff2')}
@font-face{font-family:'Lilita One';font-display:swap;src:url(fonts/LilitaOne-Regular.woff2) format('woff2')}
</style>
</head>
<body>
<title>딥 포켓 8볼</title>
<style>
/* Layout: a live 3D table in the middle of an arcade-blue stage. Home screen docks chunky panels left and right of it;
   in play the panels leave and only a slim scoreboard and the edge controls remain. */
:root{
  color-scheme:dark;
  --blue:#2037c9; --band:#2b46e0; --navy:#16268f; --navy-d:#0e1a66;
  --yellow:#ffd21f; --yellow-d:#c99a00;
  --p1:#ff5a3c; --p1-d:#b9341d; --p2:#12b886; --p2-d:#0b7d5b;
  --card:#ffffff; --card-d:#b8c0e6; --ink:#1a1f4d; --mute:#cfd8ff; --red:#e63d1f;
  --disp:'Black Han Sans','Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --body:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  --num:'Lilita One','Black Han Sans','Arial Black',system-ui,sans-serif;
  --hud-h:60px;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--blue);color:#fff;font-family:var(--body);font-size:16px;line-height:1.25;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden;background:var(--blue)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- buttons: every pressable thing has a hard bottom edge and sinks when pressed ---------- */
.btn{--bg:var(--navy);--edge:var(--navy-d);--fg:#fff;background:var(--bg);color:var(--fg);border-radius:16px;
  box-shadow:0 5px 0 var(--edge);padding:10px 18px;min-height:46px;font-size:19px;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .06s,box-shadow .06s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.btn.icon{width:50px;padding:0}
.btn.yellow{--bg:var(--yellow);--edge:var(--yellow-d);--fg:var(--ink)}
.btn.white{--bg:var(--card);--edge:var(--card-d);--fg:var(--ink)}
.btn.big{font-family:var(--disp);font-size:40px;line-height:1;border-radius:24px;padding:16px 24px;box-shadow:0 8px 0 var(--edge)}
.btn.big:active{transform:translateY(5px);box-shadow:0 3px 0 var(--edge)}
.lab{font-size:18px;color:var(--mute)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.seg .btn{padding:8px 6px;font-size:18px;min-height:44px}
.seg .btn[aria-pressed="true"]{--bg:var(--yellow);--edge:var(--yellow-d);--fg:var(--ink)}

/* ---------- home ---------- */
#home{position:absolute;inset:0;display:grid;grid-template-columns:300px minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr);
  gap:16px 26px;padding:20px 30px 26px;pointer-events:none}
#home>*{pointer-events:auto}
.h-top{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:baseline;gap:10px;transform:skewX(-8deg)}
.logo span{font-family:var(--disp);font-size:44px;line-height:1}
.logo b{font-family:var(--num);font-weight:400;font-size:50px;line-height:1;color:var(--yellow)}
.h-actions{margin-left:auto;display:flex;gap:12px}
.h-left,.h-right{display:flex;flex-direction:column;gap:12px;min-height:0}
#modeList{display:flex;flex-direction:column;gap:12px}
.gcard{--bg:var(--card);--edge:var(--card-d);background:var(--bg);color:var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--edge);
  padding:13px 16px;display:flex;align-items:center;gap:14px;text-align:left;transition:transform .06s,box-shadow .06s}
.gcard:active{transform:translateY(4px);box-shadow:0 3px 0 var(--edge)}
.gcard[aria-pressed="true"]{--bg:var(--yellow);--edge:var(--yellow-d)}
.gcard .ic{flex:none;width:46px;height:46px;display:grid;place-items:center}
.gcard .nm{display:block;font-size:27px;line-height:1.1}
.gcard .bl{display:block;font-size:15px;opacity:.86}
.ball{display:grid;place-items:center;border-radius:50%;background:var(--c,#111);width:46px;height:46px;
  box-shadow:inset -4px -5px 8px rgba(0,0,0,.35),inset 3px 3px 5px rgba(255,255,255,.35)}
.ball i{display:grid;place-items:center;width:52%;height:52%;border-radius:50%;background:#fff;color:#111;font-family:var(--num);font-style:normal;font-size:17px}
.four{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;width:46px;height:46px}
.four i{border-radius:50%;background:var(--c);box-shadow:inset -2px -3px 4px rgba(0,0,0,.3),inset 2px 2px 3px rgba(255,255,255,.35)}
.h-mid{display:flex;align-items:flex-end;justify-content:center;pointer-events:none!important;min-width:0}
.h-chips{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
.chip-sw{width:22px;height:22px;border-radius:7px;border:2px solid #fff;box-sizing:border-box;background:var(--c)}
.chip-cue{width:34px;height:7px;border-radius:4px;background:var(--c)}
.pcard{--bg:var(--p1);--edge:var(--p1-d);background:var(--bg);border-radius:20px;box-shadow:0 7px 0 var(--edge);padding:12px 16px;
  display:flex;align-items:center;gap:14px;text-align:left;transition:transform .06s,box-shadow .06s;min-width:0}
.pcard:active{transform:translateY(4px);box-shadow:0 3px 0 var(--edge)}
.pcard.two{--bg:var(--p2);--edge:var(--p2-d)}
.av{flex:none;display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:#fff;color:var(--bg);font-family:var(--num);font-style:normal;font-size:30px}
.pcard.two .av{color:var(--p2-d)}
.pcard .who{min-width:0;display:flex;flex-direction:column}
.pcard .nm{font-size:26px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .rc{font-size:16px}
.vs{align-self:center;font-family:var(--num);font-size:36px;line-height:1;color:var(--yellow);transform:skewX(-8deg)}
#startBtn{margin-top:auto}

/* compact home: phones. The panels take the whole screen and scroll. */
.compact #home{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:max-content max-content max-content;align-content:start;overflow:auto;pointer-events:auto;
  background:var(--blue) linear-gradient(108deg,transparent 0 18%,var(--band) 18% 46%,transparent 46%);gap:14px 18px;padding:14px 16px 20px}
.compact .h-mid{grid-column:1/-1;order:3}
.compact .logo span{font-size:32px}.compact .logo b{font-size:36px}
.compact.portrait #home{grid-template-columns:minmax(0,1fr)}
.compact #startBtn{margin-top:6px}

/* ---------- in-game scoreboard ---------- */
#hud{position:absolute;top:0;left:0;right:0;height:var(--hud-h);display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;gap:10px;padding:6px 10px 0}
#hud .btn.icon{width:46px;min-height:42px}
.pill{--bg:var(--navy);--edge:var(--navy-d);justify-self:start;max-width:100%;min-width:0;display:flex;align-items:center;gap:10px;background:var(--bg);
  border-radius:16px;box-shadow:0 4px 0 var(--edge);padding:5px 14px 5px 6px;transition:background .2s,box-shadow .2s}
.pill.r{justify-self:end;flex-direction:row-reverse;padding:5px 6px 5px 14px;text-align:right}
.pill.on{--bg:var(--p1);--edge:var(--p1-d)}
.pill.r.on{--bg:var(--p2);--edge:var(--p2-d)}
.pill .av{width:36px;height:36px;font-size:21px;color:var(--p1)}
.pill.r .av{color:var(--p2-d)}
.pill .who{min-width:0;display:flex;flex-direction:column}
.pill .nm{font-size:17px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .sub{font-size:12.5px;line-height:1.1;color:var(--mute);white-space:nowrap}
.pill.on .sub{color:#fff}
.tray{display:flex;gap:3px;min-width:0}
.mb{flex:none;width:17px;height:17px;border-radius:50%;background:var(--c,#333);
  box-shadow:inset -2px -3px 4px rgba(0,0,0,.4),inset 2px 2px 3px rgba(255,255,255,.4)}
.mb.st{background:linear-gradient(#f3ecdc 0 24%,var(--c) 24% 76%,#f3ecdc 76%)}
.mb.slot{background:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.mb.e8{background:#111;box-shadow:inset -2px -3px 4px rgba(0,0,0,.6),inset 2px 2px 3px rgba(255,255,255,.3),0 0 0 2px var(--yellow)}
.pts{font-family:var(--num);font-size:30px;line-height:1;min-width:26px;text-align:center}
#badge{display:flex;align-items:center;gap:8px;background:var(--navy-d);border-radius:999px;padding:6px 14px;font-size:15px;white-space:nowrap}
#badge b{font-family:var(--num);font-weight:400;font-size:17px;color:var(--yellow);letter-spacing:.04em}

#toast{position:absolute;left:50%;top:calc(var(--hud-h) + 14px);transform:translate(-50%,-10px) scale(.96);max-width:min(88%,520px);
  padding:10px 20px;border-radius:999px;background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--card-d);
  font-size:clamp(14px,2.1vw,18px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-wrap:balance}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast.foul{background:var(--p1);color:#fff;box-shadow:0 5px 0 var(--p1-d)}
#toast.good{background:var(--yellow);box-shadow:0 5px 0 var(--yellow-d)}
#fps{position:absolute;left:8px;bottom:6px;font-family:var(--num);font-size:13px;color:#fff;background:rgba(14,26,102,.8);border-radius:8px;padding:2px 8px;pointer-events:none}

/* ---------- controls: same places and behaviour as before, new skin ---------- */
#power,#fine{position:absolute;touch-action:none;border-radius:18px;background:var(--navy);box-shadow:0 5px 0 var(--navy-d)}
#power{left:8px;top:calc(var(--hud-h) + 12px);bottom:14px;width:48px;overflow:hidden}
#powerFill{position:absolute;left:0;right:0;top:0;height:0;background:linear-gradient(180deg,var(--yellow) 0 45%,#ff9a2e 45% 75%,var(--p1) 75%)}
#powerCue{position:absolute;left:50%;top:0;width:11px;height:100%;transform:translate(-50%,calc(-100% + 30px));
  background:linear-gradient(180deg,#2a1710 0 55%,#e2c592 55% 96%,#f4efe2 96% 98.5%,#4aa3c7 98.5%);border-radius:6px;box-shadow:0 0 0 2px rgba(14,26,102,.55)}
#powerNum{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--num);font-size:21px;text-shadow:0 2px 0 var(--navy-d)}
#powerLab{position:absolute;left:0;right:0;bottom:32px;text-align:center;font-size:12px;color:var(--mute)}
#fine{right:8px;top:calc(var(--hud-h) + 12px);bottom:88px;width:48px;
  background-image:repeating-linear-gradient(180deg,transparent 0 9px,rgba(255,255,255,.22) 9px 11px);background-color:var(--navy)}
#fine::after{content:"";position:absolute;left:5px;right:5px;top:50%;height:4px;margin-top:-2px;background:var(--yellow);border-radius:2px}
#fineLab{position:absolute;left:0;right:0;top:7px;text-align:center;font-size:12px;color:var(--mute)}
#spinBtn{position:absolute;right:8px;bottom:14px;width:60px;height:60px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#fffdf6,#e9e0cb 55%,#a99f8a);box-shadow:0 0 0 5px var(--navy),0 5px 0 5px var(--navy-d)}
#spinDot,.sdot{position:absolute;left:50%;top:50%;width:13px;height:13px;margin:-6.5px;border-radius:50%;background:#d6231f;box-shadow:0 0 0 2px rgba(255,255,255,.8)}
#spinPop{position:absolute;right:82px;bottom:14px;background:var(--navy);border-radius:22px;box-shadow:0 6px 0 var(--navy-d);padding:14px;
  display:flex;flex-direction:column;align-items:center;gap:8px}
#spinPad{position:relative;width:150px;height:150px;border-radius:50%;touch-action:none;
  background:radial-gradient(circle at 36% 30%,#fffdf6,#e9e0cb 55%,#a99f8a)}
#spinPad::before{content:"";position:absolute;inset:14%;border-radius:50%;border:2px dashed rgba(26,31,77,.3)}
#spinPad .sdot{width:22px;height:22px;margin:-11px}
#spinHint{font-size:13px;color:var(--mute);text-align:center;max-width:170px}
#app.busy #power,#app.busy #fine,#app.busy #spinBtn{opacity:.4;pointer-events:none}
#power,#fine,#spinBtn{transition:opacity .2s}

.portrait #power{left:84px;right:8px;top:auto;bottom:14px;width:auto;height:46px}
.portrait #powerFill{top:0;bottom:0;right:auto;width:0;height:auto;background:linear-gradient(90deg,var(--yellow) 0 45%,#ff9a2e 45% 75%,var(--p1) 75%)}
.portrait #powerCue{left:0;top:50%;width:100%;height:11px;transform:translate(calc(-100% + 34px),-50%);
  background:linear-gradient(90deg,#2a1710 0 55%,#e2c592 55% 96%,#f4efe2 96% 98.5%,#4aa3c7 98.5%)}
.portrait #powerNum{left:auto;right:12px;bottom:0;top:0;display:grid;place-items:center}
.portrait #powerLab{left:auto;right:50px;top:0;bottom:0;display:grid;place-items:center}
.portrait #fine{left:84px;right:8px;top:auto;bottom:70px;width:auto;height:32px;
  background-image:repeating-linear-gradient(90deg,transparent 0 9px,rgba(255,255,255,.22) 9px 11px)}
.portrait #fine::after{left:50%;right:auto;top:5px;bottom:5px;width:4px;height:auto;margin:0 0 0 -2px}
.portrait #fineLab{left:10px;right:auto;top:0;bottom:0;display:grid;place-items:center}
.portrait #spinBtn{left:12px;right:auto;bottom:26px}
.portrait #spinPop{left:8px;right:auto;bottom:112px}

/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(10,16,70,.62);overflow:auto}
.sheet{width:min(100%,520px);background:var(--navy);border-radius:26px;box-shadow:0 8px 0 var(--navy-d);padding:20px;display:flex;flex-direction:column;gap:16px;
  animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet h2{margin:0;font-family:var(--disp);font-weight:400;font-size:30px;line-height:1}
#sheetBody{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:8px}
.opt{--bg:var(--card);--edge:var(--card-d);background:var(--bg);color:var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--edge);padding:12px 16px;
  display:flex;align-items:center;gap:14px;text-align:left;transition:transform .06s,box-shadow .06s}
.opt:active{transform:translateY(3px);box-shadow:0 3px 0 var(--edge)}
.opt[aria-pressed="true"]{--bg:var(--yellow);--edge:var(--yellow-d)}
.opt .t{display:block;font-size:22px;line-height:1.15}
.opt .d{display:block;font-size:15px;opacity:.86}
.sw{flex:none;width:64px;height:40px;border-radius:9px;background:var(--c);border:5px solid var(--w);box-sizing:border-box}
.cuepic{flex:none;width:150px;height:12px;border-radius:6px;background:var(--c)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.txt{font:inherit;font-size:26px;color:var(--ink);background:#fff;border:0;border-radius:16px;padding:12px 16px;box-shadow:inset 0 4px 0 var(--card-d);width:100%;box-sizing:border-box;
  -webkit-user-select:text;user-select:text}
.rec{display:grid;grid-template-columns:minmax(0,1fr) 56px 56px 72px;gap:6px 10px;align-items:center;font-size:19px}
.rec .hd{font-size:14px;color:var(--mute)}
.rec .n{font-family:var(--num);text-align:center;font-size:22px}
.note{font-size:15px;color:var(--mute);margin:0;line-height:1.4}
.row{display:flex;gap:12px}.row>*{flex:1}

/* ---------- result ---------- */
#result{position:absolute;inset:0;overflow:auto;background:var(--blue) linear-gradient(108deg,transparent 0 22%,var(--band) 22% 64%,transparent 64%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,28px);padding:24px clamp(16px,5vw,60px)}
.win-badge{background:var(--yellow);color:var(--ink);padding:6px 34px 10px;border-radius:20px;box-shadow:0 8px 0 var(--yellow-d);
  font-family:var(--disp);font-size:clamp(44px,8vw,72px);line-height:1;transform:rotate(-3deg);animation:pop .25s ease-out}
.r-vs{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,30px);flex-wrap:wrap}
.r-win{--bg:var(--p1);--edge:var(--p1-d);background:var(--bg);box-shadow:0 8px 0 var(--edge);border-radius:24px;padding:16px 26px;display:flex;align-items:center;gap:16px;min-width:0}
.r-win.two{--bg:var(--p2);--edge:var(--p2-d)}
.r-win .av{width:78px;height:78px;font-size:42px}
.r-win.two .av{color:var(--p2-d)}
.r-win .nm{font-size:clamp(28px,4.4vw,44px);line-height:1.05}
.r-win .rc{font-size:20px}
.r-score{font-family:var(--num);font-size:clamp(56px,9vw,96px);line-height:1;transform:skewX(-8deg);white-space:nowrap}
.r-score b{font-weight:400;color:var(--yellow)}
.r-lose{background:var(--navy);box-shadow:0 8px 0 var(--navy-d);border-radius:24px;padding:12px 20px;display:flex;align-items:center;gap:12px;color:var(--mute);font-size:26px}
.r-lose .av{width:54px;height:54px;font-size:28px;background:var(--mute);color:var(--navy)}
#rStats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:100%;max-width:1040px}
.stat{background:var(--card);color:var(--ink);box-shadow:0 7px 0 var(--card-d);border-radius:20px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.stat .k{font-size:18px}
.stat .v{font-family:var(--num);font-size:46px;line-height:1;white-space:nowrap}
.stat .v b{font-weight:400;color:var(--red)}
.stat .v span{font-size:26px;color:#5b638f;margin-left:6px}
#rWhy{font-size:20px;color:var(--mute);margin:0;text-align:center}
.r-btns{margin-top:8px;display:flex;gap:14px;width:100%;max-width:1040px}
.r-btns .btn{flex:1}.r-btns .btn.big{flex:2}
.r-btns .btn.navy{font-size:26px;border-radius:22px;box-shadow:0 7px 0 var(--edge)}
#nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:20px;line-height:1.6;background:var(--blue)}

@media (max-height:520px){
  :root{--hud-h:50px}
  .pill .av{width:30px;height:30px;font-size:18px}.pill .nm{font-size:15px}.mb{width:14px;height:14px}
  #result{gap:12px;padding-block:16px}
  .r-win .av{width:54px;height:54px;font-size:30px}.r-win{padding:10px 18px}
  .stat .v{font-size:32px}.stat{padding:8px}
}
@media (max-width:640px){
  #badge{display:none}
  #hud{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:6px;padding-inline:6px}
  .pill{gap:6px;padding-right:8px}.pill.r{padding-left:8px}
  .mb{width:12px;height:12px}.tray{gap:2px}
  #rStats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app" class="busy">
  <canvas id="gl"></canvas>

  <section id="home">
    <header class="h-top">
      <div class="logo"><span>딥 포켓</span><b>8</b></div>
      <div class="h-actions">
        <button class="btn" id="recBtn">전적</button>
        <button class="btn icon" id="setBtn" aria-label="설정"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
      </div>
    </header>
    <div class="h-left">
      <div class="lab">게임 고르기</div>

<script>
/* Cue-sports physics: 2D table plane, full 3D spin. Units are metres and seconds.
   createPhysics({ R, pockets }) builds one table: a pool table with six pockets, or a carom table with none. */
function createPhysics(cfg) {
  const R = cfg.R, POCKETED = !!cfg.pockets;
  const HL = 1.27, HW = 0.635, G = 9.8;
  const MU_S = 0.2, MU_R = 0.016, MU_SP = 0.04, E_BALL = 0.96, MU_CUSH = 0.16;
  const GC = 0.088, GS = 0.07, CW = 0.05, PO = 0.03, SO = 0.05;
  const D = Math.SQRT1_2;

  const POCKETS = !POCKETED ? [] : [
    { x: -HL - PO, y: HW + PO, r: 0.068, sink: 0.062, ax: -HL + 0.03, ay: HW - 0.03, nx: -D, ny: D, corner: true },
    { x: 0, y: HW + SO, r: 0.062, sink: 0.05, ax: 0, ay: HW, nx: 0, ny: 1, corner: false },
    { x: HL + PO, y: HW + PO, r: 0.068, sink: 0.062, ax: HL - 0.03, ay: HW - 0.03, nx: D, ny: D, corner: true },
    { x: HL + PO, y: -HW - PO, r: 0.068, sink: 0.062, ax: HL - 0.03, ay: -HW + 0.03, nx: D, ny: -D, corner: true },
    { x: 0, y: -HW - SO, r: 0.062, sink: 0.05, ax: 0, ay: -HW, nx: 0, ny: -1, corner: false },
    { x: -HL - PO, y: -HW - PO, r: 0.068, sink: 0.062, ax: -HL + 0.03, ay: -HW + 0.03, nx: -D, ny: -D, corner: true },
  ];

  // Cushions: a nose line plus (on a pool table) an angled jaw facing at each end.
  const CUSHIONS = [], SEGS = [];
  (function build() {
    const C38 = Math.cos(38 * Math.PI / 180), S38 = Math.sin(38 * Math.PI / 180);
    const C75 = Math.cos(75 * Math.PI / 180), S75 = Math.sin(75 * Math.PI / 180);
    const seg = (p, q) => { const l = Math.hypot(q[0] - p[0], q[1] - p[1]); SEGS.push({ ax: p[0], ay: p[1], bx: q[0], by: q[1], len: l, tx: (q[0] - p[0]) / l, ty: (q[1] - p[1]) / l }); };
    function add(ax, ay, bx, by, ox, oy, aCorner, bCorner) {
      const len = Math.hypot(bx - ax, by - ay), tx = (bx - ax) / len, ty = (by - ay) / len;
      const ja = aCorner ? [C38, S38, 0.065] : [C75, S75, 0.05];
      const jb = bCorner ? [C38, S38, 0.065] : [C75, S75, 0.05];
      const c = {
        a: [ax, ay], b: [bx, by], o: [ox, oy],
        ja: [ax + (-tx * ja[0] + ox * ja[1]) * ja[2], ay + (-ty * ja[0] + oy * ja[1]) * ja[2]],
        jb: [bx + (tx * jb[0] + ox * jb[1]) * jb[2], by + (ty * jb[0] + oy * jb[1]) * jb[2]],
      };
      CUSHIONS.push(c); seg(c.ja, c.a); seg(c.a, c.b); seg(c.b, c.jb);
    }
    function plain(ax, ay, bx, by, ox, oy) {
      // mitred into the corner: the back edge reaches the corner of the rail
      const c = { a: [ax, ay], b: [bx, by], o: [ox, oy] };
      c.ja = [ax + (ox !== 0 ? ox * CW : -Math.sign(bx - ax) * CW), ay + (oy !== 0 ? oy * CW : -Math.sign(by - ay) * CW)];
      c.jb = [bx + (ox !== 0 ? ox * CW : Math.sign(bx - ax) * CW), by + (oy !== 0 ? oy * CW : Math.sign(by - ay) * CW)];
      CUSHIONS.push(c); seg(c.a, c.b);
    }
    if (POCKETED) {
      add(-HL + GC, HW, -GS, HW, 0, 1, true, false);
      add(GS, HW, HL - GC, HW, 0, 1, false, true);
      add(-HL + GC, -HW, -GS, -HW, 0, -1, true, false);
      add(GS, -HW, HL - GC, -HW, 0, -1, false, true);
      add(-HL, -HW + GC, -HL, HW - GC, -1, 0, true, true);
      add(HL, -HW + GC, HL, HW - GC, 1, 0, true, true);
    } else {
      plain(-HL, HW, HL, HW, 0, 1); plain(-HL, -HW, HL, -HW, 0, -1);
      plain(-HL, -HW, -HL, HW, -1, 0); plain(HL, -HW, HL, HW, 1, 0);
    }
  })();

  function newEv() { return { firstHit: null, hits: [], rail: false, pocketed: [] }; }

  function makeWorld(n) {
    const balls = [];
    for (let i = 0; i < n; i++) balls.push({ id: i, x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, wx: 0, wy: 0, wz: 0, on: true, q: [0, 0, 0, 1] });
    return { balls, ev: newEv(), snd: null, track: false, cue: 0 };
  }

  function clone(w) {
    return { balls: w.balls.map(b => ({ id: b.id, x: b.x, y: b.y, px: b.x, py: b.y, vx: 0, vy: 0, wx: 0, wy: 0, wz: 0, on: b.on, q: b.q })), ev: newEv(), snd: null, track: false, cue: w.cue };
  }

  function place(w, id, x, y, rnd) {
    const b = w.balls[id];
    b.x = b.px = x; b.y = b.py = y; b.vx = b.vy = b.wx = b.wy = b.wz = 0; b.on = true;
    if (rnd) {
      const a = rnd() * Math.PI * 2, tl = (rnd() - 0.5) * 0.9;
      const cz = Math.cos(a / 2), sz = Math.sin(a / 2), cx = Math.cos(tl / 2), sx = Math.sin(tl / 2);
      b.q = [cz * sx, sz * sx, sz * cx, cz * cx];
    }
  }

  function strike(w, ang, V, a, bb) {
    const c = w.balls[w.cue], dx = Math.cos(ang), dy = Math.sin(ang);
    c.vx = V * dx; c.vy = V * dy;
    const k = 2.5 * V * bb / R;
    c.wx = -dy * k; c.wy = dx * k; c.wz = 2.5 * V * a / R;
    w.ev = newEv();
  }

  function motion(w, b, h) {
    const ux = b.vx - R * b.wy, uy = b.vy + R * b.wx, us = Math.hypot(ux, uy);
    if (us > 1e-4) {
      const dec = MU_S * G * h;
      if (us <= 3.5 * dec) {
        b.vx -= (2 / 7) * ux; b.vy -= (2 / 7) * uy;
        b.wy = b.vx / R; b.wx = -b.vy / R;
      } else {
        const nx = ux / us, ny = uy / us;
        b.vx -= dec * nx; b.vy -= dec * ny;
        b.wx -= (2.5 / R) * dec * ny; b.wy += (2.5 / R) * dec * nx;
      }
    } else {
      const sp = Math.hypot(b.vx, b.vy), dec = MU_R * G * h;
      if (sp <= dec || sp < 0.004) { b.vx = b.vy = 0; b.wx = b.wy = 0; }
      else { const s = (sp - dec) / sp; b.vx *= s; b.vy *= s; b.wy = b.vx / R; b.wx = -b.vy / R; }
    }
    const dz = (2.5 * MU_SP * G / R) * h;
    if (Math.abs(b.wz) <= dz) b.wz = 0; else b.wz -= Math.sign(b.wz) * dz;
    b.x += b.vx * h; b.y += b.vy * h;
    if (w.track) {
      const wm = Math.hypot(b.wx, b.wy, b.wz);
      if (wm > 1e-6) {
        const ang = wm * h, s = Math.sin(ang / 2) / wm, c = Math.cos(ang / 2);
        const dx = b.wx * s, dy = b.wy * s, dzq = b.wz * s, q = b.q, qx = q[0], qy = q[1], qz = q[2], qw = q[3];
        q[0] = c * qx + dx * qw + dy * qz - dzq * qy;
        q[1] = c * qy + dy * qw + dzq * qx - dx * qz;
        q[2] = c * qz + dzq * qw + dx * qy - dy * qx;
        q[3] = c * qw - dx * qx - dy * qy - dzq * qz;
      }
    }
  }

  function hitSeg(w, b, s) {
    let u = (b.x - s.ax) * s.tx + (b.y - s.ay) * s.ty;
    u = u < 0 ? 0 : u > s.len ? s.len : u;
    const cx = s.ax + s.tx * u, cy = s.ay + s.ty * u;
    let nx = b.x - cx, ny = b.y - cy;
    const d2 = nx * nx + ny * ny;
    if (d2 >= R * R || d2 < 1e-14) return;
    const d = Math.sqrt(d2); nx /= d; ny /= d;
    b.x = cx + nx * R; b.y = cy + ny * R;
    const vn = b.vx * nx + b.vy * ny;
    if (vn >= 0) return;
    const e = Math.max(0.62, 0.87 - 0.035 * -vn);
    const tx = -ny, ty = nx;
    // side spin grips the cushion and bends the rebound
    const slip = b.vx * tx + b.vy * ty - R * b.wz;
    const lim = MU_CUSH * (1 + e) * -vn;
    let dvt = -(2 / 7) * slip;
    if (dvt > lim) dvt = lim; else if (dvt < -lim) dvt = -lim;
    b.vx += -(1 + e) * vn * nx + dvt * tx;
    b.vy += -(1 + e) * vn * ny + dvt * ty;
    b.wz -= (2.5 / R) * dvt;
    // the nose sits above centre: roll into the rail is mostly killed and slightly reversed,
    // roll along the rail survives
    const wn = b.wx * nx + b.wy * ny, wt = b.wx * tx + b.wy * ty;
    const wn2 = wn * 0.9, wt2 = wt * -0.15;
    b.wx = wn2 * nx + wt2 * tx; b.wy = wn2 * ny + wt2 * ty;
    if (w.ev.firstHit != null) w.ev.rail = true;
    if (w.snd && -vn > 0.08) w.snd.push({ t: 'rail', v: -vn });
  }

  function sub(w, h) {
    const bs = w.balls, n = bs.length, cue = w.cue;
    for (let i = 0; i < n; i++) if (bs[i].on) motion(w, bs[i], h);
    for (let i = 0; i < n; i++) {
      const a = bs[i]; if (!a.on) continue;
      for (let j = i + 1; j < n; j++) {
        const b = bs[j]; if (!b.on) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
        if (d2 >= 4 * R * R || d2 < 1e-14) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, ov = (2 * R - d) / 2;
        a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
        const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rel >= 0) continue;
        const jn = -(1 + E_BALL) / 2 * rel;
        a.vx -= jn * nx; a.vy -= jn * ny; b.vx += jn * nx; b.vy += jn * ny;
        if (i === cue || j === cue) {
          const o = i === cue ? j : i;
          if (w.ev.firstHit == null) w.ev.firstHit = o;
          if (w.ev.hits.indexOf(o) < 0) w.ev.hits.push(o);
        }
        if (w.snd && -rel > 0.03) w.snd.push({ t: 'ball', v: -rel });
      }
    }
    for (let i = 0; i < n; i++) {
      const b = bs[i]; if (!b.on) continue;
      if (Math.abs(b.x) > HL - R - 0.002 || Math.abs(b.y) > HW - R - 0.002) {
        if (b.vx !== 0 || b.vy !== 0) for (let k = 0; k < SEGS.length; k++) hitSeg(w, b, SEGS[k]);
        if (!POCKETED) continue;
        let pk = -1;
        for (let k = 0; k < 6; k++) {
          const p = POCKETS[k], dx = b.x - p.x, dy = b.y - p.y;
          if (dx * dx + dy * dy < p.sink * p.sink) { pk = k; break; }
        }
        if (pk < 0 && (Math.abs(b.x) > HL + 0.012 || Math.abs(b.y) > HW + 0.012)) {
          let best = 1e9;
          for (let k = 0; k < 6; k++) { const p = POCKETS[k], dd = (b.x - p.x) ** 2 + (b.y - p.y) ** 2; if (dd < best) { best = dd; pk = k; } }
        }
        if (pk >= 0) {
          b.on = false;
          w.ev.pocketed.push({ id: b.id, pocket: pk });
          if (w.snd) w.snd.push({ t: 'pocket', id: b.id, pocket: pk, x: b.x, y: b.y });
          b.vx = b.vy = b.wx = b.wy = b.wz = 0;
        }
      }
    }
  }

  function step(w, dt) {
    let vmax = 0;
    for (const b of w.balls) if (b.on) { b.px = b.x; b.py = b.y; const s = Math.hypot(b.vx, b.vy); if (s > vmax) vmax = s; }
    const n = Math.max(1, Math.ceil(vmax * dt / (R * 0.3)));
    const h = dt / n;
    for (let i = 0; i < n; i++) sub(w, h);
  }

  function rest(w) {
    for (const b of w.balls) if (b.on && (b.vx !== 0 || b.vy !== 0 || b.wx !== 0 || b.wy !== 0)) return false;
    return true;
  }

  function run(w, maxT) {
    let t = 0;
    while (!rest(w) && t < (maxT || 25)) { step(w, 1 / 120); t += 1 / 120; }
    for (const b of w.balls) b.wz = 0;
    return w.ev;
  }

  function rayCircle(ox, oy, dx, dy, cx, cy, rad) {
    const fx = cx - ox, fy = cy - oy, proj = fx * dx + fy * dy;
    const perp2 = fx * fx + fy * fy - proj * proj;
    if (perp2 >= rad * rad) return Infinity;
    const t = proj - Math.sqrt(rad * rad - perp2);
    return t > 1e-6 ? t : Infinity;
  }

  // First thing a ball meets when rolled from (ox,oy) along (dx,dy): another ball, a cushion or a pocket.
  function cast(w, ox, oy, dx, dy, skip) {
    let best = { t: 6, type: 'none' };
    for (const b of w.balls) {
      if (!b.on || b.id === skip) continue;
      const t = rayCircle(ox, oy, dx, dy, b.x, b.y, 2 * R);
      if (t < best.t) best = { t, type: 'ball', ball: b.id };
    }
    for (const s of SEGS) {
      for (const sg of [1, -1]) {
        const px = s.ax - s.ty * R * sg, py = s.ay + s.tx * R * sg;
        const den = dx * s.ty - dy * s.tx;
        if (Math.abs(den) < 1e-9) continue;
        const t = ((px - ox) * s.ty - (py - oy) * s.tx) / den;
        if (t <= 1e-6 || t >= best.t) continue;
        const u = (ox + dx * t - px) * s.tx + (oy + dy * t - py) * s.ty;
        if (u < 0 || u > s.len) continue;
        best = { t, type: 'rail', nx: -s.ty * sg, ny: s.tx * sg };
      }
      for (const [ex, ey] of [[s.ax, s.ay], [s.bx, s.by]]) {
        const t = rayCircle(ox, oy, dx, dy, ex, ey, R);
        if (t < best.t) { const gx = ox + dx * t, gy = oy + dy * t; best = { t, type: 'rail', nx: (gx - ex) / R, ny: (gy - ey) / R }; }
      }
    }
    for (const p of POCKETS) {
      const t = rayCircle(ox, oy, dx, dy, p.x, p.y, p.sink);
      if (t < best.t) best = { t, type: 'pocket' };
    }
    best.gx = ox + dx * best.t; best.gy = oy + dy * best.t;
    if (best.type === 'ball') {
      const b = w.balls[best.ball];
      best.nx = (b.x - best.gx) / (2 * R); best.ny = (b.y - best.gy) / (2 * R);
      best.cut = Math.acos(Math.max(-1, Math.min(1, dx * best.nx + dy * best.ny)));
    }
    return best;
  }

  function predict(w, ang) {
    const c = w.balls[w.cue];
    return cast(w, c.x, c.y, Math.cos(ang), Math.sin(ang), w.cue);
  }

  // Where the cue ball travels after its first contact, for the long aiming guide.
  function cuePath(w, ang, V, a, bb, maxT) {
    const w2 = clone(w); strike(w2, ang, V, a, bb);
    const c = w2.balls[w2.cue], pts = [];
    let t = 0, started = false;
    while (t < (maxT || 2.2) && c.on) {
      step(w2, 1 / 120); t += 1 / 120;
      if (!started && (w2.ev.firstHit != null)) started = true;
      if (started) { pts.push(c.x, c.y); if (c.vx === 0 && c.vy === 0 && c.wx === 0 && c.wy === 0) break; }
    }
    return pts;
  }

  function pathClear(w, x0, y0, x1, y1, skip, rad) {
    const len = Math.hypot(x1 - x0, y1 - y0); if (len < 1e-9) return true;
    const tx = (x1 - x0) / len, ty = (y1 - y0) / len, lim = (rad || 2 * R) - 0.0015;
    for (const b of w.balls) {
      if (!b.on || skip.indexOf(b.id) >= 0) continue;
      let u = (b.x - x0) * tx + (b.y - y0) * ty; u = u < 0 ? 0 : u > len ? len : u;
      const ex = b.x - (x0 + tx * u), ey = b.y - (y0 + ty * u);
      if (ex * ex + ey * ey < lim * lim) return false;
    }
    return true;
  }

  function isFree(w, x, y, skipId) {
    if (Math.abs(x) > HL - R || Math.abs(y) > HW - R) return false;
    for (const b of w.balls) {
      if (!b.on || b.id === skipId) continue;
      if ((b.x - x) ** 2 + (b.y - y) ** 2 < (2 * R + 0.0008) ** 2) return false;
    }
    return true;
  }

  function findFree(w, x, y, skipId) {
    if (isFree(w, x, y, skipId)) return [x, y];
    for (let r = 0.01; r < 1.5; r += 0.01) for (let k = 0; k < 24; k++) {
      const a = k * Math.PI / 12, px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      if (isFree(w, px, py, skipId)) return [px, py];
    }
    return [x, y];
  }

  return { R, HL, HW, CW, PO, SO, POCKETED, POCKETS, CUSHIONS, SEGS, makeWorld, clone, place, strike, step, rest, run, cast, predict, cuePath, pathClear, isFree, findFree, newEv };
}
/* Rules, turn flow, statistics and the computer player for 8-ball, 9-ball and four-ball carom. No DOM in here. */
function createGame(PH) {
  const typeOf = id => id === 8 ? 'eight' : id < 8 ? 'solid' : 'stripe';
  const GROUP_KO = { solid: '단색', stripe: '줄무늬' };

  for (const n of names) { const r = rec[n]; grid.append(el('span', { text: n }), el('span', { class: 'n', text: r.w }), el('span', { class: 'n', text: r.l }), el('span', { class: 'n', text: r.best })); }
  openSheet('전적', [names.length ? grid : el('p', { class: 'note', text: '아직 끝난 판이 없습니다. 한 판 끝나면 이름별로 승패가 쌓입니다.' }),
    names.length ? el('button', { class: 'btn white', text: '전적 모두 지우기', onclick: () => { rec = {}; store.set('rec', rec); series.key = ''; paintHome(); sheetRecords(); } }) : null]);
}
function sheetName(i) {
  if (i === 1 && prefs.vsAI) return;
  const input = el('input', { class: 'txt', id: 'nameInput', maxlength: '10', value: prefs.names[i], 'aria-label': '이름', autocomplete: 'off' });
  const save = () => { const v = input.value.trim().slice(0, 10); if (v && v !== prefs.names[1 - i]) { prefs.names[i] = v; savePrefs(); } closeSheet(); paintHome(); };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
  openSheet(`${i + 1}번 선수 이름`, [input, el('p', { class: 'note', text: '전적은 이름별로 따로 쌓입니다. 열 글자까지.' }), el('button', { class: 'btn yellow', text: '저장', onclick: save })]);
  setTimeout(() => { try { input.focus(); input.select(); } catch (e) {} }, 60);
}
function sheetPause() {
  openSheet('잠깐 멈춤', [
    el('button', { class: 'btn yellow', text: '이어서 하기', onclick: closeSheet }),
    el('div', { class: 'row' }, [el('button', { class: 'btn white', text: '조준선 ' + GUIDE[prefs.guide][0], onclick: sheetGuide }), el('button', { class: 'btn white', text: '설정', onclick: sheetSettings })]),
    el('div', { class: 'row' }, [el('button', { class: 'btn', style: '--bg:#0e1a66;--edge:#08104a', text: '다시 시작', onclick: () => { closeSheet(); startMatch(game.turn); } }),
      el('button', { class: 'btn', style: '--bg:#0e1a66;--edge:#08104a', text: '처음으로', onclick: goHome })]),
  ]);
}
$('#clothBtn').addEventListener('click', () => { SND.init(); SND.tap(); sheetCloth(); });
$('#cueBtn').addEventListener('click', () => { SND.init(); SND.tap(); sheetCue(); });
$('#guideBtn').addEventListener('click', () => { SND.init(); SND.tap(); sheetGuide(); });
$('#setBtn').addEventListener('click', () => { SND.init(); SND.tap(); sheetSettings(); });
$('#recBtn').addEventListener('click', () => { SND.init(); SND.tap(); sheetRecords(); });
$('#pc0').addEventListener('click', () => { SND.init(); SND.tap(); sheetName(0); });
$('#pc1').addEventListener('click', () => { SND.init(); SND.tap(); sheetName(1); });
$('#menuBtn').addEventListener('click', () => { SND.tap(); sheetPause(); });
seg('#segOpp', () => prefs.vsAI ? 1 : 0, v => { prefs.vsAI = v === '1'; savePrefs(); paintHome(); });
seg('#segLvl', () => prefs.level, v => { prefs.level = +v; savePrefs(); paintHome(); });
seg('#segTarget', () => prefs.target, v => { prefs.target = +v; savePrefs(); });
$('#startBtn').addEventListener('click', () => { SND.init(); SND.tap(); startMatch(0); });
$('#againBtn').addEventListener('click', () => { SND.init(); SND.tap(); startMatch(st.lastLoser == null ? 0 : st.lastLoser); });
$('#homeBtn').addEventListener('click', () => { SND.tap(); goHome(); });

/* ================= match flow ================= */
function startMatch(first) {
  const names = [prefs.names[0], oppName()], key = names.join('\u0001') + prefs.mode;
  if (series.key !== key) { series.key = key; series.s = [0, 0]; }
  game.start(prefs.mode, names, prefs.vsAI, { level: prefs.level, target: prefs.target, first: first || 0 });
  enterGame();
  toast(game.mode.id === 'four' ? `${game.players[game.turn].name}부터. 빨간 공 두 개를 모두 맞히세요.` : `${game.players[game.turn].name}의 브레이크. 테이블을 끌어 조준하고 큐 막대를 당겼다 놓으세요.`, '', 3600);
}
function enterGame() {
  scene.setTable(game.mode.table);
  $('#home').hidden = true; $('#result').hidden = true; $('#hud').hidden = false; closeSheet();
  for (const id of ['#power', '#fine', '#spinBtn']) $(id).hidden = false;
  st.aim = 0; st.ai = null; st.cueAnim = null; st.rev++;
  st.phase = 'aim'; layout(); beginTurn(true);
}
function beginTurn(first) {
  st.phase = 'aim'; st.power = 0; st.spin = { x: 0, y: 0 }; setPowerUI(0); setSpinUI(); $('#spinPop').hidden = true;
  const p = game.players[game.turn], c = game.cueBall();
  if (p.ai) { st.phase = 'ai'; st.ai = { t: 0, plan: null, from: st.aim }; }
  else if (!first || game.mode.table === 'carom') {
    let best = null, bd = 1e9;
    for (const id of game.legal()) { const b = game.world.balls[id], d = Math.hypot(b.x - c.x, b.y - c.y); if (d < bd) { bd = d; best = b; } }
    if (best) st.aim = Math.atan2(best.y - c.y, best.x - c.x);
  }
  hud(); scene.invalidate(); snapshot();
}
function shoot(V, a, b) {
  game.beginShot(); st.phase = 'strike'; $('#spinPop').hidden = true;
  st.cueAnim = { t: 0, from: 0.03 + st.power * 0.2, V, a, b };
  hud();
}
function endShot() {
  const out = game.resolve(); st.rev++;
  if (game.over) return finish();
  toast(out.msg, out.kind, out.dur);
  beginTurn(false);
}
function finish() {
  st.phase = 'over';
  const w = game.over.winner, l = 1 - w, pw = game.players[w], pl = game.players[l];
  const rw = recOf(pw.name), rl = recOf(pl.name);
  rw.w++; rw.streak++; rw.best = Math.max(rw.best, rw.streak); rl.l++; rl.streak = 0; store.set('rec', rec);
  series.s[w]++; st.lastLoser = l; store.set('save', null);
  const win = $('#rWin'); win.className = 'r-win' + (w === 1 ? ' two' : '');
  win.querySelector('.av').textContent = w + 1; win.querySelector('.nm').textContent = pw.name;
  win.querySelector('.rc').textContent = `${rw.w}승 ${rw.l}패` + (rw.streak >= 2 ? ` · ${rw.streak}연승 중` : '');
  $('#rLose .av').textContent = l + 1; $('#rLose .nm').textContent = pl.name;
  const sc = $('#rScore'); sc.textContent = ''; sc.append(el('b', { text: series.s[w] }), ' : ' + series.s[l]);
  const pct = p => p.shots ? Math.round(p.made / p.shots * 100) + '%' : '0%';
  const rows = [['샷 성공률', pct(pw), pct(pl)], ['연속 성공', pw.best, pl.best], ['친 횟수', pw.shots, pl.shots], ['파울', pw.fouls, pl.fouls]];
  if (game.mode.target) rows[2] = ['점수', pw.score, pl.score];
  const box = $('#rStats'); box.textContent = '';
  for (const [k, a, b] of rows) box.appendChild(el('div', { class: 'stat' }, [el('div', { class: 'k', text: k }), el('div', { class: 'v' }, [el('b', { text: a }), el('span', { text: b })])]));
  $('#rWhy').textContent = game.over.why;
  $('#hud').hidden = true; for (const id of ['#power', '#fine', '#spinBtn']) $(id).hidden = true; $('#spinPop').hidden = true;
  $('#result').hidden = false; app.classList.add('busy'); SND.win();
}

/* ================= scoreboard ================= */
function hud() {
  const m = game.mode;
  for (let i = 0; i < 2; i++) {
    const box = $('#p' + i), p = game.players[i], tray = box.querySelector('.tray'), pts = box.querySelector('.pts');
    box.classList.toggle('on', game.turn === i && st.phase !== 'over');
    box.querySelector('.nm').textContent = p.name; tray.textContent = ''; pts.textContent = '';
    let sub = '';
    if (m.id === 'eight') {
      const rem = m.remaining(game, i); sub = p.group ? game.GROUP_KO[p.group] + ' 공' : '공 미정';
      if (!rem) for (let k = 0; k < 7; k++) tray.appendChild(el('i', { class: 'mb slot' }));
      else if (!rem.length) tray.appendChild(el('i', { class: 'mb e8' }));
      else for (const id of rem) tray.appendChild(el('i', { class: 'mb' + (id > 8 ? ' st' : ''), style: '--c:' + ballCss(id) }));
    } else if (m.id === 'nine') { sub = game.turn === i ? `다음 ${m.lowest(game)}번 공` : `성공 ${p.made}`; }
    else { sub = `목표 ${game.target}점`; pts.textContent = p.score; }
    box.querySelector('.sub').textContent = sub;
  }
  const badge = $('#badge'); badge.textContent = '';
  badge.appendChild(el('b', { text: m.name }));
  if (m.id === 'nine') {
    badge.appendChild(document.createTextNode('다음'));
    const low = m.lowest(game); for (let id = 1; id <= 9; id++) if (game.world.balls[id].on) badge.appendChild(el('i', { class: 'mb' + (id > 8 ? ' st' : ''), style: `--c:${ballCss(id)};` + (id === low ? 'box-shadow:0 0 0 2px #ffd21f' : 'opacity:.55') }));
  } else if (m.id === 'eight') badge.appendChild(document.createTextNode(game.isBreak ? '브레이크' : game.players.every(p => !p.group) ? '아직 공 미정' : '8번은 마지막에'));
  else badge.appendChild(document.createTextNode('빨간 공 두 개 맞히면 1점'));
  app.classList.toggle('busy', !(st.phase === 'aim' && !game.players[game.turn].ai));
}
function setPowerUI(p) {
  const tr = $('#power'), fill = $('#powerFill'), c = $('#powerCue');
  $('#powerNum').textContent = Math.round(p * 100);
  if (scene.portrait) { fill.style.height = ''; fill.style.width = (p * 100) + '%'; c.style.transform = `translate(calc(-100% + 34px + ${p * (tr.clientWidth - 34)}px),-50%)`; }
  else { fill.style.width = ''; fill.style.height = (p * 100) + '%'; c.style.transform = `translate(-50%,calc(-100% + 30px + ${p * (tr.clientHeight - 30)}px))`; }
}
function setSpinUI() {
  const s = st.spin, k = 0.36;
  $('#spinDot').style.transform = `translate(${s.x * k * 60}px,${-s.y * k * 60}px)`;
  $('#spinPadDot').style.transform = `translate(${s.x * k * 150}px,${-s.y * k * 150}px)`;
}

/* ================= computer turn ================= */
function aiTick(dt) {
  const a = st.ai; a.t += dt;
  if (!a.plan) {
    if (a.t < 0.5) return;
    a.plan = game.aiPlan(); a.t0 = a.t; a.pw = Math.min(1, game.powerOf(a.plan.V));
    if (a.plan.pos) { const c = game.cueBall(); c.x = c.px = a.plan.pos[0]; c.y = c.py = a.plan.pos[1]; game.placing = null; }
    let d = a.plan.angle - a.from; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; a.delta = d;
    return;
  }
  const t = a.t - a.t0, e = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
  st.aim = a.from + a.delta * e(t / 0.75);
  st.power = a.pw * e((t - 0.85) / 0.45); setPowerUI(st.power);
  if (t > 1.45) { st.aim = a.plan.angle; st.ai = null; shoot(a.plan.V, 0, 0); }
}

/* ================= input ================= */
let drag = null;
const humanAiming = () => st.phase === 'aim' && !game.players[game.turn].ai && $('#sheet').hidden;
function tryPlace(p) {
  const P = game.P, { R, HL, HW } = P, w = game.world, c = game.cueBall();
  let x = Math.max(-HL + R, Math.min(HL - R, p.x)), y = Math.max(-HW + R, Math.min(HW - R, p.y));
  if (game.placing === 'kitchen') x = Math.min(x, -HL / 2);
  if (P.isFree(w, x, y, c.id)) { c.x = c.px = x; c.y = c.py = y; return; }
  for (const b of w.balls) {
    if (!b.on || b.id === c.id) continue;
    const d = Math.hypot(x - b.x, y - b.y);
    if (d < 2 * R + 0.001 && d > 1e-6) { const k = (2 * R + 0.0012) / d, nx = b.x + (x - b.x) * k, ny = b.y + (y - b.y) * k; if (P.isFree(w, nx, ny, c.id) && (game.placing !== 'kitchen' || nx <= -HL / 2)) { c.x = c.px = nx; c.y = c.py = ny; } return; }
  }
}
canvas.addEventListener('pointerdown', e => {
  SND.init(); if (!humanAiming()) return;
  const R = game.P.R, p = scene.toTable(e, R), c = game.cueBall(), d = Math.hypot(p.x - c.x, p.y - c.y);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  if (game.placing && d < Math.max(0.075, 26 / scene.ppm)) drag = { kind: 'cue', id: e.pointerId };
  else drag = { kind: 'aim', id: e.pointerId, last: Math.atan2(p.y - c.y, p.x - c.x), sx: e.clientX, sy: e.clientY, moved: 0 };
  e.preventDefault();
});
canvas.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId || !humanAiming()) return;
  const p = scene.toTable(e, game.P.R), c = game.cueBall();
  if (drag.kind === 'cue') tryPlace(p);
  else {
    drag.moved = Math.max(drag.moved, Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy));
    const a = Math.atan2(p.y - c.y, p.x - c.x);
    if (Math.hypot(p.x - c.x, p.y - c.y) > 0.07 && drag.moved > 6) {
      let da = a - drag.last; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
      st.aim += da;
    }
    drag.last = a;
  }
  scene.invalidate();
});
const endDrag = e => {
  if (!drag || drag.id !== e.pointerId) return;
  if (drag.kind === 'aim' && drag.moved <= 6 && humanAiming()) { const R = game.P.R, p = scene.toTable(e, R), c = game.cueBall(); if (Math.hypot(p.x - c.x, p.y - c.y) > R) st.aim = Math.atan2(p.y - c.y, p.x - c.x); }
  drag = null; scene.invalidate(); snapshot();
};
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);

(function powerCtl() {
  const box = $('#power'); let id = null;
  const read = e => { const r = box.getBoundingClientRect(); return Math.max(0, Math.min(1, scene.portrait ? (e.clientX - r.left - 30) / (r.width - 60) : (e.clientY - r.top - 26) / (r.height - 52))); };
  box.addEventListener('pointerdown', e => { SND.init(); if (!humanAiming()) return; id = e.pointerId; try { box.setPointerCapture(id); } catch (err) {} st.power = read(e); setPowerUI(st.power); scene.invalidate(); e.preventDefault(); });
  box.addEventListener('pointermove', e => { if (id !== e.pointerId) return; st.power = read(e); setPowerUI(st.power); scene.invalidate(); });
  const up = (e, cancel) => {
    if (id !== e.pointerId) return; id = null;
    const p = st.power;
    if (!cancel && p > 0.03 && humanAiming()) shoot(game.vOf(p), st.spin.x * 0.5, st.spin.y * 0.5); else { st.power = 0; setPowerUI(0); }
    scene.invalidate();
  };
  box.addEventListener('pointerup', e => up(e, false)); box.addEventListener('pointercancel', e => up(e, true));
})();
(function fineCtl() {
  const box = $('#fine'); let id = null, last = 0, off = 0;
  const pos = e => scene.portrait ? e.clientX : e.clientY;
  box.addEventListener('pointerdown', e => { SND.init(); if (!humanAiming()) return; id = e.pointerId; last = pos(e); try { box.setPointerCapture(id); } catch (err) {} e.preventDefault(); });
  box.addEventListener('pointermove', e => {
    if (id !== e.pointerId) return; const d = pos(e) - last; last = pos(e);
    st.aim += d * 0.0009 * (scene.portrait ? -1 : 1); off += d;
    box.style.backgroundPosition = scene.portrait ? `${off}px 0` : `0 ${off}px`; scene.invalidate();
  });
  const up = e => { if (id === e.pointerId) id = null; };
  box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
})();
(function spinCtl() {
  const pop = $('#spinPop'), pad = $('#spinPad');
  $('#spinBtn').addEventListener('click', () => {
    if (!humanAiming()) return; SND.tap(); pop.hidden = !pop.hidden; setSpinUI();
    $('#spinHint').textContent = '위는 밀어치기, 아래는 끌어치기, 좌우는 쿠션에서 꺾임. ' + (prefs.guide >= 3 ? '노란 점이 큐볼이 갈 길입니다.' : '조준선을 길게로 하면 큐볼이 갈 길이 보입니다.');
  });
  const set = e => {
    const r = pad.getBoundingClientRect(); let x = (e.clientX - r.left) / r.width * 2 - 1, y = -((e.clientY - r.top) / r.height * 2 - 1);
    x /= 0.72; y /= 0.72; const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
    st.spin = { x, y }; setSpinUI(); scene.invalidate();
  };
  let id = null;
  pad.addEventListener('pointerdown', e => { id = e.pointerId; try { pad.setPointerCapture(id); } catch (err) {} set(e); e.preventDefault(); });
  pad.addEventListener('pointermove', e => { if (id === e.pointerId) set(e); });
  pad.addEventListener('pointerup', () => { id = null; }); pad.addEventListener('pointercancel', () => { id = null; });
  $('#spinReset').addEventListener('click', () => { SND.tap(); st.spin = { x: 0, y: 0 }; setSpinUI(); scene.invalidate(); });
})();
document.addEventListener('contextmenu', e => e.preventDefault());

// Android back button: close whatever is on top; false means "nothing left, leave the app".
window.__back = function () {
  if (!$('#sheet').hidden) { closeSheet(); return true; }
  if (!$('#spinPop').hidden) { $('#spinPop').hidden = true; return true; }
  if (st.phase === 'over') { goHome(); return true; }
  if (st.phase !== 'home') { sheetPause(); return true; }
  return false;
};

/* ================= frame loop ================= */
let lastT = 0, acc = 0, fpsN = 0, fpsT = 0;
function drain() {
  const s = game.world.snd; if (!s.length) return;
  for (const e of s) {
    if (e.t === 'ball') SND.ball(e.v); else if (e.t === 'rail') SND.rail(e.v);
    else if (e.t === 'pocket') { SND.pocket(); scene.fall(game.P, e.id, e.x, e.y, e.pocket); }
  }
  s.length = 0;
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastT) / 1000 || 0); lastT = now;
  const w = game.world, P = game.P, paused = !$('#sheet').hidden;
  let animating = false, alpha = 1, pull = 0.03 + st.power * 0.2;
  if (st.phase === 'ai' && !paused) { aiTick(dt); animating = true; }
  if (st.phase === 'strike' && !paused) {
    const ca = st.cueAnim; ca.t += dt; animating = true;
    const k = Math.min(1, ca.t / 0.1); pull = ca.from * (1 - k * k) - 0.004 * k;
    if (ca.t >= 0.1) { P.strike(w, st.aim, ca.V, ca.a, ca.b); SND.cue(ca.V); st.phase = 'sim'; acc = 0; st.settle = 0; st.power = 0; setPowerUI(0); }
  }
  if (st.phase === 'sim' && !paused) {
    // once everything is crawling, run the clock faster so nobody waits on the last roll
    let vmax = 0; for (const b of w.balls) if (b.on) { const s = Math.abs(b.vx) + Math.abs(b.vy); if (s > vmax) vmax = s; }
    acc += dt * (vmax < 0.4 ? 2.1 : 1.12);
    let n = 0; while (acc >= TICK && n < 30) { P.step(w, TICK); acc -= TICK; n++; }
    if (n === 30) acc = 0;
    alpha = acc / TICK; drain(); animating = true;
    if (P.rest(w)) { st.settle += dt; if (st.settle > 0.24) endShot(); }
  }
  const aiming = st.phase === 'aim' || (st.phase === 'ai' && st.ai && st.ai.plan) || st.phase === 'strike' || st.phase === 'home';
  const drew = scene.frame({
    game, alpha, aim: st.aim, power: st.power, pull, spin: st.spin, rev: st.rev, animating,
    showCue: aiming, showGuide: (st.phase === 'aim' || (st.phase === 'ai' && st.ai && st.ai.plan)), level: prefs.guide,
    legalIds: st.phase === 'home' ? [] : game.legal(), hand: !!game.placing && st.phase === 'aim',
  }, dt);
  if (prefs.fps) {
    fpsN++; fpsT += dt;
    if (fpsT >= 0.5) { $('#fps').textContent = `${Math.round(fpsN / fpsT)} FPS · ${scene.pixelRatio.toFixed(2)}x` + (drew ? '' : ' · 대기'); fpsN = 0; fpsT = 0; }
  }
}

/* ================= saving ================= */
function snapshot() {
  if (st.phase === 'home' || st.phase === 'over') return;
  const d = { v: 2, game: game.serialize(), aim: st.aim, series };
  store.set('save', d);
  try { const h = window.claude && window.claude.hot; if (h && h.snapshot) h.snapshot(d); } catch (e) {}
}
function start(data) {
  if (!(data && data.v === 2)) data = store.get('save', null);
  $('#fps').hidden = !prefs.fps;
  if (data && data.v === 2 && game.restore(data.game)) {
    if (data.series) { series.key = data.series.key; series.s = data.series.s; }
    prefs.mode = game.modeId; st.aim = data.aim || 0;
    enterGame();
  } else goHome();
  requestAnimationFrame(frame);
}
window.__dp8 = { game, st, prefs, scene, startMatch, goHome, shoot, endShot };
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
