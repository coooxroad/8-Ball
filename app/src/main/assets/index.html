<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
body{margin:0}
[hidden]{display:none!important}
@font-face{font-family:'Gothic A1';font-weight:300;font-display:swap;src:url(fonts/GothicA1-Light.woff2) format('woff2')}
@font-face{font-family:'Gothic A1';font-weight:500;font-display:swap;src:url(fonts/GothicA1-Medium.woff2) format('woff2')}
@font-face{font-family:'Gothic A1';font-weight:700;font-display:swap;src:url(fonts/GothicA1-Bold.woff2) format('woff2')}
@font-face{font-family:'Gothic A1';font-weight:800;font-display:swap;src:url(fonts/GothicA1-ExtraBold.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-weight:100 900;font-display:swap;src:url(fonts/Outfit.woff2) format('woff2')}
</style>
</head>
<body>
<title>브레이크타임</title>
<style>
/* Layout: a live 3D table in the middle; quiet panels dock left and right of it on the home screen and
   leave during play, when only a slim scoreboard and the edge controls remain.
   Two looks share the layout: "light" (white cards on pale grey, one blue) and "dark" (glass panels on near-black, one cyan). */
:root{color-scheme:dark;--hud-h:60px}
#app[data-theme="light"]{
  --bg:#eef0f3;--fg:#191f28;--fg2:#333d4b;--sub:#6b7684;
  --panel:#ffffff;--bd:transparent;--sh:0 1px 2px rgba(25,31,40,.06),0 6px 16px rgba(25,31,40,.08);
  --hair:#f2f4f6;--opt:#f2f4f6;--sheet:#ffffff;--scrim:rgba(25,31,40,.42);
  --acc:#2f6bff;--acc-fg:#ffffff;--sel-bg:#ffffff;--sel-bd:#2f6bff;
  --seg:#e2e6ea;--seg-on:#ffffff;--seg-sh:0 1px 3px rgba(25,31,40,.14);
  --cta:#2f6bff;--cta-fg:#ffffff;
  --av1-bg:#e8f0ff;--av1-bd:transparent;--av1-fg:#2f6bff;--av2-bg:#ffeceb;--av2-bd:transparent;--av2-fg:#d6362c;
  --on-bg:#2f6bff;--on-bd:transparent;--on-fg:#ffffff;--on-sub:#dbe6ff;--on-av-bg:#ffffff;--on-av-fg:#2f6bff;
  --tick:#e2e6ea;--fill:#dbe6ff;--foul:#e5382f;--win:#2f6bff;
  --r-card:18px;--r-pill:14px;--r-ctl:16px;--r-chip:12px;--r-cta:16px;
  --num:'Gothic A1','Apple SD Gothic Neo',sans-serif;--num-w:800;--w-title:800;--w-text:500;--w-name:700;
}
#app[data-theme="dark"]{
  --bg:#101216;--fg:#f3f5f7;--fg2:#c3cad3;--sub:#9aa3af;
  --panel:rgba(31,35,42,.9);--bd:rgba(255,255,255,.12);--sh:none;
  --hair:rgba(255,255,255,.08);--opt:rgba(255,255,255,.06);--sheet:#1a1d23;--scrim:rgba(4,6,9,.62);
  --acc:#36c5d8;--acc-fg:#06181c;--sel-bg:rgba(54,197,216,.13);--sel-bd:#36c5d8;
  --seg:rgba(255,255,255,.05);--seg-on:rgba(255,255,255,.15);--seg-sh:none;
  --cta:#f3f5f7;--cta-fg:#101216;
  --av1-bg:transparent;--av1-bd:#36c5d8;--av1-fg:#7fe0ee;--av2-bg:transparent;--av2-bd:#f0a96b;--av2-fg:#f6c79b;
  --on-bg:rgba(31,35,42,.9);--on-bd:#36c5d8;--on-fg:#f3f5f7;--on-sub:#7fe0ee;--on-av-bg:#36c5d8;--on-av-fg:#06181c;
  --tick:rgba(255,255,255,.14);--fill:rgba(54,197,216,.22);--foul:#e5484d;--win:#36c5d8;
  --r-card:18px;--r-pill:999px;--r-ctl:24px;--r-chip:999px;--r-cta:999px;
  --num:'Outfit','Gothic A1',sans-serif;--num-w:500;--w-title:700;--w-text:300;--w-name:500;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#101216;font-family:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.3;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-weight:var(--w-text)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.num{font-family:var(--num);font-weight:var(--num-w)}

/* ---------- shared pieces ---------- */
.panel{background:var(--panel);border:1px solid var(--bd);box-shadow:var(--sh);border-radius:var(--r-card)}
.btn{background:var(--panel);border:1px solid var(--bd);box-shadow:var(--sh);border-radius:var(--r-chip);height:44px;padding:0 16px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;color:var(--fg2);white-space:nowrap;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.icon{width:44px;padding:0}
.btn .k{font-weight:var(--w-text);color:var(--sub)}
.btn .v{color:var(--fg)}
.btn.cta{background:var(--cta);color:var(--cta-fg);border-color:transparent;border-radius:var(--r-cta);height:60px;font-size:19px;font-weight:700;box-shadow:none}
.btn.flat{box-shadow:none;background:var(--opt);border-color:transparent}
.lab{font-size:12.5px;font-weight:700;color:var(--sub);padding-left:4px;letter-spacing:.02em}
.seg{background:var(--seg);border:1px solid var(--bd);border-radius:var(--r-chip);padding:4px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.seg button{height:38px;border-radius:calc(var(--r-chip) - 3px);font-size:14.5px;color:var(--sub);transition:background .15s}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:var(--seg-sh);color:var(--fg);font-weight:700}
.av{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;box-sizing:border-box;font-style:normal;font-family:var(--num);font-weight:var(--num-w);font-size:17px;
  background:var(--av1-bg);border:1px solid var(--av1-bd);color:var(--av1-fg)}
.two .av{background:var(--av2-bg);border-color:var(--av2-bd);color:var(--av2-fg)}

/* ---------- home ---------- */
#home{position:absolute;inset:0;display:grid;grid-template-columns:300px minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr);
  gap:18px 26px;padding:24px 30px 26px;pointer-events:none}
#home>*{pointer-events:auto}
.h-top{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:30px;height:30px;border-radius:50%;background:var(--fg);display:grid;place-items:center}
.logo .mark i{width:15px;height:15px;border-radius:50%;background:var(--bg);color:var(--fg);font-style:normal;font-size:10px;font-weight:800;display:grid;place-items:center}
.logo .word{font-size:22px;font-weight:var(--w-title);letter-spacing:-.02em;white-space:nowrap}
.logo .en{font-family:'Outfit',sans-serif;font-weight:500;font-size:11px;letter-spacing:.34em;color:var(--sub);margin-left:6px}
[data-theme="light"] .logo .en{display:none}
@media (max-width:520px){.logo .en{display:none}.logo .mark{flex:none}}
.h-actions{margin-left:auto;display:flex;gap:8px}
.h-left,.h-right{display:flex;flex-direction:column;gap:10px;min-height:0}
#modeList{display:flex;flex-direction:column;gap:10px}
.gcard{background:var(--panel);border:2px solid var(--bd);box-shadow:var(--sh);border-radius:var(--r-card);padding:14px 16px;display:flex;align-items:center;gap:14px;text-align:left;transition:transform .08s}
[data-theme="light"] .gcard{border-color:var(--panel)}
.gcard:active{transform:scale(.985)}
.gcard[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bd)}
.gcard .ic{flex:none;width:40px;height:40px;display:grid;place-items:center}
.gcard .nm{display:block;font-size:19px;font-weight:var(--w-name);color:var(--fg)}
.gcard .bl{display:block;font-size:13.5px;color:var(--sub);margin-top:2px}
.gcard .ck{margin-left:auto;flex:none;color:var(--acc);visibility:hidden}
.gcard[aria-pressed="true"] .ck{visibility:visible}
.ball{display:grid;place-items:center;border-radius:50%;background:var(--c,#111);width:40px;height:40px;box-sizing:border-box}
[data-theme="dark"] .ball{border:1px solid rgba(255,255,255,.22)}
.ball i{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#fff;color:#111;font-style:normal;font-family:var(--num);font-weight:800;font-size:13px}
.four{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;width:40px;height:40px}
.four i{border-radius:50%;background:var(--c)}
.h-mid{display:flex;align-items:flex-end;justify-content:center;pointer-events:none!important;min-width:0}
.h-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
.chip-sw{width:16px;height:16px;border-radius:5px;background:var(--c)}
.plist{padding:4px 16px;display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;text-align:left;min-width:0}
.prow+.prow{border-top:1px solid var(--hair)}
.prow .who{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.prow .nm{font-size:18px;font-weight:var(--w-name);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .rc{font-size:13.5px;color:var(--sub)}
.prow svg{flex:none;color:var(--sub);opacity:.7}
#startBtn{margin-top:auto}

.compact #home{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:max-content max-content max-content;align-content:start;overflow:auto;pointer-events:auto;
  background:var(--bg);gap:14px 16px;padding:14px 16px 20px}
.compact .h-mid{grid-column:1/-1;order:3}
.compact.portrait #home{grid-template-columns:minmax(0,1fr)}
.compact #startBtn{margin-top:6px}

/* ---------- in-game scoreboard ---------- */
#hud{position:absolute;top:0;left:0;right:0;height:var(--hud-h);display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;gap:8px;padding:6px 10px 0}
#menuBtn{width:46px;height:46px;border-radius:var(--r-pill)}
[data-theme="light"] #menuBtn{border-radius:13px}
.pill{justify-self:start;max-width:100%;min-width:0;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--bd);box-shadow:var(--sh);
  border-radius:var(--r-pill);padding:5px 15px 5px 6px;color:var(--sub);transition:background .2s,border-color .2s,color .2s}
.pill.r{justify-self:end;flex-direction:row-reverse;padding:5px 6px 5px 15px;text-align:right}
.pill .av{width:34px;height:34px;font-size:15px}
.pill .who{min-width:0;display:flex;flex-direction:column;gap:1px}
.pill .nm{font-size:14.5px;font-weight:var(--w-name);line-height:1.15;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .sub{font-size:11.5px;line-height:1.15;white-space:nowrap}
.pill.on{background:var(--on-bg);border-color:var(--on-bd);color:var(--on-sub)}
.pill.on .nm{color:var(--on-fg)}
.pill.on .av{background:var(--on-av-bg);border-color:transparent;color:var(--on-av-fg)}
.pill.r.on .av{background:var(--on-av-bg)}
.tray{display:flex;gap:3px;min-width:0}
.mb{flex:none;width:14px;height:14px;border-radius:50%;box-sizing:border-box;background:var(--c,#333)}
.mb.st{background:linear-gradient(#f1efe8 0 25%,var(--c) 25% 75%,#f1efe8 75%)}
.mb.slot{background:none;border:1.5px solid currentColor;opacity:.45}
.mb.e8{background:#0b0b0d;border:1.5px solid var(--acc)}
[data-theme="light"] .pill.on .mb{border:1.5px solid #fff}
[data-theme="light"] .mb.st{border:1px solid #d5dae0}
.pts{font-family:var(--num);font-weight:var(--num-w);font-size:26px;line-height:1;min-width:24px;text-align:center;color:var(--fg)}
.pill.on .pts{color:var(--on-fg)}
#badge{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--bd);box-shadow:var(--sh);border-radius:999px;padding:8px 16px;font-size:13px;color:var(--sub);white-space:nowrap}
#badge b{font-weight:800;color:var(--fg)}
[data-theme="dark"] #badge{background:none;border:0;padding:0}
[data-theme="dark"] #badge b{font-family:'Outfit',sans-serif;font-weight:500;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--sub)}

#toast{position:absolute;left:50%;top:calc(var(--hud-h) + 14px);transform:translate(-50%,-8px);max-width:min(88%,520px);
  padding:10px 18px;border-radius:999px;background:var(--sheet);color:var(--fg);border:1px solid var(--bd);box-shadow:0 8px 24px rgba(0,0,0,.18);
  font-size:clamp(13px,1.9vw,15px);font-weight:700;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-wrap:balance}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.foul{background:var(--foul);color:#fff;border-color:transparent}
#toast.good{background:var(--acc);color:var(--acc-fg);border-color:transparent}
#fps{position:absolute;left:8px;bottom:6px;font-family:'Outfit',sans-serif;font-size:12px;color:var(--fg);background:var(--panel);border-radius:8px;padding:2px 8px;pointer-events:none}

/* ---------- controls: same places and behaviour as before ---------- */
#power,#fine{position:absolute;touch-action:none;border-radius:var(--r-ctl);background:var(--panel);border:1px solid var(--bd);box-shadow:var(--sh);box-sizing:border-box}
#power{left:10px;top:calc(var(--hud-h) + 12px);bottom:14px;width:48px;overflow:hidden}
#powerFill{position:absolute;left:0;right:0;top:0;height:0;background:var(--fill)}
#powerCue{position:absolute;left:50%;top:0;width:8px;height:100%;transform:translate(-50%,calc(-100% + 26px));background:var(--acc);border-radius:0 0 4px 4px}
#powerNum{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-family:var(--num);font-weight:var(--num-w);font-size:18px;color:var(--fg)}
#powerLab{position:absolute;left:0;right:0;bottom:31px;text-align:center;font-size:10.5px;color:var(--sub)}
#fine{right:10px;top:calc(var(--hud-h) + 12px);bottom:90px;width:48px;overflow:hidden;
  background-image:repeating-linear-gradient(180deg,transparent 0 10px,var(--tick) 10px 11.5px)}
#fine::after{content:"";position:absolute;left:7px;right:7px;top:50%;height:3px;margin-top:-1.5px;background:var(--acc);border-radius:2px}
#fineLab{position:absolute;left:0;right:0;top:0;padding:7px 0 5px;text-align:center;font-size:10.5px;color:var(--sub);background:var(--panel)}
#spinBtn{position:absolute;right:10px;bottom:14px;width:60px;height:60px;border-radius:50%;background:#f1ecdf;border:1px solid rgba(255,255,255,.4);box-shadow:0 1px 2px rgba(0,0,0,.1),0 6px 16px rgba(0,0,0,.16)}
#spinDot,.sdot{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:#d8352c}
#spinPop{position:absolute;right:82px;bottom:14px;background:var(--sheet);border:1px solid var(--bd);border-radius:22px;box-shadow:0 12px 32px rgba(0,0,0,.24);padding:14px;
  display:flex;flex-direction:column;align-items:center;gap:10px}
#spinPad{position:relative;width:150px;height:150px;border-radius:50%;touch-action:none;background:#f1ecdf;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
#spinPad::before{content:"";position:absolute;inset:14%;border-radius:50%;border:1.5px dashed rgba(25,31,40,.25)}
#spinPad .sdot{width:22px;height:22px;margin:-11px}
#spinHint{font-size:12.5px;color:var(--sub);text-align:center;max-width:180px;line-height:1.45}
#app.busy #power,#app.busy #fine,#app.busy #spinBtn{opacity:.45;pointer-events:none}
#power,#fine,#spinBtn{transition:opacity .2s}

.portrait #power{left:84px;right:10px;top:auto;bottom:14px;width:auto;height:46px}
.portrait #powerFill{top:0;bottom:0;right:auto;width:0;height:auto}
.portrait #powerCue{left:0;top:50%;width:100%;height:8px;transform:translate(calc(-100% + 30px),-50%);border-radius:0 4px 4px 0}
.portrait #powerNum{left:auto;right:14px;bottom:0;top:0;display:grid;place-items:center}
.portrait #powerLab{left:auto;right:50px;top:0;bottom:0;display:grid;place-items:center}
.portrait #fine{left:84px;right:10px;top:auto;bottom:70px;width:auto;height:32px;
  background-image:repeating-linear-gradient(90deg,transparent 0 10px,var(--tick) 10px 11.5px)}
.portrait #fine::after{left:50%;right:auto;top:6px;bottom:6px;width:3px;height:auto;margin:0 0 0 -1.5px}
.portrait #fineLab{left:0;right:auto;top:0;bottom:0;padding:0 8px 0 12px;display:grid;place-items:center}
.portrait #spinBtn{left:12px;right:auto;bottom:26px}
.portrait #spinPop{left:10px;right:auto;bottom:112px}

/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:var(--scrim);overflow:auto}
.sheet{width:min(100%,500px);background:var(--sheet);border:1px solid var(--bd);border-radius:24px;box-shadow:0 24px 64px rgba(0,0,0,.3);padding:20px;display:flex;flex-direction:column;gap:16px;
  animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet h2{margin:0;font-size:21px;font-weight:var(--w-title);letter-spacing:-.01em}
#sheetBody{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--opt);border:2px solid transparent;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:14px;text-align:left;transition:transform .08s}
.opt:active{transform:scale(.985)}
.opt[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bd)}
.opt .t{display:block;font-size:16.5px;font-weight:var(--w-name);color:var(--fg)}
.opt .d{display:block;font-size:13px;color:var(--sub);margin-top:2px;line-height:1.4}
.sw{flex:none;width:56px;height:36px;border-radius:8px;background:var(--c);border:5px solid var(--w);box-sizing:border-box}
.cuepic{flex:none;width:140px;height:10px;border-radius:5px;background:var(--c)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.txt{font:inherit;font-size:20px;font-weight:700;color:var(--fg);background:var(--opt);border:2px solid transparent;border-radius:14px;padding:12px 14px;width:100%;box-sizing:border-box;
  -webkit-user-select:text;user-select:text}
.txt:focus{border-color:var(--acc);outline:none}
.rec{display:grid;grid-template-columns:minmax(0,1fr) 52px 52px 76px;gap:8px 10px;align-items:center;font-size:16px}
.rec .hd{font-size:12px;color:var(--sub)}
.rec .n{font-family:var(--num);font-weight:var(--num-w);text-align:center;font-size:18px}
.note{font-size:13px;color:var(--sub);margin:0;line-height:1.5}
.row{display:flex;gap:10px}.row>*{flex:1}

/* ---------- result ---------- */
#result{position:absolute;inset:0;overflow:auto;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,26px);padding:24px clamp(16px,5vw,60px)}
.r-title{font-family:'Outfit',sans-serif;font-weight:500;font-size:13px;letter-spacing:.36em;color:var(--sub)}
.r-vs{display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,34px);flex-wrap:wrap}
.r-win{display:flex;align-items:center;gap:16px;min-width:0}
.r-win .av{width:64px;height:64px;font-size:28px;background:var(--on-av-bg);border-color:transparent;color:var(--on-av-fg)}
[data-theme="light"] .r-win .av{background:var(--acc);color:#fff}
.r-win .nm{font-size:clamp(30px,4.6vw,48px);font-weight:var(--w-title);line-height:1.05;letter-spacing:-.02em}
.r-win .rc{font-size:15px;color:var(--sub);margin-top:4px}
.r-score{font-family:var(--num);font-weight:var(--num-w);font-size:clamp(52px,8vw,88px);line-height:1;white-space:nowrap;color:var(--sub)}
.r-score b{font-weight:inherit;color:var(--win)}
.r-lose{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:20px}
.r-lose .av{width:40px;height:40px}
#rStats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%;max-width:920px}

<script src="three.min.js"></script>
<script>
/* Cue-sports physics: 2D table plane, full 3D spin. Units are metres and seconds.
   createPhysics({ R, pockets, HL, HW, cornerMouth, sideMouth }) builds one table: a pool table with six pockets
   in any regulation size, or a carom table with none. */
function createPhysics(cfg) {
  const R = cfg.R, POCKETED = !!cfg.pockets;
  const HL = cfg.HL || 1.27, HW = cfg.HW || 0.635, G = 9.8;
  const MU_S = 0.2, MU_R = 0.016, MU_SP = 0.04, E_BALL = 0.96, MU_CUSH = 0.16;
  const CM = cfg.cornerMouth || 0.125, SM = cfg.sideMouth || 0.14, kc = CM / 0.125, ks = SM / 0.14;
  const GC = CM * Math.SQRT1_2, GS = SM / 2, CW = 0.05, PO = 0.03 * kc, SO = 0.05 * ks;
  const RC = 0.068 * kc, RS = 0.062 * ks, SC = RC * 0.91, SS = RS * 0.87, AI = 0.03 * kc;
  const D = Math.SQRT1_2;

  const POCKETS = !POCKETED ? [] : [
    { x: -HL - PO, y: HW + PO, r: RC, sink: SC, ax: -HL + AI, ay: HW - AI, nx: -D, ny: D, corner: true },
    { x: 0, y: HW + SO, r: RS, sink: SS, ax: 0, ay: HW, nx: 0, ny: 1, corner: false },
    { x: HL + PO, y: HW + PO, r: RC, sink: SC, ax: HL - AI, ay: HW - AI, nx: D, ny: D, corner: true },
    { x: HL + PO, y: -HW - PO, r: RC, sink: SC, ax: HL - AI, ay: -HW + AI, nx: D, ny: -D, corner: true },
    { x: 0, y: -HW - SO, r: RS, sink: SS, ax: 0, ay: -HW, nx: 0, ny: -1, corner: false },
    { x: -HL - PO, y: -HW - PO, r: RC, sink: SC, ax: -HL + AI, ay: -HW + AI, nx: -D, ny: -D, corner: true },
  ];

  // Cushions: a nose line plus (on a pool table) an angled jaw facing at each end.
  const CUSHIONS = [], SEGS = [];
  (function build() {
    const C38 = Math.cos(38 * Math.PI / 180), S38 = Math.sin(38 * Math.PI / 180);
    const C75 = Math.cos(75 * Math.PI / 180), S75 = Math.sin(75 * Math.PI / 180);
    const seg = (p, q) => { const l = Math.hypot(q[0] - p[0], q[1] - p[1]); SEGS.push({ ax: p[0], ay: p[1], bx: q[0], by: q[1], len: l, tx: (q[0] - p[0]) / l, ty: (q[1] - p[1]) / l }); };
    function add(ax, ay, bx, by, ox, oy, aCorner, bCorner) {
      const len = Math.hypot(bx - ax, by - ay), tx = (bx - ax) / len, ty = (by - ay) / len;
      const ja = aCorner ? [C38, S38, 0.065 * kc] : [C75, S75, 0.05 * ks];
      const jb = bCorner ? [C38, S38, 0.065 * kc] : [C75, S75, 0.05 * ks];
      const c = {
        a: [ax, ay], b: [bx, by], o: [ox, oy],
        ja: [ax + (-tx * ja[0] + ox * ja[1]) * ja[2], ay + (-ty * ja[0] + oy * ja[1]) * ja[2]],
        jb: [bx + (tx * jb[0] + ox * jb[1]) * jb[2], by + (ty * jb[0] + oy * jb[1]) * jb[2]],
      };
      CUSHIONS.push(c); seg(c.ja, c.a); seg(c.a, c.b); seg(c.b, c.jb);
    }
    function plain(ax, ay, bx, by, ox, oy) {
      // mitred into the corner: the back edge reaches the corner of the rail
      const c = { a: [ax, ay], b: [bx, by], o: [ox, oy] };
      c.ja = [ax + (ox !== 0 ? ox * CW : -Math.sign(bx - ax) * CW), ay + (oy !== 0 ? oy * CW : -Math.sign(by - ay) * CW)];
      c.jb = [bx + (ox !== 0 ? ox * CW : Math.sign(bx - ax) * CW), by + (oy !== 0 ? oy * CW : Math.sign(by - ay) * CW)];
      CUSHIONS.push(c); seg(c.a, c.b);
    }
    if (POCKETED) {
      add(-HL + GC, HW, -GS, HW, 0, 1, true, false);
      add(GS, HW, HL - GC, HW, 0, 1, false, true);
      add(-HL + GC, -HW, -GS, -HW, 0, -1, true, false);
      add(GS, -HW, HL - GC, -HW, 0, -1, false, true);
      add(-HL, -HW + GC, -HL, HW - GC, -1, 0, true, true);
      add(HL, -HW + GC, HL, HW - GC, 1, 0, true, true);
    } else {
      plain(-HL, HW, HL, HW, 0, 1); plain(-HL, -HW, HL, -HW, 0, -1);
      plain(-HL, -HW, -HL, HW, -1, 0); plain(HL, -HW, HL, HW, 1, 0);
    }
  })();

  function newEv() { return { firstHit: null, hits: [], rail: false, pocketed: [] }; }

  function makeWorld(n) {
    const balls = [];
    for (let i = 0; i < n; i++) balls.push({ id: i, x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, wx: 0, wy: 0, wz: 0, hot: 0, spit: 0, on: true, q: [0, 0, 0, 1] });
    return { balls, ev: newEv(), snd: null, track: false, cue: 0 };
  }

  function clone(w) {
    return { balls: w.balls.map(b => ({ id: b.id, x: b.x, y: b.y, px: b.x, py: b.y, vx: 0, vy: 0, wx: 0, wy: 0, wz: 0, hot: 0, spit: 0, on: b.on, q: b.q })), ev: newEv(), snd: null, track: false, cue: w.cue };
  }

  function place(w, id, x, y, rnd) {
    const b = w.balls[id];
    b.x = b.px = x; b.y = b.py = y; b.vx = b.vy = b.wx = b.wy = b.wz = 0; b.hot = 0; b.spit = 0; b.on = true;
    if (rnd) {
      const a = rnd() * Math.PI * 2, tl = (rnd() - 0.5) * 0.9;
      const cz = Math.cos(a / 2), sz = Math.sin(a / 2), cx = Math.cos(tl / 2), sx = Math.sin(tl / 2);
      b.q = [cz * sx, sz * sx, sz * cx, cz * cx];
    }
  }

  function strike(w, ang, V, a, bb) {
    const c = w.balls[w.cue], dx = Math.cos(ang), dy = Math.sin(ang);
    c.vx = V * dx; c.vy = V * dy;
    const k = 2.5 * V * bb / R;
    c.wx = -dy * k; c.wy = dx * k; c.wz = 2.5 * V * a / R;
    w.ev = newEv();
  }

  function motion(w, b, h) {
    const ux = b.vx - R * b.wy, uy = b.vy + R * b.wx, us = Math.hypot(ux, uy);
    if (us > 1e-4) {
      const dec = MU_S * G * h;
      if (us <= 3.5 * dec) {
        b.vx -= (2 / 7) * ux; b.vy -= (2 / 7) * uy;
        b.wy = b.vx / R; b.wx = -b.vy / R;
      } else {
        const nx = ux / us, ny = uy / us;
        b.vx -= dec * nx; b.vy -= dec * ny;
        b.wx -= (2.5 / R) * dec * ny; b.wy += (2.5 / R) * dec * nx;
      }
    } else {
      const sp = Math.hypot(b.vx, b.vy), dec = MU_R * G * h;
      if (sp <= dec || sp < 0.004) { b.vx = b.vy = 0; b.wx = b.wy = 0; }
      else { const s = (sp - dec) / sp; b.vx *= s; b.vy *= s; b.wy = b.vx / R; b.wx = -b.vy / R; }
    }
    const dz = (2.5 * MU_SP * G / R) * h;
    if (Math.abs(b.wz) <= dz) b.wz = 0; else b.wz -= Math.sign(b.wz) * dz;
    b.x += b.vx * h; b.y += b.vy * h;
    const spd = Math.hypot(b.vx, b.vy), cool = b.hot - 7 * h; b.hot = spd > cool ? spd : cool;
    if (b.spit > 0) b.spit -= h;
    if (w.track) {
      const wm = Math.hypot(b.wx, b.wy, b.wz);
      if (wm > 1e-6) {
        const ang = wm * h, s = Math.sin(ang / 2) / wm, c = Math.cos(ang / 2);
        const dx = b.wx * s, dy = b.wy * s, dzq = b.wz * s, q = b.q, qx = q[0], qy = q[1], qz = q[2], qw = q[3];
        q[0] = c * qx + dx * qw + dy * qz - dzq * qy;
        q[1] = c * qy + dy * qw + dzq * qx - dx * qz;
        q[2] = c * qz + dzq * qw + dx * qy - dy * qx;
        q[3] = c * qw - dx * qx - dy * qy - dzq * qz;
      }
    }
  }

  function hitSeg(w, b, s) {
    let u = (b.x - s.ax) * s.tx + (b.y - s.ay) * s.ty;
    u = u < 0 ? 0 : u > s.len ? s.len : u;
    const cx = s.ax + s.tx * u, cy = s.ay + s.ty * u;
    let nx = b.x - cx, ny = b.y - cy;
    const d2 = nx * nx + ny * ny;
    if (d2 >= R * R || d2 < 1e-14) return;
    const d = Math.sqrt(d2); nx /= d; ny /= d;
    b.x = cx + nx * R; b.y = cy + ny * R;
    const vn = b.vx * nx + b.vy * ny;
    if (vn >= 0) return;
    const e = Math.max(0.62, 0.87 - 0.035 * -vn);
    const tx = -ny, ty = nx;
    // side spin grips the cushion and bends the rebound
    const slip = b.vx * tx + b.vy * ty - R * b.wz;
    const lim = MU_CUSH * (1 + e) * -vn;
    let dvt = -(2 / 7) * slip;
    if (dvt > lim) dvt = lim; else if (dvt < -lim) dvt = -lim;
    b.vx += -(1 + e) * vn * nx + dvt * tx;
    b.vy += -(1 + e) * vn * ny + dvt * ty;
    b.wz -= (2.5 / R) * dvt;
    // the nose sits above centre: roll into the rail is mostly killed and slightly reversed,
    // roll along the rail survives
    const wn = b.wx * nx + b.wy * ny, wt = b.wx * tx + b.wy * ty;
    const wn2 = wn * 0.9, wt2 = wt * -0.15;
    b.wx = wn2 * nx + wt2 * tx; b.wy = wn2 * ny + wt2 * ty;
    if (w.ev.firstHit != null) w.ev.rail = true;
    if (w.snd && -vn > 0.08) w.snd.push({ t: 'rail', v: -vn });
  }

  function sub(w, h) {
    const bs = w.balls, n = bs.length, cue = w.cue;
    for (let i = 0; i < n; i++) if (bs[i].on) motion(w, bs[i], h);
    for (let i = 0; i < n; i++) {
      const a = bs[i]; if (!a.on) continue;
      for (let j = i + 1; j < n; j++) {
        const b = bs[j]; if (!b.on) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
        if (d2 >= 4 * R * R || d2 < 1e-14) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, ov = (2 * R - d) / 2;
        a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
        const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rel >= 0) continue;
        const jn = -(1 + E_BALL) / 2 * rel;
        a.vx -= jn * nx; a.vy -= jn * ny; b.vx += jn * nx; b.vy += jn * ny;
        if (i === cue || j === cue) {
          const o = i === cue ? j : i;
          if (w.ev.firstHit == null) w.ev.firstHit = o;
          if (w.ev.hits.indexOf(o) < 0) w.ev.hits.push(o);
        }
        if (w.snd && -rel > 0.03) w.snd.push({ t: 'ball', v: -rel });
      }
    }
    for (let i = 0; i < n; i++) {
      const b = bs[i]; if (!b.on) continue;
      if (Math.abs(b.x) > HL - R - 0.002 || Math.abs(b.y) > HW - R - 0.002) {
        if (b.vx !== 0 || b.vy !== 0) for (let k = 0; k < SEGS.length; k++) hitSeg(w, b, SEGS[k]);
        if (!POCKETED) continue;
        // A ball drops once its centre is far enough over the hole. A fast ball has to get deeper before it drops,
        // so a hard shot that is not centred hits the back of the pocket and can rattle out again.
        // b.hot remembers how hard the ball was travelling a moment ago, so slowing down on a jaw does not rescue it
        const tight = 1 - 0.55 * Math.min(1, Math.max(0, (b.hot - 2.5) / 4.5));
        const outside = Math.abs(b.x) > HL || Math.abs(b.y) > HW;
        let pk = -1;
        for (let k = 0; k < 6; k++) {
          const p = POCKETS[k], dx = b.x - p.x, dy = b.y - p.y, d2 = dx * dx + dy * dy, se = p.sink * tight;
          if (d2 < se * se && b.spit <= 0) { pk = k; break; }
          const lim = p.r - R * 0.35;
          if (outside && d2 > lim * lim && d2 < (p.r + R) * (p.r + R)) {
            const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, vn = b.vx * nx + b.vy * ny;
            b.x = p.x + nx * lim; b.y = p.y + ny * lim;
            if (vn > 0) {
              // the pocket back is dead for a gentle ball and springy for a hard one
              const e = 0.35 + 0.5 * Math.min(1, Math.max(0, (b.hot - 2.5) / 4.5));
              if (b.hot > 3.8) b.spit = 0.22;   // too hard and off-centre: the pocket spits it back out
              b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny; b.vx *= 0.88; b.vy *= 0.88; b.wx *= 0.5; b.wy *= 0.5;
              if (b.hot > 3.8) {
                // thrown back towards the table, keeping a little of the angle it bounced at
                const s0 = Math.hypot(b.vx, b.vy) || 1, ox = -p.nx + 0.5 * b.vx / s0, oy = -p.ny + 0.5 * b.vy / s0, ol = Math.hypot(ox, oy) || 1, out = 0.4 * b.hot;
                b.vx = ox / ol * out; b.vy = oy / ol * out;
              }
              if (w.snd && vn > 0.3) w.snd.push({ t: 'rail', v: vn * 0.6 });
            }
          }
        }
        if (pk < 0 && (Math.abs(b.x) > HL + 0.09 || Math.abs(b.y) > HW + 0.11)) {
          let best = 1e9;
          for (let k = 0; k < 6; k++) { const p = POCKETS[k], dd = (b.x - p.x) ** 2 + (b.y - p.y) ** 2; if (dd < best) { best = dd; pk = k; } }
        }
        if (pk >= 0) {
          b.on = false;
          w.ev.pocketed.push({ id: b.id, pocket: pk });
          if (w.snd) w.snd.push({ t: 'pocket', id: b.id, pocket: pk, x: b.x, y: b.y, vx: b.vx, vy: b.vy });
          b.vx = b.vy = b.wx = b.wy = b.wz = 0;
        }
      }
    }
  }

  function step(w, dt) {
    let vmax = 0;
    for (const b of w.balls) if (b.on) { b.px = b.x; b.py = b.y; const s = Math.hypot(b.vx, b.vy); if (s > vmax) vmax = s; }
    const n = Math.max(1, Math.ceil(vmax * dt / (R * 0.3)));
    const h = dt / n;
    for (let i = 0; i < n; i++) sub(w, h);
  }

  function rest(w) {
    for (const b of w.balls) if (b.on && (b.vx !== 0 || b.vy !== 0 || b.wx !== 0 || b.wy !== 0)) return false;
    return true;
  }

  function run(w, maxT) {
    let t = 0;
    while (!rest(w) && t < (maxT || 25)) { step(w, 1 / 120); t += 1 / 120; }

const SND = (() => {

  }
  // falling sine: the "body" of a hit

    pocket() {

      tone(230, 0.1, 0.3, 0.6, 0.11, 'triangle'); burst(1400, 1.2, 0.03, 0.16, 'bandpass', 0.11);

    tap() { tone(520, 0.05, 0.12, 1.5); },
    win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 0.22, 1, i * 0.11)); },

  const pct = p => p.shots ? Math.round(p.made / p.shots * 100) + '%' : '0%';
  const rows = [['샷 성공률', pct(pw), pct(pl)], ['연속 성공', pw.best, pl.best], ['친 횟수', pw.shots, pl.shots], ['파울', pw.fouls, pl.fouls]];
  if (game.mode.target) rows[2] = ['점수', pw.score, pl.score];
  const box = $('#rStats'); box.textContent = '';
  for (const [k, a, b] of rows) box.appendChild(el('div', { class: 'stat panel' }, [el('div', { class: 'k', text: k }), el('div', { class: 'v' }, [el('b', { text: a }), el('span', { text: b })])]));
  $('#rWhy').textContent = game.over.why;
  $('#hud').hidden = true; for (const id of ['#power', '#fine', '#spinBtn']) $(id).hidden = true; $('#spinPop').hidden = true;
  $('#result').hidden = false; app.classList.add('busy'); SND.win();
}

/* ================= scoreboard ================= */
function hud() {
  const m = game.mode;
  for (let i = 0; i < 2; i++) {
    const box = $('#p' + i), p = game.players[i], tray = box.querySelector('.tray'), pts = box.querySelector('.pts');
    box.classList.toggle('on', game.turn === i && st.phase !== 'over');
    box.querySelector('.nm').textContent = p.name; tray.textContent = ''; pts.textContent = '';
    let sub = '';
    if (m.id === 'eight') {
      const rem = m.remaining(game, i); sub = p.group ? game.GROUP_KO[p.group] + ' 공' : '공 미정';
      if (!rem) for (let k = 0; k < 7; k++) tray.appendChild(el('i', { class: 'mb slot' }));
      else if (!rem.length) tray.appendChild(el('i', { class: 'mb e8' }));
      else for (const id of rem) tray.appendChild(el('i', { class: 'mb' + (id > 8 ? ' st' : ''), style: '--c:' + ballCss(id) }));
    } else if (m.id === 'nine') { sub = game.turn === i ? `다음 ${m.lowest(game)}번 공` : `성공 ${p.made}`; }
    else { sub = `목표 ${game.target}점`; pts.textContent = p.score; }
    box.querySelector('.sub').textContent = sub;
  }
  const badge = $('#badge'); badge.textContent = '';
  badge.appendChild(el('b', { text: m.name }));
  if (m.id === 'nine') {
    badge.appendChild(document.createTextNode('다음'));
    const low = m.lowest(game); for (let id = 1; id <= 9; id++) if (game.world.balls[id].on) badge.appendChild(el('i', { class: 'mb' + (id > 8 ? ' st' : ''), style: `--c:${ballCss(id)};` + (id === low ? 'box-shadow:0 0 0 2px #ffd21f' : 'opacity:.55') }));
  } else if (m.id === 'eight') badge.appendChild(document.createTextNode(game.isBreak ? '브레이크' : game.players.every(p => !p.group) ? '아직 공 미정' : '8번은 마지막에'));
  else badge.appendChild(document.createTextNode('빨간 공 두 개 맞히면 1점'));
  app.classList.toggle('busy', !(st.phase === 'aim' && !game.players[game.turn].ai));
}
function setPowerUI(p) {
  const tr = $('#power'), fill = $('#powerFill'), c = $('#powerCue');
  $('#powerNum').textContent = Math.round(p * 100);
  if (scene.portrait) { fill.style.height = ''; fill.style.width = (p * 100) + '%'; c.style.transform = `translate(calc(-100% + 30px + ${p * (tr.clientWidth - 30)}px),-50%)`; }
  else { fill.style.width = ''; fill.style.height = (p * 100) + '%'; c.style.transform = `translate(-50%,calc(-100% + 26px + ${p * (tr.clientHeight - 26)}px))`; }
}
function setSpinUI() {
  const s = st.spin, k = 0.36;
  $('#spinDot').style.transform = `translate(${s.x * k * 60}px,${-s.y * k * 60}px)`;
  $('#spinPadDot').style.transform = `translate(${s.x * k * 150}px,${-s.y * k * 150}px)`;
}

/* ================= computer turn ================= */
function aiTick(dt) {
  const a = st.ai; a.t += dt;
  if (!a.plan) {
    if (a.t < 0.5) return;
    a.plan = game.aiPlan(); a.t0 = a.t; a.pw = Math.min(1, game.powerOf(a.plan.V));
    if (a.plan.pos) { const c = game.cueBall(); c.x = c.px = a.plan.pos[0]; c.y = c.py = a.plan.pos[1]; game.placing = null; }
    let d = a.plan.angle - a.from; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; a.delta = d;
    return;
  }
  const t = a.t - a.t0, e = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
  st.aim = a.from + a.delta * e(t / 0.75);
  st.power = a.pw * e((t - 0.85) / 0.45); setPowerUI(st.power);
  if (t > 1.45) { st.aim = a.plan.angle; st.ai = null; shoot(a.plan.V, 0, 0); }
}

/* ================= input ================= */
let drag = null;
const humanAiming = () => st.phase === 'aim' && !game.players[game.turn].ai && $('#sheet').hidden;
function tryPlace(p) {
  const P = game.P, { R, HL, HW } = P, w = game.world, c = game.cueBall();
  let x = Math.max(-HL + R, Math.min(HL - R, p.x)), y = Math.max(-HW + R, Math.min(HW - R, p.y));
  if (game.placing === 'kitchen') x = Math.min(x, -HL / 2);
  if (P.isFree(w, x, y, c.id)) { c.x = c.px = x; c.y = c.py = y; return; }
  for (const b of w.balls) {
    if (!b.on || b.id === c.id) continue;
    const d = Math.hypot(x - b.x, y - b.y);
    if (d < 2 * R + 0.001 && d > 1e-6) { const k = (2 * R + 0.0012) / d, nx = b.x + (x - b.x) * k, ny = b.y + (y - b.y) * k; if (P.isFree(w, nx, ny, c.id) && (game.placing !== 'kitchen' || nx <= -HL / 2)) { c.x = c.px = nx; c.y = c.py = ny; } return; }
  }
}
canvas.addEventListener('pointerdown', e => {
  SND.init(); if (!humanAiming()) return;
  const R = game.P.R, p = scene.toTable(e, R), c = game.cueBall(), d = Math.hypot(p.x - c.x, p.y - c.y);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  if (game.placing && d < Math.max(0.075, 26 / scene.ppm)) drag = { kind: 'cue', id: e.pointerId };
  else drag = { kind: 'aim', id: e.pointerId, last: Math.atan2(p.y - c.y, p.x - c.x), sx: e.clientX, sy: e.clientY, moved: 0 };
  e.preventDefault();
});
canvas.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId || !humanAiming()) return;
  const p = scene.toTable(e, game.P.R), c = game.cueBall();
  if (drag.kind === 'cue') tryPlace(p);
  else {
    drag.moved = Math.max(drag.moved, Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy));
    const a = Math.atan2(p.y - c.y, p.x - c.x);
    if (Math.hypot(p.x - c.x, p.y - c.y) > 0.07 && drag.moved > 6) {
      let da = a - drag.last; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
      st.aim += da;
    }
    drag.last = a;
  }
  scene.invalidate();
});
const endDrag = e => {
  if (!drag || drag.id !== e.pointerId) return;
  if (drag.kind === 'aim' && drag.moved <= 6 && humanAiming()) { const R = game.P.R, p = scene.toTable(e, R), c = game.cueBall(); if (Math.hypot(p.x - c.x, p.y - c.y) > R) st.aim = Math.atan2(p.y - c.y, p.x - c.x); }
  drag = null; scene.invalidate(); snapshot();
};
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);

(function powerCtl() {
  const box = $('#power'); let id = null;
  const read = e => { const r = box.getBoundingClientRect(); return Math.max(0, Math.min(1, scene.portrait ? (e.clientX - r.left - 30) / (r.width - 60) : (e.clientY - r.top - 26) / (r.height - 52))); };
  box.addEventListener('pointerdown', e => { SND.init(); if (!humanAiming()) return; id = e.pointerId; try { box.setPointerCapture(id); } catch (err) {} st.power = read(e); setPowerUI(st.power); scene.invalidate(); e.preventDefault(); });
  box.addEventListener('pointermove', e => { if (id !== e.pointerId) return; st.power = read(e); setPowerUI(st.power); scene.invalidate(); });
  const up = (e, cancel) => {
    if (id !== e.pointerId) return; id = null;
    const p = st.power;
    if (!cancel && p > 0.03 && humanAiming()) shoot(game.vOf(p), st.spin.x * 0.5, st.spin.y * 0.5); else { st.power = 0; setPowerUI(0); }
    scene.invalidate();
  };
  box.addEventListener('pointerup', e => up(e, false)); box.addEventListener('pointercancel', e => up(e, true));
})();
(function fineCtl() {
  const box = $('#fine'); let id = null, last = 0, off = 0;
  const pos = e => scene.portrait ? e.clientX : e.clientY;
  box.addEventListener('pointerdown', e => { SND.init(); if (!humanAiming()) return; id = e.pointerId; last = pos(e); try { box.setPointerCapture(id); } catch (err) {} e.preventDefault(); });
  box.addEventListener('pointermove', e => {
    if (id !== e.pointerId) return; const d = pos(e) - last; last = pos(e);
    st.aim += d * 0.0009 * (scene.portrait ? -1 : 1); off += d;
    box.style.backgroundPosition = scene.portrait ? `${off}px 0` : `0 ${off}px`; scene.invalidate();
  });
  const up = e => { if (id === e.pointerId) id = null; };
  box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
})();
(function spinCtl() {
  const pop = $('#spinPop'), pad = $('#spinPad');
  $('#spinBtn').addEventListener('click', () => {
    if (!humanAiming()) return; SND.tap(); pop.hidden = !pop.hidden; setSpinUI();
    $('#spinHint').textContent = '위는 밀어치기, 아래는 끌어치기, 좌우는 쿠션에서 꺾임. ' + (prefs.guide >= 3 ? '노란 점이 큐볼이 갈 길입니다.' : '조준선을 길게로 하면 큐볼이 갈 길이 보입니다.');
  });
  const set = e => {
    const r = pad.getBoundingClientRect(); let x = (e.clientX - r.left) / r.width * 2 - 1, y = -((e.clientY - r.top) / r.height * 2 - 1);
    x /= 0.72; y /= 0.72; const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
    st.spin = { x, y }; setSpinUI(); scene.invalidate();
  };
  let id = null;
  pad.addEventListener('pointerdown', e => { id = e.pointerId; try { pad.setPointerCapture(id); } catch (err) {} set(e); e.preventDefault(); });
  pad.addEventListener('pointermove', e => { if (id === e.pointerId) set(e); });
  pad.addEventListener('pointerup', () => { id = null; }); pad.addEventListener('pointercancel', () => { id = null; });
  $('#spinReset').addEventListener('click', () => { SND.tap(); st.spin = { x: 0, y: 0 }; setSpinUI(); scene.invalidate(); });
})();
document.addEventListener('contextmenu', e => e.preventDefault());

// Android back button: close whatever is on top; false means "nothing left, leave the app".
window.__back = function () {
  if (!$('#sheet').hidden) { closeSheet(); return true; }
  if (!$('#spinPop').hidden) { $('#spinPop').hidden = true; return true; }
  if (st.phase === 'over') { goHome(); return true; }
  if (st.phase !== 'home') { sheetPause(); return true; }
  return false;
};

/* ================= frame loop ================= */
let lastT = 0, acc = 0, fpsN = 0, fpsT = 0;
function drain() {
  const s = game.world.snd; if (!s.length) return;
  for (const e of s) {
    if (e.t === 'ball') SND.ball(e.v); else if (e.t === 'rail') SND.rail(e.v);
    else if (e.t === 'pocket') { SND.pocket(); scene.fall(game.P, e); }
  }
  s.length = 0;
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastT) / 1000 || 0); lastT = now;
  const w = game.world, P = game.P, paused = !$('#sheet').hidden;
  let animating = false, alpha = 1, pull = 0.03 + st.power * 0.2;
  if (st.phase === 'ai' && !paused) { aiTick(dt); animating = true; }
  if (st.phase === 'strike' && !paused) {
    const ca = st.cueAnim; ca.t += dt; animating = true;
    const k = Math.min(1, ca.t / 0.1); pull = ca.from * (1 - k * k) - 0.004 * k;
    if (ca.t >= 0.1) { P.strike(w, st.aim, ca.V, ca.a, ca.b); SND.cue(ca.V); st.phase = 'sim'; acc = 0; st.settle = 0; st.power = 0; setPowerUI(0); }
  }
  if (st.phase === 'sim' && !paused) {
    // once everything is crawling, run the clock faster so nobody waits on the last roll
    let vmax = 0; for (const b of w.balls) if (b.on) { const s = Math.abs(b.vx) + Math.abs(b.vy); if (s > vmax) vmax = s; }
    acc += dt * (vmax < 0.4 ? 2.1 : 1.12);
    let n = 0; while (acc >= TICK && n < 30) { P.step(w, TICK); acc -= TICK; n++; }
    if (n === 30) acc = 0;
    alpha = acc / TICK; drain(); animating = true;
    if (P.rest(w) && !scene.falling) { st.settle += dt; if (st.settle > 0.12) endShot(); }
  }
  const aiming = st.phase === 'aim' || (st.phase === 'ai' && st.ai && st.ai.plan) || st.phase === 'strike' || st.phase === 'home';
  const drew = scene.frame({
    game, alpha, aim: st.aim, power: st.power, pull, spin: st.spin, rev: st.rev, animating,
    showCue: aiming, showGuide: (st.phase === 'aim' || (st.phase === 'ai' && st.ai && st.ai.plan)), level: prefs.guide,
    legalIds: st.phase === 'home' ? [] : game.legal(), hand: !!game.placing && st.phase === 'aim',
  }, dt);
  if (prefs.fps) {
    fpsN++; fpsT += dt;
    if (fpsT >= 0.5) { $('#fps').textContent = `${Math.round(fpsN / fpsT)} FPS · ${scene.pixelRatio.toFixed(2)}x` + (drew ? '' : ' · 대기'); fpsN = 0; fpsT = 0; }
  }
}

/* ================= saving ================= */
function snapshot() {
  if (st.phase === 'home' || st.phase === 'over') return;
  const d = { v: 2, game: game.serialize(), aim: st.aim, series, tbl: prefs.table };
  store.set('save', d);
  try { const h = window.claude && window.claude.hot; if (h && h.snapshot) h.snapshot(d); } catch (e) {}
}
function start(data) {
  if (!(data && data.v === 2)) data = store.get('save', null);
  $('#fps').hidden = !prefs.fps;
  if (data && data.v === 2 && TABLES.some(t => t.id === data.tbl)) { prefs.table = data.tbl; PH.pool = poolOf(data.tbl); }
  if (data && data.v === 2 && game.restore(data.game)) {
    if (data.series) { series.key = data.series.key; series.s = data.series.s; }
    prefs.mode = game.modeId; st.aim = data.aim || 0;
    enterGame();
  } else goHome();
  requestAnimationFrame(frame);
}
window.__dp8 = { game, st, prefs, scene, startMatch, goHome, shoot, endShot };
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body></html>
