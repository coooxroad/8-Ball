<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
body{margin:0}
[hidden]{display:none!important}
@font-face{font-family:'Gothic A1';font-weight:300;font-display:swap;src:url(fonts/GothicA1-Light.woff2) format('woff2')}
@font-face{font-family:'Gothic A1';font-weight:500;font-display:swap;src:url(fonts/GothicA1-Medium.woff2) format('woff2')}
@font-face{font-family:'Gothic A1';font-weight:700;font-display:swap;src:url(fonts/GothicA1-Bold.woff2) format('woff2')}
@font-face{font-family:'Gothic A1';font-weight:800;font-display:swap;src:url(fonts/GothicA1-ExtraBold.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-weight:100 900;font-display:swap;src:url(fonts/Outfit.woff2) format('woff2')}
@font-face{font-family:'Jua';font-weight:400;font-display:swap;src:url(fonts/Jua-Regular.woff2) format('woff2')}
</style>
</head>
<body>
<title>CUE</title>
<style>
/* Layout: a live 3D table in the middle; quiet panels dock left and right of it on the home screen and
   leave during play, when only a slim scoreboard and the edge controls remain.
   Two looks share the layout: "light" (white cards on pale grey, one blue) and "dark" (glass panels on near-black, one cyan). */
:root{color-scheme:light;--hud-h:60px}
#app[data-theme="light"]{
  --bg:#eef0f3;--fg:#191f28;--fg2:#333d4b;--sub:#6b7684;
  --panel:#ffffff;--bd:transparent;--sh:0 1px 2px rgba(25,31,40,.06),0 6px 16px rgba(25,31,40,.08);
  --hair:#f2f4f6;--opt:#f2f4f6;--sheet:#ffffff;--scrim:rgba(25,31,40,.42);
  --acc:#2f6bff;--acc-fg:#ffffff;--sel-bg:#ffffff;--sel-bd:#2f6bff;
  --seg:#e2e6ea;--seg-on:#ffffff;--seg-sh:0 1px 3px rgba(25,31,40,.14);
  --cta:#2f6bff;--cta-fg:#ffffff;
  --av1-bg:#e8f0ff;--av1-bd:transparent;--av1-fg:#2f6bff;--av2-bg:#ffeceb;--av2-bd:transparent;--av2-fg:#d6362c;
  --on-bg:#2f6bff;--on-bd:transparent;--on-fg:#ffffff;--on-sub:#dbe6ff;--on-av-bg:#ffffff;--on-av-fg:#2f6bff;
  --tick:#e2e6ea;--fill:#dbe6ff;--foul:#e5382f;--win:#2f6bff;
  --r-card:18px;--r-pill:14px;--r-ctl:16px;--r-chip:12px;--r-cta:16px;
  --num:'Gothic A1','Apple SD Gothic Neo',sans-serif;--num-w:800;--w-title:800;--w-text:500;--w-name:700;
}
#app[data-theme="dark"]{
  --bg:#101216;--fg:#f3f5f7;--fg2:#c3cad3;--sub:#9aa3af;
  --panel:rgba(31,35,42,.9);--bd:rgba(255,255,255,.12);--sh:none;
  --hair:rgba(255,255,255,.08);--opt:rgba(255,255,255,.06);--sheet:#1a1d23;--scrim:rgba(4,6,9,.62);
  --acc:#36c5d8;--acc-fg:#06181c;--sel-bg:rgba(54,197,216,.13);--sel-bd:#36c5d8;
  --seg:rgba(255,255,255,.05);--seg-on:rgba(255,255,255,.15);--seg-sh:none;
  --cta:#f3f5f7;--cta-fg:#101216;
  --av1-bg:transparent;--av1-bd:#36c5d8;--av1-fg:#7fe0ee;--av2-bg:transparent;--av2-bd:#f0a96b;--av2-fg:#f6c79b;
  --on-bg:rgba(31,35,42,.9);--on-bd:#36c5d8;--on-fg:#f3f5f7;--on-sub:#7fe0ee;--on-av-bg:#36c5d8;--on-av-fg:#06181c;
  --tick:rgba(255,255,255,.14);--fill:rgba(54,197,216,.22);--foul:#e5484d;--win:#36c5d8;
  --r-card:18px;--r-pill:999px;--r-ctl:24px;--r-chip:999px;--r-cta:999px;
  --num:'Outfit','Gothic A1',sans-serif;--num-w:500;--w-title:700;--w-text:300;--w-name:500;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#eef0f3;font-family:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.3;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-weight:var(--w-text)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.num{font-family:var(--num);font-weight:var(--num-w)}

/* ---------- shared pieces ---------- */
.panel{background:var(--panel);border:1px solid var(--bd);box-shadow:var(--sh);border-radius:var(--r-card)}
.btn{background:var(--panel);border:1px solid var(--bd);box-shadow:var(--sh);border-radius:var(--r-chip);height:44px;padding:0 16px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;color:var(--fg2);white-space:nowrap;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.icon{width:44px;padding:0}
.btn .k{font-weight:var(--w-text);color:var(--sub)}
.btn .v{color:var(--fg)}
.btn.cta{background:var(--cta);color:var(--cta-fg);border-color:transparent;border-radius:var(--r-cta);height:60px;font-size:19px;font-weight:700;box-shadow:none}
.btn.flat{box-shadow:none;background:var(--opt);border-color:transparent}
.lab{font-size:12.5px;font-weight:700;color:var(--sub);padding-left:4px;letter-spacing:.02em}
.seg{background:var(--seg);border:1px solid var(--bd);border-radius:var(--r-chip);padding:4px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.seg button{height:38px;border-radius:calc(var(--r-chip) - 3px);font-size:14.5px;color:var(--sub);transition:background .15s}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:var(--seg-sh);color:var(--fg);font-weight:700}
/* a seg whose choice is a bar that can be dragged along; its colour says how hard the choice is */
.seg.slide{position:relative;touch-action:none;--n:4;--i:1;--g:linear-gradient(135deg,#58b4ff,#1f6fe5)}
.seg.slide::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px - (var(--n) - 1)*4px)/var(--n));border-radius:calc(var(--r-chip) - 3px);
  background:var(--g);box-shadow:0 3px 10px rgba(0,0,0,.22);transform:translateX(calc(var(--i)*(100% + 4px)));transition:transform .16s cubic-bezier(.3,.9,.4,1)}
.seg.slide.drag::before{transition:none;filter:brightness(1.08)}
.seg.slide button{position:relative;background:none!important;box-shadow:none!important;pointer-events:none;transition:color .15s}
.seg.slide button[aria-pressed="true"]{color:#fff}
.seg.slide[data-lv="0"]{--g:linear-gradient(135deg,#5fe08f,#12a150)}
.seg.slide[data-lv="1"]{--g:linear-gradient(135deg,#58b4ff,#1f6fe5)}
.seg.slide[data-lv="2"]{--g:linear-gradient(135deg,#ff7a66,#d92c3a)}
.seg.slide[data-lv="3"]{--g:linear-gradient(135deg,#c084ff,#6a2bd9)}
/* songs kept for the reel */
.song{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.song:first-of-type{border-top:0}
.song .chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:15px;color:transparent}
.song.on .chk{background:#1f6fe5;border-color:#1f6fe5;color:#fff}
.song .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song .meta{font-size:12.5px;color:var(--sub);font-family:var(--num)}
.song .acts{display:flex;gap:6px}
.song .acts button{height:34px;padding:0 10px;font-size:13px;border-radius:10px;border:1px solid var(--bd);color:var(--fg)}
.song:not(.on) .nm{color:var(--sub)}
.pickrow{display:flex;flex-wrap:wrap;gap:6px}
.pickrow button{height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--bd);font-size:14px;color:var(--sub)}
.pickrow button[aria-pressed="true"]{background:var(--fg);color:var(--bg,#fff);border-color:var(--fg);font-weight:700}
.av{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;box-sizing:border-box;font-style:normal;font-family:var(--num);font-weight:var(--num-w);font-size:17px;
  background:var(--av1-bg);border:1px solid var(--av1-bd);color:var(--av1-fg)}
.two .av{background:var(--av2-bg);border-color:var(--av2-bd);color:var(--av2-fg)}

/* ---------- home ---------- */
#home{position:absolute;inset:0;display:grid;grid-template-columns:300px minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr);
  gap:18px 26px;padding:24px 30px 26px;pointer-events:none}
#home>*{pointer-events:auto}
.h-top{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:30px;height:30px;border-radius:50%;background:var(--fg);display:grid;place-items:center}
.logo .mark i{width:15px;height:15px;border-radius:50%;background:var(--bg);color:var(--fg);font-style:normal;font-size:10px;font-weight:800;display:grid;place-items:center}
.logo .word{font-family:'Outfit',sans-serif;font-size:24px;font-weight:600;letter-spacing:.14em;white-space:nowrap}
.logo .en{font-family:'Outfit',sans-serif;font-weight:500;font-size:11px;letter-spacing:.34em;color:var(--sub);margin-left:6px}
[data-theme="light"] .logo .en{display:none}
@media (max-width:520px){.logo .en{display:none}.logo .mark{flex:none}}
.h-actions{margin-left:auto;display:flex;gap:8px}
.h-left,.h-right{display:flex;flex-direction:column;gap:10px;min-height:0}
#modeList{display:flex;flex-direction:column;gap:10px}
.gcard{background:var(--panel);border:2px solid var(--bd);box-shadow:var(--sh);border-radius:var(--r-card);padding:14px 16px;display:flex;align-items:center;gap:14px;text-align:left;transition:transform .08s}
[data-theme="light"] .gcard{border-color:var(--panel)}
.gcard:active{transform:scale(.985)}
.gcard[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bd)}
.gcard .ic{flex:none;width:40px;height:40px;display:grid;place-items:center}
.gcard .nm{display:block;font-size:19px;font-weight:var(--w-name);color:var(--fg)}
.gcard .bl{display:block;font-size:13.5px;color:var(--sub);margin-top:2px}
.gcard .ck{margin-left:auto;flex:none;color:var(--acc);visibility:hidden}
.gcard[aria-pressed="true"] .ck{visibility:visible}
.ball{display:grid;place-items:center;border-radius:50%;background:var(--c,#111);width:40px;height:40px;box-sizing:border-box}
[data-theme="dark"] .ball{border:1px solid rgba(255,255,255,.22)}
.ball i{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#fff;color:#111;font-style:normal;font-family:var(--num);font-weight:800;font-size:13px}
.four{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;width:40px;height:40px}
.four i{border-radius:50%;background:var(--c)}
.three{position:relative;width:40px;height:40px}
.three i{position:absolute;width:19px;height:19px;border-radius:50%;background:var(--c)}
.three i:nth-child(1){left:10.5px;top:1px}.three i:nth-child(2){left:0;bottom:2px}.three i:nth-child(3){right:0;bottom:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.h-mid{display:flex;align-items:flex-end;justify-content:center;pointer-events:none!important;min-width:0}
.h-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
.chip-sw{width:16px;height:16px;border-radius:5px;background:var(--c)}
.plist{padding:4px 16px;display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;text-align:left;min-width:0}
.prow+.prow{border-top:1px solid var(--hair)}
.prow .who{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.prow .nm{font-size:18px;font-weight:var(--w-name);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .rc{font-size:13.5px;color:var(--sub)}
.prow svg{flex:none;color:var(--sub);opacity:.7}
#startBtn{margin-top:auto}
#vsBox{display:flex;flex-direction:column;gap:10px}
#pracList{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0;flex:1 1 0;padding-right:2px}
#pracList .opt{padding:10px 14px;flex:none}
#pracList .opt .t{font-size:15.5px}
#pracList .opt .d{font-size:12.5px;margin-top:1px}
#pracList .opt>span:first-child{flex:1;min-width:0}
.lv{flex:none;font-family:var(--num);font-size:12px;color:var(--sub);border:1px solid var(--bd);border-radius:999px;padding:3px 9px;white-space:nowrap}
[data-theme="light"] .lv{background:var(--bg)}
.compact #pracList{flex:none;max-height:none;overflow:visible}
.target{width:40px;height:40px;border-radius:50%;border:3px solid var(--acc);display:grid;place-items:center;box-sizing:border-box}
.target i{width:14px;height:14px;border-radius:50%;background:var(--acc)}

.compact #home{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:max-content max-content max-content;align-content:start;overflow:auto;pointer-events:auto;
  background:var(--bg);gap:14px 16px;padding:14px 16px 20px}
.compact .h-mid{grid-column:1/-1;order:3}
.compact.portrait #home{grid-template-columns:minmax(0,1fr)}
.compact #startBtn{margin-top:6px;position:sticky;bottom:10px;z-index:2;box-shadow:0 8px 24px rgba(0,0,0,.22)}   /* always in reach, however long the options above it get */

/* ---------- in-game scoreboard ---------- */
#hud{position:absolute;top:0;left:0;right:0;height:var(--hud-h);display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr) auto;
  align-items:center;gap:8px;padding:6px 10px 0}
#pracBar{justify-self:end;display:flex;gap:6px;min-width:0}
#pracBar .btn{height:46px;padding:0 14px;font-size:14px;white-space:nowrap}
#pracBar .btn[aria-pressed="true"]{background:var(--on-bg);border-color:var(--on-bd);color:var(--on-fg)}
#menuBtn,#viewBtn{width:46px;height:46px;border-radius:var(--r-pill)}
[data-theme="light"] #menuBtn,[data-theme="light"] #viewBtn{border-radius:13px}
#viewBtn[aria-pressed="true"]{background:var(--on-bg);border-color:var(--on-bd);color:var(--on-fg)}
.pill{justify-self:start;max-width:100%;min-width:0;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--bd);box-shadow:var(--sh);
  border-radius:var(--r-pill);padding:5px 15px 5px 6px;color:var(--sub);transition:background .2s,border-color .2s,color .2s}
.pill.r{justify-self:end;flex-direction:row-reverse;padding:5px 6px 5px 15px;text-align:right}
.pill .av{width:34px;height:34px;font-size:15px}
.pill .who{min-width:0;display:flex;flex-direction:column;gap:1px}
.pill .nm{font-size:14.5px;font-weight:var(--w-name);line-height:1.15;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .sub{font-size:11.5px;line-height:1.15;white-space:nowrap}
.pill.on{background:var(--on-bg);border-color:var(--on-bd);color:var(--on-sub)}
.pill.on .nm{color:var(--on-fg)}
.pill.on .av{background:var(--on-av-bg);border-color:transparent;color:var(--on-av-fg)}
.pill.r.on .av{background:var(--on-av-bg)}
.tray{display:flex;gap:3px;min-width:0}
.mb{flex:none;width:14px;height:14px;border-radius:50%;box-sizing:border-box;background:var(--c,#333)}
.mb.st{background:linear-gradient(#f1efe8 0 25%,var(--c) 25% 75%,#f1efe8 75%)}
.mb.slot{background:none;border:1.5px solid currentColor;opacity:.45}
.mb.e8{background:#0b0b0d;border:1.5px solid var(--acc)}
[data-theme="light"] .pill.on .mb{border:1.5px solid #fff}
[data-theme="light"] .mb.st{border:1px solid #d5dae0}
.pts{font-family:var(--num);font-weight:var(--num-w);font-size:26px;line-height:1;min-width:24px;text-align:center;color:var(--fg)}
.pill.on .pts{color:var(--on-fg)}
#badge{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--bd);box-shadow:var(--sh);border-radius:999px;padding:8px 16px;font-size:13px;color:var(--sub);white-space:nowrap}
#badge b{font-weight:800;color:var(--fg)}
[data-theme="dark"] #badge{background:none;border:0;padding:0}
[data-theme="dark"] #badge b{font-family:'Outfit',sans-serif;font-weight:500;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--sub)}

/* messages that pop up over the table: chunky rounded letters with one black outline.
   The element itself is drawn as a thick black stroke; an exact copy of the text sits on top in the fill colour. */
#toast{position:absolute;left:50%;top:calc(var(--hud-h) + 16px);transform:translate(-50%,0) scale(.7);width:max-content;max-width:min(90%,680px);
  font-family:'Jua','Gothic A1',sans-serif;font-weight:400;font-size:clamp(19px,2.5vw,29px);line-height:1.28;letter-spacing:.01em;text-align:center;
  color:#15171c;-webkit-text-stroke:7px #15171c;--fill:#fff;opacity:0;pointer-events:none;transition:opacity .16s,transform .22s cubic-bezier(.2,1.6,.4,1)}
#toast::after{content:attr(data-t);position:absolute;inset:0;color:var(--fill);-webkit-text-stroke:0}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast.foul{--fill:#ff6259}
#toast.good{--fill:#ffe04a}
#fps{position:absolute;left:8px;bottom:6px;font-family:'Outfit',sans-serif;font-size:12px;color:var(--fg);background:var(--panel);border-radius:8px;padding:2px 8px;pointer-events:none}

/* ---------- controls: same places and behaviour as before ---------- */
#power,#fine{position:absolute;touch-action:none;border-radius:var(--r-ctl);background:var(--panel);border:1px solid var(--bd);box-shadow:var(--sh);box-sizing:border-box}
#power{left:10px;top:calc(var(--hud-h) + 12px);bottom:14px;width:48px;overflow:hidden}
/* the power control is the chosen cue: drag it back along the track, let go to strike */
#powerCue{position:absolute;left:50%;top:0;width:15px;height:100%;transform:translate(-50%,10px);filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
#power::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--heat,transparent),transparent var(--reach,0%));pointer-events:none}
#powerNum{position:absolute;left:5px;right:5px;bottom:6px;padding:15px 0 3px;text-align:center;font-family:var(--num);font-weight:var(--num-w);font-size:18px;color:var(--fg);background:var(--chip-bg,#1f232a);border-radius:999px}
[data-theme="light"] #powerNum{--chip-bg:#f2f4f6}
#powerLab{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:10.5px;color:var(--sub);z-index:1}
#fine{right:10px;top:calc(var(--hud-h) + 12px);bottom:90px;width:48px;overflow:hidden;
  background-image:repeating-linear-gradient(180deg,transparent 0 10px,var(--tick) 10px 11.5px)}
#fine::after{content:"";position:absolute;left:7px;right:7px;top:50%;height:3px;margin-top:-1.5px;background:var(--acc);border-radius:2px}
#fineLab{position:absolute;left:0;right:0;top:0;padding:7px 0 5px;text-align:center;font-size:10.5px;color:var(--sub);background:var(--panel)}
#spinBtn,#spinPad{background:radial-gradient(circle at 36% 30%,#ffffff 0,#f6f1e4 34%,#d9d2c0 72%,#aaa28f 100%)}
#spinBtn{position:absolute;right:10px;bottom:14px;width:60px;height:60px;border-radius:50%;border:0;box-shadow:0 2px 4px rgba(0,0,0,.2),0 8px 18px rgba(0,0,0,.28),inset 0 -3px 6px rgba(0,0,0,.12)}
#spinDot,.sdot{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#ff7a6e,#d8352c 55%,#a61f18);box-shadow:0 1px 2px rgba(0,0,0,.3)}
#spinPop{position:absolute;right:82px;bottom:14px;background:var(--sheet);border:1px solid var(--bd);border-radius:22px;box-shadow:0 12px 32px rgba(0,0,0,.24);padding:14px;
  display:flex;flex-direction:column;align-items:center;gap:10px}
#spinPad{position:relative;width:150px;height:150px;border-radius:50%;touch-action:none;box-shadow:0 4px 12px rgba(0,0,0,.25),inset 0 -8px 16px rgba(0,0,0,.14)}
#spinPad::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(rgba(25,31,40,.16),rgba(25,31,40,.16)) center/1px 72% no-repeat,linear-gradient(rgba(25,31,40,.16),rgba(25,31,40,.16)) center/72% 1px no-repeat;pointer-events:none}
#spinPad::before{content:"";position:absolute;inset:14%;border-radius:50%;border:1.5px dashed rgba(25,31,40,.25)}
#spinPad .sdot{width:22px;height:22px;margin:-11px}
#spinHint{font-size:12.5px;color:var(--sub);text-align:center;max-width:180px;line-height:1.45}
#app.busy #power,#app.busy #fine,#app.busy #spinBtn{opacity:.45;pointer-events:none}
#power,#fine,#spinBtn{transition:opacity .2s}

.portrait #power{left:84px;right:10px;top:auto;bottom:14px;width:auto;height:46px}
.portrait #power::before{background:linear-gradient(to left,var(--heat,transparent),transparent var(--reach,0%))}
.portrait #powerCue{left:0;top:50%;width:100%;height:15px;transform:translate(10px,-50%)}
.portrait #powerNum{left:auto;right:5px;top:5px;bottom:5px;padding:0 12px 0 40px;display:grid;place-items:center}
.portrait #powerLab{left:auto;right:42px;top:0;bottom:0;display:grid;place-items:center}
.portrait #fine{left:84px;right:10px;top:auto;bottom:70px;width:auto;height:32px;
  background-image:repeating-linear-gradient(90deg,transparent 0 10px,var(--tick) 10px 11.5px)}
.portrait #fine::after{left:50%;right:auto;top:6px;bottom:6px;width:3px;height:auto;margin:0 0 0 -1.5px}
.portrait #fineLab{left:0;right:auto;top:0;bottom:0;padding:0 8px 0 12px;display:grid;place-items:center}
.portrait #spinBtn{left:12px;right:auto;bottom:26px}
.portrait #spinPop{left:10px;right:auto;bottom:112px}

/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:var(--scrim);overflow:auto}
.sheet{width:min(100%,500px);background:var(--sheet);border:1px solid var(--bd);border-radius:24px;box-shadow:0 24px 64px rgba(0,0,0,.3);padding:20px;display:flex;flex-direction:column;gap:16px;
  animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet h2{margin:0;font-size:21px;font-weight:var(--w-title);letter-spacing:-.01em}
#sheetBody{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--opt);border:2px solid transparent;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:14px;text-align:left;transition:transform .08s}
.opt:active{transform:scale(.985)}
.opt[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bd)}
.opt .t{display:block;font-size:16.5px;font-weight:var(--w-name);color:var(--fg)}
.opt .d{display:block;font-size:13px;color:var(--sub);margin-top:2px;line-height:1.4}
.sw{flex:none;width:56px;height:36px;border-radius:8px;background:var(--c);border:5px solid var(--w);box-sizing:border-box}
.cuepic{flex:none;width:150px;height:11px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.txt{font:inherit;font-size:20px;font-weight:700;color:var(--fg);background:var(--opt);border:2px solid transparent;border-radius:14px;padding:12px 14px;width:100%;box-sizing:border-box;
  -webkit-user-select:text;user-select:text}
.txt:focus{border-color:var(--acc);outline:none}
.rec{display:grid;grid-template-columns:minmax(0,1fr) 52px 52px 76px;gap:8px 10px;align-items:center;font-size:16px}
.rec .hd{font-size:12px;color:var(--sub)}
.rec .n{font-family:var(--num);font-weight:var(--num-w);text-align:center;font-size:18px}
.note{font-size:13px;color:var(--sub);margin:0;line-height:1.5}
.row{display:flex;gap:10px}.row>*{flex:1}

/* ---------- best-shot reel ---------- */
#reel{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#reel .lb{position:absolute;left:0;right:0;height:9%;background:#000;z-index:3}
#reel .lb.t{top:0}#reel .lb.b{bottom:0}
#reel::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.6));transition:opacity .25s;opacity:.75}
.colour #reel::after{opacity:.45}
.hold #reel::after{opacity:1}
#reelSkip{position:absolute;right:18px;bottom:calc(9% + 14px);pointer-events:auto;z-index:4;height:40px;font-size:14px;opacity:.85}
#reelCv{position:absolute;inset:0;width:100%;height:100%;z-index:1}
#reelFx{position:absolute;inset:0;z-index:2}
.rfx.num{font:italic 800 34px 'Outfit',sans-serif;color:#fff;-webkit-text-stroke:5px #0b0d12;paint-order:stroke fill;margin:-17px 0 0 0}
/* one thing in the middle of the picture: the skull of the freeze, or the running count of the combo */
#reelBig{position:absolute;left:50%;top:50%;z-index:2;font-size:min(36vh,34vw);line-height:1;font-style:normal;white-space:nowrap;transform:translate(-50%,-50%) scale(0);opacity:0}
#reelBig.skull,#reelBig.gone{top:31%;font-size:min(27vh,24vw)}
#reelBig.skull{animation:skull .45s cubic-bezier(.2,1.5,.4,1) forwards;filter:drop-shadow(0 0 40px rgba(0,0,0,.8))}
#reelBig.skull{animation:skull .45s cubic-bezier(.2,1.5,.4,1) forwards,wob .5s .45s ease-in-out infinite}
@keyframes wob{0%,100%{transform:translate(-50%,-50%) rotate(-5deg) scale(1)}50%{transform:translate(-50%,-50%) rotate(5deg) scale(1.06)}}
#reelBig.gone{animation:gone .22s ease-in forwards}
#reelBig.num3{font:italic 800 min(36vh,32vw)/1 'Outfit',sans-serif;color:#fff;-webkit-text-stroke:14px #0b0d12;paint-order:stroke fill;text-shadow:8px 0 #ff2d55,-8px 0 #19e3ff;animation:num3 .42s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes num3{0%{transform:translate(-50%,-50%) scale(2.8);opacity:0}30%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:.92}}
@keyframes skull{0%{transform:translate(-50%,-50%) scale(3);opacity:0}40%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes gone{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(3.4);opacity:0}}
#reelBig.count{left:auto;right:6%;top:20%;transform:none;opacity:1;font:italic 800 clamp(48px,10vw,120px)/1 'Outfit',sans-serif;color:hsl(calc(48 - 48*var(--hot,0)) 100% calc(100% - 42%*var(--hot,0)));text-shadow:0 0 calc(40px*var(--hot,0)) #ff7a1a;-webkit-text-stroke:10px #0b0d12;paint-order:stroke fill;transform-origin:100% 50%}
#reelBig.count.pop{animation:cpop .22s cubic-bezier(.2,1.6,.4,1)}
#reelBig.count.last{color:#ffe04a;animation:cpop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes cpop{0%{transform:scale(1.7) rotate(-6deg)}100%{transform:scale(1)}}
/* tape running backwards */
#reelTag{position:absolute;right:22px;top:calc(9% + 14px);z-index:2;font:800 20px/1 'Outfit','Gothic A1',sans-serif;color:#fff;letter-spacing:.04em;text-shadow:0 0 6px rgba(0,0,0,.8),2px 0 #ff2d55,-2px 0 #19e3ff;animation:blink .5s steps(2) infinite}
.rew #reel::before{content:"";position:absolute;inset:-6px 0;z-index:1;background:repeating-linear-gradient(0deg,rgba(255,255,255,.09) 0 2px,transparent 2px 6px),linear-gradient(0deg,transparent 0 62%,rgba(255,255,255,.16) 64%,transparent 70%);animation:vhs .13s steps(3) infinite}
@keyframes vhs{0%{transform:translateY(-6px)}100%{transform:translateY(6px)}}
@keyframes blink{0%{opacity:1}100%{opacity:.25}}
.rfx{position:absolute;font-style:normal;font-size:52px;line-height:1;margin:-26px 0 0 -26px;animation:rfx 1.4s ease-out forwards}
@keyframes rfx{0%{transform:translateY(30px) scale(.4);opacity:0}18%{opacity:1;transform:translateY(0) scale(1.25) rotate(var(--rot))}100%{transform:translate(var(--dx),-190px) scale(1) rotate(var(--rot));opacity:0}}
#reelFlash{position:absolute;inset:0;background:#fff;opacity:0;z-index:1}
#reelFlash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
#reelFade{position:absolute;inset:0;background:#000;opacity:0;z-index:3;transition:opacity .5s}
#reelFade.go{opacity:1}
/* the grade: drained before the drop, rich after it; one or two frames of negative on the hit itself */
.reeling #gl{filter:grayscale(.9) contrast(1.12) brightness(.9);transition:filter .12s}
.reeling.colour #gl{filter:saturate(1.4) contrast(1.16)}
/* three looks a cut can take: rich, bleached, and black-and-white with the contrast up (none of them changes which colour a ball is) */
.reeling.g1 #gl{filter:saturate(1.9) contrast(1.22) sepia(.14)!important}
.reeling.g2 #gl{filter:saturate(.62) contrast(1.38) brightness(.94)!important}
.reeling.g3 #gl{filter:grayscale(1) contrast(1.7) brightness(1.08)!important}
.reeling.frozen #gl{filter:grayscale(1) contrast(1.3) brightness(.55)!important}
.reeling.rew #gl{animation:trk .16s steps(2) infinite}
@keyframes trk{0%{transform:skewX(-.5deg) translateX(-4px)}100%{transform:skewX(.4deg) translateX(3px)}}
/* a streak of light across the picture on the drop, a softer flash for cuts, the frame glowing in the ball's colour on each beat */
#reelStreak{position:absolute;left:-10%;right:-10%;top:50%;height:10px;margin-top:-5px;z-index:2;opacity:0;border-radius:50%;background:radial-gradient(ellipse at center,#fff 0,rgba(255,255,255,.85) 18%,var(--kc,#fff) 45%,transparent 72%);filter:blur(1.5px);mix-blend-mode:screen}
#reelStreak.go{animation:streak .55s cubic-bezier(.1,.8,.2,1)}
@keyframes streak{0%{opacity:1;transform:scale(.1,3.2)}30%{opacity:.95;transform:scale(1,1.4)}100%{opacity:0;transform:scale(1.25,.2)}}
#reelFlash.soft{animation:flashS .22s ease-out}
@keyframes flashS{0%{opacity:.34}100%{opacity:0}}
#reel .glowE{position:absolute;left:0;right:0;top:9%;bottom:9%;z-index:1;opacity:0;box-shadow:inset 0 0 90px 14px var(--kc,#fff);mix-blend-mode:screen}
.pulse #reel .glowE{animation:glowE .42s ease-out}
@keyframes glowE{0%{opacity:.75}100%{opacity:0}}
.rfx.fall{animation:rfall 2.4s cubic-bezier(.4,0,.8,.6) forwards;font-size:44px}
@keyframes rfall{0%{transform:translateY(-60px) rotate(0);opacity:1}85%{opacity:1}100%{transform:translate(var(--dx),105vh) rotate(calc(var(--rot)*8));opacity:0}}
.reeling.rew #gl{filter:saturate(1.8) contrast(1.3) hue-rotate(-16deg) brightness(1.05)!important;transition:none}
.reeling.impact #gl{filter:invert(1) contrast(1.5)!important;transition:none}
/* ---------- the look of each edit (sk-<name> on the page while it plays) ---------- */
#reelTint{position:absolute;inset:0;pointer-events:none;opacity:0}
#reelFrame{position:absolute;inset:0;z-index:2;pointer-events:none}
/* cuts: cinema - wider bars, teal shadows and orange highlights */
.sk-cuts #reel .lb{height:12.5%}
.sk-cuts #reelTint{opacity:.55;background:linear-gradient(180deg,#0aa6b8,transparent 42%,transparent 58%,#ff8a2b);mix-blend-mode:soft-light}
/* tracer: light painted in a dark room */
.reeling.sk-tracer #gl{filter:brightness(.36) saturate(.5) contrast(1.15)}
.reeling.sk-tracer.colour #gl{filter:brightness(.58) saturate(1.15) contrast(1.15)}
/* math: a blueprint */
.reeling.sk-math #gl{filter:grayscale(1) brightness(.66) contrast(1.35)}
.reeling.sk-math.colour #gl{filter:grayscale(.5) brightness(.85) contrast(1.25)}
.sk-math #reelTint{opacity:1;background:#1246c4;mix-blend-mode:color}
.sk-math.colour #reelTint{opacity:.5}
/* freeze: a printed page - black and white with dots, red when everything stops */
.reeling.sk-freeze #gl{filter:grayscale(1) contrast(1.7) brightness(1.06)}
.reeling.sk-freeze.colour #gl{filter:saturate(1.5) contrast(1.2)}
.sk-freeze #reelTint{opacity:.3;background:radial-gradient(circle,#000 1.1px,transparent 1.7px) 0 0/7px 7px;mix-blend-mode:multiply}
.sk-freeze.frozen #reelTint{opacity:.6;background:radial-gradient(circle,#000 1.1px,transparent 1.7px) 0 0/7px 7px,#ff2a2a}
.sk-freeze.colour #reelTint{opacity:0}
/* velocity: speed - red and cyan fringes at the sides */
.sk-velocity #reelFrame{top:9%;bottom:9%;box-shadow:inset 30px 0 46px -20px #ff2d55,inset -30px 0 46px -20px #19e3ff;mix-blend-mode:screen}
/* combo: an arcade cabinet - loud colour from the first frame, scan lines, a lit frame */
.reeling.sk-combo #gl{filter:saturate(1.75) contrast(1.2)}
.sk-combo #reelTint{opacity:.2;background:repeating-linear-gradient(0deg,#000 0 2px,transparent 2px 4px);mix-blend-mode:multiply}
.sk-combo #reelFrame{top:9%;bottom:9%;box-shadow:inset 0 0 0 4px #ffe04a,inset 0 0 46px #ff7a1a}
/* rewind: video tape - a 4:3 frame, scan lines, colour bleed */
.sk-rewind #reelFrame{background:linear-gradient(90deg,#000 0 10%,transparent 10% 90%,#000 90%)}
.sk-rewind #reelTint{opacity:.55;background:repeating-linear-gradient(0deg,rgba(255,255,255,.1) 0 1px,transparent 1px 4px),linear-gradient(90deg,rgba(255,0,80,.14),rgba(0,200,255,.14));mix-blend-mode:screen}
.sk-rewind #reelTag{right:calc(10% + 18px)}
/* pov: a camera strapped to the ball - viewfinder corners, heavy edges */
.sk-pov #reelFrame{inset:14% 6%;--b:linear-gradient(#fff,#fff);background:var(--b) 0 0/44px 3px,var(--b) 0 0/3px 44px,var(--b) 100% 0/44px 3px,var(--b) 100% 0/3px 44px,var(--b) 0 100%/44px 3px,var(--b) 0 100%/3px 44px,var(--b) 100% 100%/44px 3px,var(--b) 100% 100%/3px 44px;background-repeat:no-repeat;opacity:.85}
.sk-pov #reel::after{opacity:1}
.sk-pov #reelTag{color:#ff3b3b;text-shadow:0 0 6px rgba(0,0,0,.8);right:calc(6% + 62px);top:calc(14% + 10px)}
/* strobe: a dark stage with a flashing light */
.reeling.sk-strobe #gl{filter:brightness(.42) contrast(1.25) grayscale(.6)}
.reeling.sk-strobe.colour #gl{filter:brightness(.68) contrast(1.2) saturate(1.3)}
/* bullet: the world turns to green code while time is stopped */
.reeling.sk-bullet.matrix #gl{filter:grayscale(1) contrast(1.5) brightness(.85)}
.sk-bullet.matrix #reelTint{opacity:.85;background:#19ff7a;mix-blend-mode:color}
/* count: a slab of colour for every number */
.sk-count.tinted #reelTint{opacity:.78;background:var(--tint,#ff2d55);mix-blend-mode:multiply}
.reeling.sk-count.tinted #gl{filter:grayscale(1) contrast(1.5) brightness(1.15)}
/* glitch: the picture tearing (the stutter edit, and the crash in the worst-shot reel) */
.glitch #reelTint{opacity:.9;mix-blend-mode:screen;background:repeating-linear-gradient(0deg,transparent 0 22px,rgba(255,0,80,.4) 22px 27px,transparent 27px 61px,rgba(0,220,255,.4) 61px 65px);animation:gly .09s steps(2) infinite}
.glitch #gl{animation:glx .09s steps(2) infinite}
@keyframes gly{0%{transform:translateY(-14px)}100%{transform:translateY(19px)}}
@keyframes glx{0%{transform:translateX(-8px) skewX(1.6deg)}100%{transform:translateX(7px) skewX(-1.2deg)}}
/* words over the picture in the worst-shot reels */
#reelCard{position:absolute;z-index:2;color:#fff}
#reelCard.news{left:0;right:0;bottom:9%;padding-right:130px;display:grid;grid-template-columns:auto 1fr;background:linear-gradient(90deg,#b00020,#e5123a);animation:newsIn .28s ease-out;box-shadow:0 -6px 24px rgba(0,0,0,.35)}
#reelCard.news i{grid-row:span 2;font-style:normal;font-weight:800;font-size:clamp(20px,3.4vw,34px);padding:8px 20px;background:#fff;color:#c0102e;display:grid;place-items:center}
#reelCard.news b{font-size:clamp(18px,3vw,32px);padding:9px 18px 1px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#reelCard.news .tick{font-size:clamp(12px,1.6vw,16px);padding:2px 18px 9px;opacity:.92;white-space:nowrap;overflow:hidden}
@keyframes newsIn{0%{transform:translateY(100%)}100%{transform:none}}
#reelCard.bsod{left:0;right:0;top:9%;bottom:9%;background:#0b3fc4;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:0 9%}
#reelCard.bsod b{font:300 clamp(64px,12vw,130px)/1 'Outfit',sans-serif}
#reelCard.bsod span{font-size:clamp(19px,3vw,30px);font-weight:700}
#reelCard.bsod small{font:500 clamp(12px,1.8vw,17px)/1.4 'Outfit','Gothic A1',sans-serif;opacity:.88}
#reelCard.obit{left:0;right:0;bottom:calc(9% + 24px);text-align:center;font-size:clamp(16px,2.6vw,26px);text-shadow:0 2px 10px #000,0 0 2px #000}
#reelCard.obit b{font-weight:800}
#reelBig.num3.q{color:#ffe04a;letter-spacing:-.04em;font-style:normal;top:30%;font-size:min(30vh,26vw)}
.hit #gl,.hit #reelCv{animation:hit .34s cubic-bezier(.2,.8,.3,1)}
.beat #gl,.beat #reelCv{animation:beat .2s ease-out}
@keyframes hit{0%{transform:scale(1.12) translate(6px,-5px) rotate(.5deg)}18%{transform:scale(1.07) translate(-7px,5px) rotate(-.4deg)}36%{transform:scale(1.05) translate(5px,4px)}55%{transform:scale(1.03) translate(-3px,-3px)}100%{transform:scale(1)}}
@keyframes beat{0%{transform:scale(1.035)}100%{transform:scale(1)}}

/* ---------- league ---------- */
#league{position:absolute;inset:0;overflow:auto;background:var(--bg);padding:20px clamp(14px,4vw,40px) 32px}
.lg-top{display:flex;align-items:center;gap:14px;max-width:860px;margin:0 auto 18px}
.lg-top h1{margin:0;font-size:24px;font-weight:var(--w-title);letter-spacing:-.02em;flex:1}
#lgTabs{min-width:230px}
#lgTabs button{height:38px;font-size:14px}
#lgBody{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.lt{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r-card);box-shadow:var(--sh);overflow:hidden}
.ltr{display:grid;grid-template-columns:var(--cols);align-items:center;gap:6px;padding:11px 18px 11px 16px;font-size:15.5px;position:relative;color:var(--fg)}
.ltr+.ltr,.fx+.fx{border-top:1px solid var(--hair)}
.ltr.hd{font-size:11.5px;color:var(--sub);padding-block:9px}
.ltr.hd span{font-family:inherit!important;font-weight:inherit!important}
.ltr.top::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 2px 2px 0;background:var(--acc)}
.ltr .pos{font-family:var(--num);color:var(--sub);font-size:14px}
.ltr .nm{font-weight:var(--w-name);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltr .n{font-family:var(--num);font-weight:var(--num-w);text-align:center}
.ltr .pts{font-weight:700}
.ltr .fc{text-align:right}
.form{display:flex;gap:4px;justify-content:flex-end}
.form i{width:20px;height:20px;border-radius:50%;font-style:normal;font-size:10.5px;font-weight:700;display:grid;place-items:center;color:#fff}
.form .w{background:#1f9d6b}.form .l{background:var(--foul)}
.rd{font-size:12px;color:var(--sub);padding:8px 4px 0}
.fx{display:grid;grid-template-columns:minmax(0,1fr) 96px minmax(0,1fr);align-items:center;gap:14px;padding:9px 18px;font-size:16px}
.fx .a{text-align:right}.fx .a,.fx .b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx .sc{font-family:var(--num);font-weight:var(--num-w);font-size:18px;text-align:center}
.fx .win{font-weight:700}.fx .lose{color:var(--sub)}
.fx .btn{height:36px;padding:0;font-size:14px}.fx .btn.cta{height:36px;font-size:14px}
.champ{display:flex;align-items:baseline;gap:12px;padding:16px 20px}
.champ b{font-size:24px;font-weight:var(--w-title)}.champ .k{font-size:13px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipn{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--bd);box-shadow:var(--sh);border-radius:999px;padding:7px 7px 7px 15px;font-size:15px}
.chipn button{width:26px;height:26px;border-radius:50%;background:var(--opt);color:var(--sub);font-size:16px;line-height:1}
.addrow .txt{flex:3;font-size:17px;padding:9px 14px}.addrow .btn{flex:1}
#league .btn.cta{margin-top:4px}
@media (max-width:560px){.ltr .fc,.ltr .xs{display:none}.ltr{grid-template-columns:26px minmax(0,1fr) 34px 34px 34px 44px!important}.lg-top{flex-wrap:wrap}.lg-top h1{order:-1;flex-basis:100%}#lgTabs{flex:1}}

/* ---------- result ---------- */
#result{position:absolute;inset:0;overflow:auto;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,26px);padding:24px clamp(16px,5vw,60px)}
.r-title{font-family:'Outfit',sans-serif;font-weight:500;font-size:13px;letter-spacing:.36em;color:var(--sub)}
.r-vs{display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,34px);flex-wrap:wrap}
.r-win{display:flex;align-items:center;gap:16px;min-width:0}
.r-win .av{width:64px;height:64px;font-size:28px;background:var(--on-av-bg);border-color:transparent;color:var(--on-av-fg)}
[data-theme="light"] .r-win .av{background:var(--acc);color:#fff}
.r-win .nm{font-size:clamp(30px,4.6vw,48px);font-weight:var(--w-title);line-height:1.05;letter-spacing:-.02em}
.r-win .rc{font-size:15px;color:var(--sub);margin-top:4px}
.r-score{font-family:var(--num);font-weight:var(--num-w);font-size:clamp(52px,8vw,88px);line-height:1;white-space:nowrap;color:var(--sub)}
.r-score b{font-weight:inherit;color:var(--win)}
.r-lose{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:20px}
.r-lose .av{width:40px;height:40px}
#rStats{width:100%;max-width:720px;padding:6px 22px}
.srow{display:grid;grid-template-columns:64px minmax(0,1fr) 96px minmax(0,1fr) 64px;align-items:center;gap:12px;padding:11px 0}
.srow+.srow{border-top:1px solid var(--hair)}
.srow .k{font-size:13px;color:var(--sub);text-align:center}
.srow b,.srow span.n{font-family:var(--num);font-weight:var(--num-w);font-size:24px;color:var(--fg)}
.srow span.n{color:var(--sub);text-align:right}
.srow .bar{height:6px;border-radius:3px;background:var(--hair);overflow:hidden;display:flex}
.srow .bar.l{justify-content:flex-end}
.srow .bar i{display:block;height:100%;width:var(--w);border-radius:3px;background:var(--win)}
.srow .bar.r i{background:var(--sub);opacity:.6}
.r-shots{width:100%;max-width:720px;display:flex;gap:12px;flex-wrap:wrap}
.r-shots:not(:has(.shotBtn:not([hidden]))){display:none}
.shotBtn{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:12px;padding:14px 18px;text-align:left}
.shotBtn .k{font-family:'Outfit',sans-serif;font-weight:600;font-size:11px;letter-spacing:.2em;color:var(--sub);white-space:nowrap}
.shotBtn b{font-size:17px;font-weight:var(--w-name);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:9em}
.shotBtn .tg{font-size:13.5px;color:var(--sub);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shotBtn .go{font-weight:700;color:var(--win);white-space:nowrap}
.shotBtn.worst .go,.shotBtn.worst .k{color:#e5484d}
.stat{padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.stat .k{font-size:13px;color:var(--sub)}
.stat .v{font-family:var(--num);font-weight:var(--num-w);font-size:36px;line-height:1;white-space:nowrap;color:var(--fg)}
.stat .v span{font-size:20px;color:var(--sub);margin-left:8px}
#rWhy{font-size:15px;color:var(--sub);margin:0;text-align:center}
.r-btns{display:flex;gap:12px;width:100%;max-width:720px;margin-top:4px}
.r-btns .btn{flex:1;height:60px;font-size:17px}.r-btns .btn.cta{flex:2}
#nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:17px;line-height:1.6;background:#101216;color:#f3f5f7}

@media (max-height:520px){
  :root{--hud-h:52px}
  .pill .av{width:30px;height:30px;font-size:14px}
  #menuBtn,#viewBtn{width:40px;height:40px}
  #result{gap:10px;padding-block:14px}
  .srow{padding:7px 0}
  .r-win .av{width:48px;height:48px;font-size:22px}
}
@media (max-width:900px){#badge{display:none}#hud{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto}}
@media (max-width:640px){
  #badge{display:none}
  #hud{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;gap:6px;padding-inline:6px}
  #pracBar{gap:4px}#pracBar .btn{padding:0 10px;font-size:13px;height:42px}
  .pill{gap:6px;padding-right:9px}.pill.r{padding-left:9px}
  .mb{width:11px;height:11px}.tray{gap:2px}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* Cue-sports physics: 2D table plane, full 3D spin. Units are metres and seconds.
   createPhysics({ R, pockets, HL, HW, cornerMouth, sideMouth }) builds one table: a pool table with six pockets
   in any regulation size, or a carom table with none. */
function createPhysics(cfg) {
  const R = cfg.R, POCKETED = !!cfg.pockets;
  const HL = cfg.HL || 1.27, HW = cfg.HW || 0.635, G = 9.8;
  const MU_S = 0.2, MU_R = 0.016, MU_SP = 0.04, E_BALL = 0.96, MU_CUSH = 0.16;
  const CM = cfg.cornerMouth || 0.125, SM = cfg.sideMouth || 0.14, kc = CM / 0.125, ks = SM / 0.14;
  const GC = CM * Math.SQRT1_2, GS = SM / 2, CW = 0.05, PO = 0.03 * kc, SO = 0.05 * ks;
  const RC = 0.068 * kc, RS = 0.062 * ks, SC = RC * 0.91, SS = RS * 0.87, AI = 0.03 * kc;
  const D = Math.SQRT1_2;

  const POCKETS = !POCKETED ? [] : [
    { x: -HL - PO, y: HW + PO, r: RC, sink: SC, ax: -HL + AI, ay: HW - AI, nx: -D, ny: D, corner: true },
    { x: 0, y: HW + SO, r: RS, sink: SS, ax: 0, ay: HW, nx: 0, ny: 1, corner: false },
    { x: HL + PO, y: HW + PO, r: RC, sink: SC, ax: HL - AI, ay: HW - AI, nx: D, ny: D, corner: true },
    { x: HL + PO, y: -HW - PO, r: RC, sink: SC, ax: HL - AI, ay: -HW + AI, nx: D, ny: -D, corner: true },
    { x: 0, y: -HW - SO, r: RS, sink: SS, ax: 0, ay: -HW, nx: 0, ny: -1, corner: false },
    { x: -HL - PO, y: -HW - PO, r: RC, sink: SC, ax: -HL + AI, ay: -HW + AI, nx: -D, ny: -D, corner: true },
  ];

  // Cushions: a nose line plus (on a pool table) an angled jaw facing at each end.
  const CUSHIONS = [], SEGS = [];
  (function build() {
    const C38 = Math.cos(38 * Math.PI / 180), S38 = Math.sin(38 * Math.PI / 180);
    const C75 = Math.cos(75 * Math.PI / 180), S75 = Math.sin(75 * Math.PI / 180);
    const seg = (p, q) => { const l = Math.hypot(q[0] - p[0], q[1] - p[1]); SEGS.push({ ax: p[0], ay: p[1], bx: q[0], by: q[1], len: l, tx: (q[0] - p[0]) / l, ty: (q[1] - p[1]) / l }); };
    function add(ax, ay, bx, by, ox, oy, aCorner, bCorner) {
      const len = Math.hypot(bx - ax, by - ay), tx = (bx - ax) / len, ty = (by - ay) / len;
      const ja = aCorner ? [C38, S38, 0.065 * kc] : [C75, S75, 0.05 * ks];
      const jb = bCorner ? [C38, S38, 0.065 * kc] : [C75, S75, 0.05 * ks];
      const c = {
        a: [ax, ay], b: [bx, by], o: [ox, oy],
        ja: [ax + (-tx * ja[0] + ox * ja[1]) * ja[2], ay + (-ty * ja[0] + oy * ja[1]) * ja[2]],
        jb: [bx + (tx * jb[0] + ox * jb[1]) * jb[2], by + (ty * jb[0] + oy * jb[1]) * jb[2]],
      };
      CUSHIONS.push(c); seg(c.ja, c.a); seg(c.a, c.b); seg(c.b, c.jb);
    }
    function plain(ax, ay, bx, by, ox, oy) {
      // mitred into the corner: the back edge reaches the corner of the rail
      const c = { a: [ax, ay], b: [bx, by], o: [ox, oy] };
      c.ja = [ax + (ox !== 0 ? ox * CW : -Math.sign(bx - ax) * CW), ay + (oy !== 0 ? oy * CW : -Math.sign(by - ay) * CW)];
      c.jb = [bx + (ox !== 0 ? ox * CW : Math.sign(bx - ax) * CW), by + (oy !== 0 ? oy * CW : Math.sign(by - ay) * CW)];
      CUSHIONS.push(c); seg(c.a, c.b);
    }
    if (POCKETED) {
      add(-HL + GC, HW, -GS, HW, 0, 1, true, false);
      add(GS, HW, HL - GC, HW, 0, 1, false, true);
      add(-HL + GC, -HW, -GS, -HW, 0, -1, true, false);
      add(GS, -HW, HL - GC, -HW, 0, -1, false, true);
      add(-HL, -HW + GC, -HL, HW - GC, -1, 0, true, true);
      add(HL, -HW + GC, HL, HW - GC, 1, 0, true, true);
    } else {
      plain(-HL, HW, HL, HW, 0, 1); plain(-HL, -HW, HL, -HW, 0, -1);
      plain(-HL, -HW, -HL, HW, -1, 0); plain(HL, -HW, HL, HW, 1, 0);
    }
  })();

  function newEv() { return { firstHit: null, hits: [], rail: false, railed: [], pocketed: [], cushions: 0 }; }   // cushions: how many the cue ball met before it had hit two balls

  function makeWorld(n) {
    const balls = [];
    for (let i = 0; i < n; i++) balls.push({ id: i, x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, wx: 0, wy: 0, wz: 0, hot: 0, spit: 0, on: true, q: [0, 0, 0, 1] });
    return { balls, ev: newEv(), snd: null, track: false, cue: 0 };
  }

  function clone(w) {
    return { balls: w.balls.map(b => ({ id: b.id, x: b.x, y: b.y, px: b.x, py: b.y, vx: 0, vy: 0, wx: 0, wy: 0, wz: 0, hot: b.hot || 0, spit: b.spit || 0, on: b.on, q: b.q })), ev: newEv(), snd: null, track: false, cue: w.cue };
  }

  function place(w, id, x, y, rnd) {
    const b = w.balls[id];
    b.x = b.px = x; b.y = b.py = y; b.vx = b.vy = b.wx = b.wy = b.wz = 0; b.hot = 0; b.spit = 0; b.on = true;
    if (rnd) {
      const a = rnd() * Math.PI * 2, tl = (rnd() - 0.5) * 0.9;
      const cz = Math.cos(a / 2), sz = Math.sin(a / 2), cx = Math.cos(tl / 2), sx = Math.sin(tl / 2);
      b.q = [cz * sx, sz * sx, sz * cx, cz * cx];
    }
  }

  function strike(w, ang, V, a, bb) {
    const c = w.balls[w.cue], dx = Math.cos(ang), dy = Math.sin(ang);
    c.vx = V * dx; c.vy = V * dy;
    const k = 2.5 * V * bb / R;
    c.wx = -dy * k; c.wy = dx * k; c.wz = 2.5 * V * a / R;
    w.ev = newEv();
  }

  function motion(w, b, h) {
    const ux = b.vx - R * b.wy, uy = b.vy + R * b.wx, us = Math.hypot(ux, uy);
    if (us > 1e-4) {
      const dec = MU_S * G * h;
      if (us <= 3.5 * dec) {
        b.vx -= (2 / 7) * ux; b.vy -= (2 / 7) * uy;
        b.wy = b.vx / R; b.wx = -b.vy / R;
      } else {
        const nx = ux / us, ny = uy / us;
        b.vx -= dec * nx; b.vy -= dec * ny;
        b.wx -= (2.5 / R) * dec * ny; b.wy += (2.5 / R) * dec * nx;
      }
    } else {
      const sp = Math.hypot(b.vx, b.vy), dec = MU_R * G * h;
      if (sp <= dec || sp < 0.004) { b.vx = b.vy = 0; b.wx = b.wy = 0; }
      else { const s = (sp - dec) / sp; b.vx *= s; b.vy *= s; b.wy = b.vx / R; b.wx = -b.vy / R; }
    }
    const dz = (2.5 * MU_SP * G / R) * h;
    if (Math.abs(b.wz) <= dz) b.wz = 0; else b.wz -= Math.sign(b.wz) * dz;
    b.x += b.vx * h; b.y += b.vy * h;
    const spd = Math.hypot(b.vx, b.vy), cool = b.hot - 7 * h; b.hot = spd > cool ? spd : cool;
    if (b.spit > 0) b.spit -= h;
    if (w.track) {
      const wm = Math.hypot(b.wx, b.wy, b.wz);
      if (wm > 1e-6) {
        const ang = wm * h, s = Math.sin(ang / 2) / wm, c = Math.cos(ang / 2);
        const dx = b.wx * s, dy = b.wy * s, dzq = b.wz * s, q = b.q, qx = q[0], qy = q[1], qz = q[2], qw = q[3];
        q[0] = c * qx + dx * qw + dy * qz - dzq * qy;
        q[1] = c * qy + dy * qw + dzq * qx - dx * qz;
        q[2] = c * qz + dzq * qw + dx * qy - dy * qx;
        q[3] = c * qw - dx * qx - dy * qy - dzq * qz;
      }
    }
  }

  function hitSeg(w, b, s) {
    let u = (b.x - s.ax) * s.tx + (b.y - s.ay) * s.ty;
    u = u < 0 ? 0 : u > s.len ? s.len : u;
    const cx = s.ax + s.tx * u, cy = s.ay + s.ty * u;
    let nx = b.x - cx, ny = b.y - cy;
    const d2 = nx * nx + ny * ny;
    if (d2 >= R * R || d2 < 1e-14) return;
    const d = Math.sqrt(d2); nx /= d; ny /= d;
    b.x = cx + nx * R; b.y = cy + ny * R;
    const vn = b.vx * nx + b.vy * ny;
    if (vn >= 0) return;
    const e = Math.max(0.62, 0.87 - 0.035 * -vn);
    const tx = -ny, ty = nx;
    // side spin grips the cushion and bends the rebound
    const slip = b.vx * tx + b.vy * ty - R * b.wz;
    const lim = MU_CUSH * (1 + e) * -vn;
    let dvt = -(2 / 7) * slip;
    if (dvt > lim) dvt = lim; else if (dvt < -lim) dvt = -lim;
    b.vx += -(1 + e) * vn * nx + dvt * tx;
    b.vy += -(1 + e) * vn * ny + dvt * ty;
    b.wz -= (2.5 / R) * dvt;
    // the nose sits above centre: roll into the rail is mostly killed and slightly reversed,
    // roll along the rail survives
    const wn = b.wx * nx + b.wy * ny, wt = b.wx * tx + b.wy * ty;
    const wn2 = wn * 0.9, wt2 = wt * -0.15;
    b.wx = wn2 * nx + wt2 * tx; b.wy = wn2 * ny + wt2 * ty;

  // Practice: one player, no rules, no turns. The app decides what is on the table and what counts as success.

    setup(g, rnd) {

    ctx(g) { return { turn: g.turn }; },

  const mkP = (name, ai) => ({ name, ai: !!ai, group: null, score: 0, shots: 0, made: 0, run: 0, best: 0, fouls: 0 });

    MODES, GROUP_KO, modeId: 'eight', mode: MODES.eight, P: PH.pool, world: null, turn: 0,
    players: [mkP('플레이어 1'), mkP('플레이어 2')], isBreak: true, placing: null, over: null, target: 10, level: 1, _ctx: null,

  g.start = function (modeId, names, ai, opts) {

  /* ---------- computer player ---------- */

  /* The top level does not miss. Every shot it thinks of is played out in full first, on a copy of the table, and only one

      else if (!next.length && g.modeId === 'eight') next = [8];

            const ix = p.ax - B[0], iy = p.ay - B[1], il = Math.hypot(ix, iy); if ((ix * p.nx + iy * p.ny) / il < 0.45) continue;
            const gx = T.x - dx * 2 * R, gy = T.y - dy * 2 * R; if (!inside(gx, gy)) continue;

            tricks.push({ angle: Math.atan2(cy, cx), len: cl + dl, flair: 3, Vs: [3.2, 4.4], step: 0.005 });

            if (dx * p.nx + dy * p.ny < (p.corner ? 0.3 : 0.55) || !P.pathClear(w, O.x, O.y, p.ax, p.ay, [0, o])) continue;
            const hx = O.x - dx * 2 * R, hy = O.y - dy * 2 * R; let ex = hx - T.x, ey = hy - T.y; const el = Math.hypot(ex, ey); if (el < 1e-4) continue; ex /= el; ey /= el;

            const gx = T.x - ex * 2 * R, gy = T.y - ey * 2 * R; if (!inside(gx, gy)) continue;
            let cx = gx - c.x, cy = gy - c.y; const cl = Math.hypot(cx, cy); if (cl < 1e-4) continue; cx /= cl; cy /= cl;
            if (cx * ex + cy * ey < 0.7 || !P.pathClear(w, c.x, c.y, gx, gy, [0, t])) continue;
            tricks.push({ angle: Math.atan2(cy, cx), len: cl + el + dOP, flair: 2.5, Vs: [3.4, 4.8], step: 0.002 });
          } }
      }
      tricks.sort((a, b) => a.len - b.len);
      let shown = 0;
      for (const k of tricks) {
        if (sims > 620 || shown >= 3) break;
        let ok = false;
        for (let i = 0; i <= 14 && !ok; i++) { const da = (i % 2 ? 1 : -1) * Math.ceil(i / 2) * k.step; for (const V of k.Vs) if (tryShot(k.angle + da, V, null, k.flair)) { ok = true; break; } }
        if (ok) shown++;
      }
    }
    if (!found.length) {
      // nothing obvious: sweep finely across every ball it may hit (from a few places, with the ball in hand), then round the whole clock
      const spots = g.placing ? [[-HL / 2, 0], [0, 0], [HL / 2, 0], [0, HW / 2], [0, -HW / 2]].map(q => P.isFree(w, q[0], q[1], 0) ? q : P.findFree(w, q[0], q[1], 0)) : [null];
      const order = targets.map(t => w.balls[t]);

        const fx = pos ? pos[0] : c.x, fy = pos ? pos[1] : c.y;
        order.sort((p, q) => Math.hypot(p.x - fx, p.y - fy) - Math.hypot(q.x - fx, q.y - fy));
        for (const T of order) {
          const dd = Math.hypot(T.x - fx, T.y - fy), base = Math.atan2(T.y - fy, T.x - fx), half = Math.asin(Math.min(1, 2 * R / Math.max(dd, 2 * R))) * 0.98;
          for (let i = 0; i <= 44; i++) { const f = (i % 2 ? 1 : -1) * Math.ceil(i / 2) / 22; for (const V of [2.6, 4.2]) if (tryShot(base + f * half, V, pos, 1)) break sweep; }
        }

        }

  function aiPool() {
    const P = g.P, { R, HL, HW, POCKETS } = P, w = g.world, c = w.balls[w.cue], lvl = g.level, me = g.turn;
    const ctx = g.mode.ctx(g), noise = [0.014, 0.0055, 0.0016, 0][lvl];
    if (g.isBreak) {
      const y = (Math.random() - 0.5) * 0.3, pos = [-HL / 2 - 0.1, y];
      return { pos, angle: Math.atan2(-y * 0.92, HL / 2 - pos[0]) + gauss() * 0.003, V: g.vOf(0.94 + Math.random() * 0.06) };
    }
    const verdict = (a, V, pos) => g.mode.evaluate(simShot(a, V, pos), ctx, g);
    const good = r => !r.foul && (r.win == null ? r.keep : r.win === me);
    const safe = r => !r.foul && (r.win == null || r.win === me);
    const targets = g.mode.legal(g, me), cands = [];
    for (const t of targets) for (const p of POCKETS) {
      const T = w.balls[t]; let dx = p.ax - T.x, dy = p.ay - T.y; const dTP = Math.hypot(dx, dy); dx /= dTP; dy /= dTP;
      if (dx * p.nx + dy * p.ny < (p.corner ? 0.3 : 0.55)) continue;
      if (!P.pathClear(w, T.x, T.y, p.ax, p.ay, [0, t])) continue;

  function aiCarom() {

        const r = g.mode.evaluate(g.P.run(w2, 20), ctx, g), railed = w2.ev.railed.includes(w2.cue);
        if (r.pts > 0) { flair.push({ angle: all[i][0], V: all[i][1], s: (railed ? 3 : 0) + Math.random() }); if (railed) fancy++; }

    g.world.cue = d.cue || 0; g.turn = d.turn; g.players = d.players; g.isBreak = d.isBreak; g.placing = d.placing;

   No DOM in here. */
function createDrills() {
  const LEVELS = 5;
  const lerp = (a, b, t) => a + (b - a) * t;
  const rad = d => d * Math.PI / 180;
  const pick = (rnd, list) => list[Math.floor(rnd() * list.length) % list.length];
  const between = (rnd, a, b) => a + (b - a) * rnd();
  const rot = (x, y, a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];

  const isSide = (P, k) => Math.abs(k.x) < P.HL * 0.5;
  const corners = P => P.POCKETS.filter(k => !isSide(P, k));

  // the direction a ball should travel to drop cleanly: down the diagonal for a corner, straight in for a side pocket

  /* ---- a throw-away table to try shots on ---- */
  function table(P, cue, balls) {

    for (let i = 1; i < 16; i++) { w.balls[i].on = false; w.balls[i].x = 9 + i; w.balls[i].y = 9; }

    { id: 'free', name: '자유 연습', d: '규칙 없이 마음대로. 공을 옮기고 한 수 되돌릴 수 있습니다.' },

    { id: 'straight', name: '똑바로 넣기', d: '일직선으로 놓인 공을 넣습니다.', tip: '공 한가운데를 겨눕니다. 세게 칠 필요가 없습니다.',
      make(P, t, rnd, vOf) {

    { id: 'follow', name: '밀어치기', d: '공을 넣고 큐볼을 앞으로 보냅니다.', tip: '큐볼 위쪽을 칩니다. 세기로 얼마나 따라갈지를 정합니다.',
      make(P, t, rnd, vOf) {

        const need = { pot: 1 }, s = settle(P, table(P, L.cue, L.balls), L, need, [[between(rnd, 0.26, 0.42), 0, between(rnd, 0.3, 0.5)]], vOf); if (!s) return null;

      make(P, t, rnd, vOf) {
        const L = potLayout(P, rnd, { dist: lerp(0.35, 0.6, t), run: lerp(0.35, 0.6, t), cut: between(rnd, 15, 40), spread: 18 }); if (!L) return null;
        const need = { pot: 1, only: 1 }, w = table(P, L.cue, L.balls);
        const s = settle(P, w, L, need, [[between(rnd, 0.3, 0.62), 0, pick(rnd, [-0.35, -0.15, 0, 0.2, 0.4])]], vOf); if (!s) return null;

        for (let k = 0; k < 12; k++) {

  const byId = id => list.find(d => d.id === id) || list[0];

    if (L) { flow = null; putLayout(L); scene.setZone(L.zone); playDemo(L.demo, { quiet: true, after: homePreview }); return; }
  }
  flow = null;
  game.start(prefs.mode === 'practice' ? 'eight' : prefs.mode, [prefs.names[0], oppName()], false, {});
  scene.setTable(game.P); st.rev++; scene.invalidate();
}
function goHome() {
  store.set('save', null);
  show('home'); buildModes(); paintHome(); homePreview();
}

/* ================= shot pipeline (the same for every flow) ================= */
function beginTurn(first) {
  st.phase = 'aim'; st.power = 0; st.spin = { x: 0, y: 0 }; setPowerUI(0); setSpinUI(); $('#spinPop').hidden = true;
  const auto = flow.auto();
  if (auto) { st.phase = 'auto'; st.auto = { t: 0, plan: null, from: st.aim, src: auto }; }
  else if (!first || game.mode.table === 'carom') {
    const c = game.cueBall(); let best = null, bd = 1e9;
    for (const id of game.legal()) { const b = game.world.balls[id], d = Math.hypot(b.x - c.x, b.y - c.y); if (d < bd) { bd = d; best = b; } }
    if (best) st.aim = Math.atan2(best.y - c.y, best.x - c.x);
  }
  flow.hud(); scene.invalidate(); snapshot();
}
function shoot(V, a, b) {
  flow.beforeShot(V, a, b); game.beginShot();
  st.phase = 'strike'; $('#spinPop').hidden = true;
  st.cueAnim = { t: 0, from: 0.03 + st.power * 0.2, V, a, b };
  flow.hud();
}
function endShot() { st.rev++; flow.afterShot(); }
function hold(seconds, then) { st.phase = 'hold'; st.holdT = seconds; st.afterHold = then; flow.hud(); }

// The computer and the demo line up a shot the same way: wait, decide, swing the cue round, pull back, shoot.
// plan: { angle, V, a, b, pos? }
function autoTick(dt) {
  const a = st.auto; a.t += dt;
  if (!a.plan) {
    if (a.t < a.src.think) return;
    a.plan = a.src.plan(); a.t0 = a.t; a.pw = Math.min(1, game.powerOf(a.plan.V));
    if (a.plan.pos) { const c = game.cueBall(); c.x = c.px = a.plan.pos[0]; c.y = c.py = a.plan.pos[1]; game.placing = null; }
    let d = a.plan.angle - a.from; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; a.delta = d;
    if (a.src.showSpin) { st.spin = { x: a.plan.a / 0.5, y: a.plan.b / 0.5 }; setSpinUI(); }
    return;
  }
  const t = a.t - a.t0, e = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
  st.aim = a.from + a.delta * e(t / 0.75);
  st.power = a.pw * e((t - 0.85) / 0.45); setPowerUI(st.power);
  if (t > 1.45) { st.aim = a.plan.angle; st.auto = null; shoot(a.plan.V, a.plan.a, a.plan.b); }
}

/* ================= scoreboard ================= */
function paintPill(i, s) {

  box.classList.toggle('on', !!s.on);
  box.querySelector('.nm').textContent = s.name; box.querySelector('.sub').textContent = s.sub;
  box.querySelector('.pts').textContent = s.pts == null ? '' : s.pts;
  tray.textContent = '';
  for (const t of s.tray || []) tray.appendChild(t === 'slot' ? el('i', { class: 'mb slot' }) : t === 'eight' ? el('i', { class: 'mb e8' }) : ballChip(t));
}
function paintBadge(name, b) {
  const badge = $('#badge'); badge.textContent = '';
  badge.appendChild(el('b', { text: name })); badge.appendChild(document.createTextNode(b.text));
  for (const id of b.balls || []) badge.appendChild(ballChip(id, id === b.mark ? 'box-shadow:0 0 0 2px #ffd21f' : 'opacity:.55'));

const setBusy = () => app.classList.toggle('busy', !(st.screen === 'play' && st.phase === 'aim'));

/* ================= flow: a match between two players (or one and the computer) ================= */
const match = {
  quiet: false, save: true,
  ctx: null,                                              // who is playing what; fix: the league game this is, if any
  pending: null, best: null, worst: null,                              // the shot in progress, and the best one of the match so far
  start(first, ctx) {
    PH.pool = poolOf(prefs.table); scene.clearFalls();
    const c = match.ctx = ctx || { names: [prefs.names[0], oppName()], mode: prefs.mode, ai: prefs.vsAI, target: prefs.target, fix: null };
    const key = c.names.join('\u0001') + c.mode;
    if (series.key !== key) { series.key = key; series.s = [0, 0]; }
    game.start(c.mode, c.names, c.ai, { level: prefs.level, target: c.target, first: first || 0, cushions: prefs.rule3 }); match.best = null; match.worst = null;
    st.aim = 0; match.enter(); toast(game.mode.intro(game), '', 3600);
  },
  enter() { flow = match; $('#pracBar').hidden = true; $('#p1').hidden = false; scene.setTable(game.P); st.rev++; show('play'); beginTurn(true); },
  restart() { match.start(game.turn, match.ctx); },
  guide: () => prefs.guides[game.turn],
  auto: () => game.players[game.turn].ai ? { think: 0.5, plan() { const p = game.aiPlan(); return { angle: p.angle, V: p.V, a: 0, b: 0, pos: p.pos }; } } : null,
  beforeShot(V, a, b) { match.pending = { snap: highlights.snapshot(game.world), aim: st.aim, V, a, b, turn: game.turn, isBreak: game.isBreak, who: game.players[game.turn].name }; },
  afterShot() {
    const shot = match.pending, ev = game.world.ev, out = game.resolve();
    if (shot) {
      const r = highlights.rate(game.P, game.mode, shot, ev, out.r), bad = highlights.rateWorst(game.P, game.mode, shot, ev, out.r);
      if (r.score > (match.best ? match.best.score : 0)) match.best = Object.assign({}, shot, r);
      if (bad.score > (match.worst ? match.worst.score : 0)) match.worst = Object.assign({}, shot, bad);
    }
    if (game.over) return match.finish();
    toast(out.msg, out.kind, out.dur); beginTurn(false);
  },
  hud() {
    const m = game.mode;
    for (let i = 0; i < 2; i++) paintPill(i, Object.assign({ name: game.players[i].name, on: game.turn === i }, m.status(game, i)));
    paintBadge(m.name, m.badge(game)); setBusy();
  },
  finish() {
    const w = game.over.winner, l = 1 - w, pw = game.players[w], pl = game.players[l];
    const rw = recOf(pw.name), rl = recOf(pl.name);
    rw.w++; rw.streak++; rw.best = Math.max(rw.best, rw.streak); rl.l++; rl.streak = 0;
    rw.form = rw.form.concat('W').slice(-5); rl.form = rl.form.concat('L').slice(-5); store.set('rec', rec);
    const fix = match.ctx ? match.ctx.fix : null, target = !!game.mode.target;
    if (fix != null && lg && lg.fx[fix]) { league.record(lg, fix, w, target ? game.players[0].score : w === 0 ? 1 : 0, target ? game.players[1].score : w === 1 ? 1 : 0); saveLeague(); }
    $('#againBtn').textContent = fix != null ? '리그로' : '한 판 더';
    series.s[w]++; st.lastLoser = l; store.set('save', null); st.phase = 'idle';
    const win = $('#rWin'); win.className = 'r-win' + (w === 1 ? ' two' : '');
    win.querySelector('.av').textContent = w + 1; win.querySelector('.nm').textContent = pw.name;
    win.querySelector('.rc').textContent = `${rw.w}승 ${rw.l}패` + (rw.streak >= 2 ? ` · ${rw.streak}연승 중` : '');
    $('#rLose .av').textContent = l + 1; $('#rLose .nm').textContent = pl.name;
    const sc = $('#rScore'); sc.textContent = ''; sc.append(el('b', { text: series.s[w] }), ' : ' + series.s[l]);
    const pct = p => p.shots ? Math.round(p.made / p.shots * 100) + '%' : '0%';
    const rows = [['샷 성공률', pct(pw), pct(pl)], ['연속 성공', pw.best, pl.best], ['친 횟수', pw.shots, pl.shots], ['파울', pw.fouls, pl.fouls]];
    if (game.mode.target) rows[2] = ['점수', pw.score, pl.score];
    // winner on the left, loser on the right, a bar each way showing the share
    const box = $('#rStats'); box.textContent = '';
    for (const [k, a, b] of rows) {
      const na = parseFloat(a) || 0, nb = parseFloat(b) || 0, sum = na + nb || 1;
      box.appendChild(el('div', { class: 'srow' }, [el('b', { text: a }), el('span', { class: 'bar l' }, el('i', { style: `--w:${Math.round(na / sum * 100)}%` })), el('span', { class: 'k', text: k }),
        el('span', { class: 'bar r' }, el('i', { style: `--w:${Math.round(nb / sum * 100)}%` })), el('span', { class: 'n', text: b })]));
    }
    const best = match.best; $('#bestBtn').hidden = !best;
    if (best) { $('#bestWho').textContent = best.who; $('#bestTag').textContent = best.tag; }
    const worst = match.worst; $('#worstBtn').hidden = !worst;
    if (worst) { $('#worstWho').textContent = worst.who; $('#worstTag').textContent = worst.tag; }
    $('#rWhy').textContent = game.over.why;
    show('result'); SND.win();
  },
};

/* ================= flow: practice (free table, or a drill that checks each shot) ================= */
// put a drill layout on the table
function putLayout(L) {
  const P = game.P, w = game.world;
  game.MODES.practice.setup(game, Math.random); scene.clearFalls();
  if (L.rack) { game.MODES.eight.setup(game, Math.random); game.placing = null; st.aim = 0; }
  else {
    P.place(w, 0, L.cue[0], L.cue[1], Math.random);
    for (const [id, x, y] of L.balls) P.place(w, id, x, y, Math.random);
    st.aim = L.aim;
  }
  st.rev++; scene.invalidate();
}
const practice = {
  quiet: false, save: false,
  drill: null, level: 1, streak: 0, tries: 0, ok: 0, layout: null, before: null, beforeAim: 0, edit: false,
  start(id) {
    PH.pool = poolOf(prefs.table);
    if (id) { prefs.drill = id; savePrefs(); }
    const p = practice; p.drill = drills.byId(prefs.drill); p.level = levelOf(p.drill.id); p.streak = 0; p.tries = 0; p.ok = 0; p.edit = false; p.before = null;
    game.start('practice', [prefs.names[0], ''], false, {});
    flow = practice; scene.setTable(game.P); show('play'); p.bar();
    if (p.drill.make) p.fresh();
    else { game.MODES.eight.setup(game, Math.random); game.placing = null; game.isBreak = false; scene.clearFalls(); st.aim = 0; st.rev++; beginTurn(true); }
    toast(p.drill.tip || '규칙 없이 자유롭게 칩니다. "옮기기"를 켜면 공을 끌어 옮길 수 있습니다.', '', 5200);
  },
  restart() { practice.start(); },
  fresh() { const p = practice; p.layout = drills.make(p.drill.id, game.P, p.level, Math.random, game.vOf) || p.layout; p.again(); },   // a new layout
  again() { const p = practice; flow = practice; putLayout(p.layout); scene.setZone(p.layout.zone); beginTurn(true); },       // the same layout once more
  guide: () => prefs.guides[0],
  auto: () => null,
  beforeShot() { practice.before = game.world.balls.map(b => [b.x, b.y, b.on]); practice.beforeAim = st.aim; },
  afterShot() {
    const p = practice;
    if (!p.drill.make) { game.resolve(); return beginTurn(false); }
    const why = drills.judge(p.layout, game.world.ev, game.world.balls[0]);
    game.resolve(); p.tries++;
    if (why) { p.streak = 0; toast('실패 · ' + why, 'foul', 1900); SND.bad(); return hold(1.7, p.again); }           // same layout until it goes in
    p.ok++; p.streak++;
    let msg = '성공!';
    if (p.streak >= 3 && p.level < drills.LEVELS) { p.level++; p.streak = 0; prefs.drillLv[p.drill.id] = p.level; savePrefs(); p.bar(); msg = `성공! 이제 ${p.level}단계`; }
    else if (p.level < drills.LEVELS) msg = `성공! 다음 단계까지 ${3 - p.streak}번`;
    toast(msg, 'good', 1700); SND.good(); hold(1.4, p.fresh);
  },
  hud() {
    const p = practice;
    paintPill(0, { name: p.drill.name, on: true, sub: p.drill.make ? `${p.level}단계 · 성공 ${p.ok}/${p.tries}` : '규칙 없음', tray: [], pts: null });
    paintBadge('연습', { text: p.drill.make ? p.drill.d : '자유롭게' }); setBusy();
  },
  // the row of buttons where the second player's panel would be
  bar() {
    const p = practice, box = $('#pracBar'); box.textContent = ''; box.hidden = false; $('#p1').hidden = true;
    const btn = (text, fn, on) => box.appendChild(el('button', { class: 'btn', text, 'aria-pressed': String(!!on), onclick: () => { SND.tap(); fn(); } }));
    const aiming = fn => () => { if (flow === practice && st.phase === 'aim') fn(); };
    if (!p.drill.make) {
      btn('되돌리기', p.undo);
      btn('옮기기', () => { p.edit = !p.edit; p.bar(); if (p.edit) toast('공을 끌어 옮깁니다. 테이블 밖으로 끌면 빠집니다.', '', 2600); }, p.edit);
      btn('공 놓기', p.sheetRack);
    } else {
      btn('시범', aiming(() => { toast('시범: 이렇게 치면 됩니다.', '', 2200); playDemo(p.layout.demo, { quiet: false, after: p.again }); }));
      btn('힌트', () => toast(p.drill.tip + ' (' + drills.hint(p.layout.demo) + ')', '', 5200));
      btn('새 배치', aiming(p.fresh));

    }
  },
  undo() {
    const p = practice;
    if (st.phase !== 'aim' || !p.before) return toast('되돌릴 샷이 없습니다.', '', 1400);
    p.before.forEach((s, i) => { const b = game.world.balls[i]; b.x = b.px = s[0]; b.y = b.py = s[1]; b.on = s[2]; b.vx = b.vy = b.wx = b.wy = b.wz = 0; });
    st.aim = p.beforeAim; st.rev++; flow.hud(); scene.invalidate();
  },
  sheetLevel() {
    const p = practice, i = drills.list.indexOf(p.drill), next = drills.list[i + 1 < drills.list.length ? i + 1 : 1];
    const levels = []; for (let k = 1; k <= drills.LEVELS; k++) levels.push([k, k + '단계']);
    openSheet(p.drill.name, [
      segRow('단계', levels, p.level, v => { p.level = v; p.streak = 0; prefs.drillLv[p.drill.id] = v; savePrefs(); closeSheet(); p.bar(); if (flow === practice && st.phase === 'aim') p.fresh(); }),
      note('세 번 잇따라 성공하면 다음 단계로 올라갑니다. 단계가 오르면 거리가 멀어지고 각도가 커지고 원이 작아집니다. 배치는 성공할 때마다 바뀝니다.'),
      flatBtn(`다음 훈련: ${next.name}`, () => practice.start(next.id)),
    ]);
  },
  sheetRack() {
    const P = game.P, w = game.world, done = () => { closeSheet(); st.rev++; flow.hud(); scene.invalidate(); };
    const clear = () => { for (let i = 1; i < 16; i++) { w.balls[i].on = false; w.balls[i].x = w.balls[i].px = 9 + i; } };
    openSheet('공 놓기', [
      flatBtn('8볼 모양으로 15개', () => { game.MODES.eight.setup(game, Math.random); game.placing = null; game.isBreak = false; done(); }),
      flatBtn('9볼 모양으로 9개', () => { clear(); game.MODES.nine.setup({ P, world: w }, Math.random); done(); }),
      flatBtn('공 하나 더 놓기', () => {
        const b = w.balls.find(x => x.id > 0 && !x.on); if (!b) return toast('공 15개가 모두 올라와 있습니다.', '', 1600);
        const [x, y] = P.findFree(w, P.HL * 0.3, 0, b.id); P.place(w, b.id, x, y, Math.random); done();
      }),
      flatBtn('큐볼만 남기고 치우기', () => { clear(); done(); }),
      note('놓은 뒤 "옮기기"를 켜고 원하는 자리로 끌어 옮기세요.'),
    ]);
  },
};

/* ================= flow: demo (plays one given shot, then hands back) ================= */
// shot: { angle, power, a, b }.  opts.after: what to do once the balls have stopped and been looked at.
function playDemo(shot, opts) {
  const back = flow;
  flow = {
    quiet: !!opts.quiet, save: false,
    restart() { (back || practice).restart(); },
    guide: () => 3,
    auto: () => ({ think: 0.7, showSpin: true, plan: () => ({ angle: shot.angle, V: game.vOf(shot.power), a: shot.a, b: shot.b }) }),
    beforeShot() {},
    afterShot() { hold(1.3, opts.after); },
    hud() { if (back) back.hud(); setBusy(); },
  };
  beginTurn(true);
}

/* ================= league and records (laid out like a football league table) ================= */
