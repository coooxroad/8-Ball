# CUE on the web: the same page the Android app carries (app/src/main/assets, made by web/build.sh), served by Cloudflare
# as a Worker with nothing but static files (free, no limit on requests for static files). Deployed by
# .github/workflows/site.yml after each successful APK release, from that release's commit. The page talks to the server
# (server/) for the wallet. /version.json identifies the deployed source commit and APK build.
name = "cue"
compatibility_date = "2026-10-01"
# danguuu.com (bought on Cloudflare, 11-10): the page at the domain and at www; the workers.dev address kept for old links
workers_dev = true
routes = [
  { pattern = "danguuu.com", custom_domain = true },
  { pattern = "www.danguuu.com", custom_domain = true },
]

[assets]
directory = "../app/src/main/assets"
