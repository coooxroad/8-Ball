<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CUE 관리자</title>
<!-- The admin console (owner, 11-09): find an account, give or take coins, diamonds and items, set the rating.
     Signed in with Google; the server lets only the addresses in ADMIN_EMAILS_SHA256 through (server/src/index.js
     adminRoute) and writes each change in that account's ledger and admin log (core.js adminGrant). -->
<style>
  :root { color-scheme: dark; --bg: #0d1116; --card: #161c24; --line: #263040; --ink: #e8edf3; --dim: #8a97a8; --acc: #2fbf8f; --bad: #e35d5d; --gold: #f2c14e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  header .who { margin-left: auto; color: var(--dim); font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; display: grid; grid-template-columns: 320px 1fr; gap: 18px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card h2 { font-size: 14px; color: var(--dim); font-weight: 600; margin: 0 0 10px; }
  input, select, button { font: inherit; color: var(--ink); background: #0f141a; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  input:focus, select:focus { outline: 2px solid var(--acc); outline-offset: -1px; }
  button { cursor: pointer; background: #1f2935; }
  button.go { background: var(--acc); border-color: var(--acc); color: #062417; font-weight: 700; }
  button.warn { background: transparent; border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > input, .row > select { flex: 1; min-width: 0; }
  #people { list-style: none; margin: 10px 0 0; padding: 0; max-height: 70vh; overflow: auto; }
  #people li { padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  #people li:hover, #people li.on { background: #1f2935; }
  #people .id { color: var(--dim); font: 12px ui-monospace, monospace; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat { background: #0f141a; border-radius: 10px; padding: 10px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { color: var(--dim); font-size: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  @media (max-width: 620px) { .grid2, .stats { grid-template-columns: 1fr 1fr; } .grid2 { grid-template-columns: 1fr; } }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 600; }
  .plus { color: var(--acc); } .minus { color: var(--bad); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; padding: 3px 8px; border-radius: 99px; background: #0f141a; border: 1px solid var(--line); }
  .r1 { border-color: #4a9be8; } .r2 { border-color: #a46ee8; } .r3 { border-color: var(--gold); } .r4 { border-color: #e8653a; } .r5 { border-color: #e84a9b; }
  .muted { color: var(--dim); }
  .scroll { max-height: 320px; overflow: auto; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #263040; padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; } #toast.bad { background: #5a2323; } #toast.good { background: #1d5a43; }
  #gate { max-width: 420px; margin: 12vh auto; text-align: center; }
  #gate p { color: var(--dim); }
  #gbtn { display: inline-block; min-height: 44px; margin-top: 12px; }
  label.small { font-size: 12px; color: var(--dim); display: block; margin: 8px 0 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><h1>CUE 관리자</h1><span class="who" id="who"></span><button id="out" hidden>로그아웃</button></header>

<section id="gate" class="card">
  <h2 style="font-size:18px;color:var(--ink)">관리자 로그인</h2>
  <p>관리자 비밀번호, 또는 허용된 구글 계정</p>
  <form id="passForm" class="row" style="justify-content:center;margin-top:6px">
    <input id="pass" type="password" placeholder="관리자 비밀번호" autocomplete="current-password" style="flex:1;max-width:240px">
    <button class="go">들어가기</button>
  </form>
  <p class="muted" style="font-size:13px;margin:14px 0 4px">또는</p>
  <div id="gbtn"></div>
  <p id="gateMsg"></p>
</section>

<main id="app" hidden>
  <div>
    <div class="card">
      <h2>계정 찾기</h2>
      <form class="row" id="findForm"><input id="q" placeholder="닉네임 또는 계정 ID" autocomplete="off"><button class="go">검색</button></form>
      <p class="muted" style="font-size:12px;margin:8px 0 0">비워 두고 검색하면 최근 접속 순 30명. 접속하거나 이름을 바꾼 계정부터 목록에 올라옵니다.</p>
      <ul id="people"></ul>
    </div>
  </div>

  <div id="detail" hidden>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><b id="dNick" style="font-size:18px"></b> <span id="dJoined" class="tag"></span><div class="id muted" id="dAcct" style="font:12px ui-monospace,monospace"></div></div>
        <button id="reload">새로고침</button>
      </div>
      <div class="stats" style="margin-top:12px">
        <div class="stat"><b id="sCoin">-</b><span>코인</span></div>
        <div class="stat"><b id="sDia">-</b><span>다이아</span></div>
        <div class="stat"><b id="sDama">-</b><span>레이팅</span></div>
        <div class="stat"><b id="sSince">-</b><span>생성일</span></div>
      </div>
    </div>

    <div class="grid2">
      <form class="card" id="payForm">
        <h2>재화 지급 · 회수</h2>
        <label class="small">코인 (빼려면 −)</label><input id="fCoin" type="number" step="1" placeholder="0">
        <label class="small">다이아 (빼려면 −)</label><input id="fDia" type="number" step="1" placeholder="0">
        <label class="small">사유</label><input id="fWhy1" maxlength="80" placeholder="예: 서버 점검 보상">
        <div class="row" style="margin-top:10px"><button class="go">적용</button></div>
      </form>

      <form class="card" id="itemForm">
        <h2>아이템 지급 · 회수</h2>
        <label class="small">종류</label>
        <select id="fKind"><option value="cue">큐</option><option value="ball">공 스킨</option><option value="table">테이블</option><option value="trail">궤적</option><option value="glove">장갑</option></select>
        <label class="small">아이템</label><select id="fItem"></select>
        <label class="small">사유</label><input id="fWhy2" maxlength="80" placeholder="예: 이벤트 당첨">
        <div class="row" style="margin-top:10px"><button class="go" data-act="give">지급</button><button class="warn" data-act="take">회수</button></div>
      </form>

      <form class="card" id="damaForm">
        <h2>레이팅 조정</h2>
        <label class="small">새 레이팅</label><input id="fDama" type="number" step="1">
        <label class="small">사유</label><input id="fWhy3" maxlength="80" placeholder="예: 어뷰징 정정">
        <div class="row" style="margin-top:10px"><button class="go">설정</button></div>
      </form>

      <div class="card">
        <h2>보유 아이템 (구매·지급)</h2>
        <div class="tags" id="owned"></div>
      </div>
    </div>

    <div class="grid2">
      <div class="card"><h2>관리 기록</h2><div class="scroll"><table id="adminLog"></table></div></div>
      <div class="card"><h2>거래 내역 (최근 30)</h2><div class="scroll"><table id="ledger"></table></div></div>
    </div>
    <div class="card" style="margin-top:14px"><h2>최근 경기 (20)</h2><div class="scroll"><table id="games"></table></div></div>
  </div>
</main>
<div id="toast"></div>

<script>
const SERVER = 'https://cue-server.oxcorp.workers.dev';
const KIND_KO = { cue: '큐', ball: '공', table: '테이블', trail: '궤적', glove: '장갑' };
const RARITY_KO = ['일반', '고급', '희귀', '영웅', '전설', '시크릿'];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const num = n => (n | 0).toLocaleString('ko-KR');
const when = t => t ? new Date(t).toLocaleString('ko-KR', { year: '2-digit', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
let token = null, pass = null, who = '', catalog = null, cur = null, toastT;

function toast(msg, kind) { const t = $('#toast'); t.textContent = msg; t.className = 'show ' + (kind || ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 2600); }

/* Signed in through Google's account chooser every time (prompt=select_account: '다른 계정 사용' is always on it - Google's
   own button kept to the account it last used, owner 11-10). An access token for 'openid email', an hour long: kept for
   this tab only, and asked for again when it runs out or the server says it is no good. */
try { const s = JSON.parse(sessionStorage.getItem('cueAdmin') || 'null'); if (s && s.exp > Date.now() / 1000 + 60) { token = s.t; who = s.email || ''; } } catch (e) {}

async function api(what, body) {
  const r = await fetch(SERVER + '/v1/admin/' + what, { method: body ? 'POST' : 'GET', headers: Object.assign(pass ? { 'X-Admin-Pass': pass } : { 'X-Admin': token }, { 'Content-Type': 'application/json' }), body: body ? JSON.stringify(body) : undefined }).catch(() => null);
  if (!r) return { ok: false, why: '서버에 연결할 수 없습니다' };
  const j = await r.json().catch(() => ({ ok: false, why: 'bad reply' }));
  const PW = { 'wrong password': '비밀번호가 틀렸습니다', 'locked': '틀린 비밀번호가 많아 15분 동안 막혔습니다', 'no password set': '서버에 관리자 비밀번호가 아직 없습니다 (Cloudflare의 ADMIN_PASSWORD)' };
  if (r.status === 403) { signOut(PW[j.why] || (j.why !== 'not an admin' ? '관리자 기능이 꺼져 있습니다' : j.seen ? `${j.seen} 은(는) 관리자가 아닙니다. 다른 계정을 고르세요.` : `구글이 이 계정의 이메일을 알려주지 않았습니다${j.google ? ` (${j.google})` : ''}`)); }
  return j;
}

async function enter() {
  catalog = await api('catalog'); if (!catalog.ok) return;
  who = catalog.me || who; try { const s = JSON.parse(sessionStorage.getItem('cueAdmin') || 'null'); if (s) { s.email = who; sessionStorage.setItem('cueAdmin', JSON.stringify(s)); } } catch (e) {}
  $('#gate').hidden = true; $('#app').hidden = false; $('#out').hidden = false; $('#who').textContent = who;
  fillItems(); find('');
}
function signOut(msg) {
  token = null; pass = null; try { sessionStorage.removeItem('cueAdmin'); } catch (e) {}
  $('#app').hidden = true; $('#out').hidden = true; $('#who').textContent = ''; $('#gate').hidden = false; $('#gateMsg').textContent = msg || '';
  drawButton();
}
function drawButton() {
  const draw = async () => {
    const cfg = await fetch(SERVER + '/v1/link/google-config').then(r => r.json()).catch(() => null);
    if (!cfg || !cfg.clientId) { $('#gateMsg').textContent = '구글 로그인이 설정되지 않았습니다'; return; }
    const client = google.accounts.oauth2.initTokenClient({ client_id: cfg.clientId, scope: 'openid email https://www.googleapis.com/auth/userinfo.email', prompt: 'select_account',
      error_callback: e => { $('#gateMsg').textContent = e && e.type === 'popup_failed_to_open' ? '팝업이 막혔습니다. 팝업을 허용해 주세요' : e && e.type === 'popup_closed' ? '' : '구글 창을 열 수 없습니다'; },
      callback: async r => {
      if (!r || !r.access_token) { $('#gateMsg').textContent = r && r.error ? '구글: ' + r.error : ''; return; }
      token = r.access_token;
      who = '';   // (whose it is: the server says, with the catalog - it is the one that checks)
      try { sessionStorage.setItem('cueAdmin', JSON.stringify({ t: token, email: who, exp: Date.now() / 1000 + (+r.expires_in || 3600) })); } catch (e) {}
      $('#gateMsg').textContent = ''; enter();
    } });
    $('#gbtn').textContent = '';
    const b = document.createElement('button'); b.className = 'go'; b.textContent = 'Google 계정 선택'; b.style.cssText = 'padding:10px 22px;border-radius:99px';
    b.onclick = () => client.requestAccessToken(); $('#gbtn').appendChild(b);
  };
  if (window.google && google.accounts && google.accounts.oauth2) return draw();
  const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = draw;
  s.onerror = () => { $('#gateMsg').textContent = '구글에 연결할 수 없습니다'; }; document.head.appendChild(s);
}
$('#out').onclick = () => signOut('로그아웃했습니다');
// (the password is kept in this page only, not stored: a reload asks again)
$('#passForm').onsubmit = e => { e.preventDefault(); const v = $('#pass').value; if (!v) return; pass = v; token = null; $('#pass').value = ''; $('#gateMsg').textContent = ''; enter(); };

async function find(q) {
  const r = await api('find', { q }); const ul = $('#people'); ul.textContent = '';
  if (!r.ok) return toast(r.why || '검색 실패', 'bad');
  if (!r.people.length) { ul.innerHTML = '<li class="muted">찾은 계정이 없습니다</li>'; return; }
  for (const p of r.people) {
    const li = document.createElement('li'); li.dataset.acct = p.acct;
    li.innerHTML = `<div><b>${esc(p.nick || '(이름 없음)')}</b>${p.joined ? '' : ' <span class="muted" style="font-size:12px">게스트</span>'}<div class="id">${p.acct.slice(0, 4).toUpperCase()}·${p.acct.slice(4, 8).toUpperCase()}…</div></div><div style="text-align:right;font-size:13px">${num(p.dama)}<div class="muted" style="font-size:11px">${when(p.seen)}</div></div>`;
    li.onclick = () => open(p.acct); ul.appendChild(li);
  }
}
$('#findForm').onsubmit = e => { e.preventDefault(); find($('#q').value); };

async function open(acct) {
  cur = acct; document.querySelectorAll('#people li').forEach(li => li.classList.toggle('on', li.dataset.acct === acct));
  const r = await api('view', { acct }); if (!r.ok) return toast(r.why === 'no such account' ? '없는 계정입니다' : (r.why || '불러오지 못했습니다'), 'bad');
  show(r);
}
$('#reload').onclick = () => cur && open(cur);

function itemName(kind, id) { const it = (catalog.items[kind] || []).find(q => q.id === id); return it ? it.name : id; }
function show(v) {
  const m = v.me; $('#detail').hidden = false;
  $('#dNick').textContent = m.nick || '(이름 없음)'; $('#dJoined').textContent = m.joined ? '구글 가입' : '게스트';
  $('#dAcct').textContent = cur; $('#sCoin').textContent = num(m.coin); $('#sDia').textContent = num(m.dia); $('#sDama').textContent = num(m.dama);
  $('#sSince').textContent = v.since ? new Date(v.since).toLocaleDateString('ko-KR') : '-'; $('#fDama').value = m.dama;
  const rar = (k, id) => ((catalog.items[k] || []).find(q => q.id === id) || {}).rarity || 0;
  $('#owned').innerHTML = v.bought.length ? v.bought.map(b => `<span class="tag r${rar(b.kind, b.id)}" title="${when(b.at)}">${KIND_KO[b.kind] || b.kind} · ${esc(itemName(b.kind, b.id))}</span>`).join('') : '<span class="muted">없음 (기본 아이템만)</span>';
  const sign = n => n ? `<span class="${n > 0 ? 'plus' : 'minus'}">${n > 0 ? '+' : ''}${num(n)}</span>` : '';
  $('#ledger').innerHTML = '<tr><th>때</th><th>내용</th><th>코인</th><th>다이아</th></tr>' + v.ledger.map(l => `<tr><td>${when(l.at)}</td><td>${esc(l.what)}</td><td>${sign(l.coin)}</td><td>${sign(l.dia)}</td></tr>`).join('');
  $('#adminLog').innerHTML = v.admin.length ? '<tr><th>때</th><th>한 일</th><th>사유</th></tr>' + v.admin.map(a => `<tr><td>${when(a.at)}</td><td>${esc(a.did)}<div class="muted" style="font-size:11px">${esc(a.by)}</div></td><td>${esc(a.why)}</td></tr>`).join('') : '<tr><td class="muted">기록 없음</td></tr>';
  $('#games').innerHTML = v.games.length ? '<tr><th>때</th><th>종류</th><th>모드</th><th>지급</th><th>상태</th></tr>' + v.games.map(g => `<tr><td>${when(g.at)}</td><td>${esc(g.kind)}</td><td>${esc(g.mode)}</td><td>${num(g.paid)}</td><td>${esc(g.status)}</td></tr>`).join('') : '<tr><td class="muted">경기 기록 없음</td></tr>';
}

function fillItems() {
  const k = $('#fKind').value, sel = $('#fItem');
  sel.innerHTML = (catalog.items[k] || []).filter(q => q.rarity > 0).sort((a, b) => a.rarity - b.rarity).map(q => `<option value="${esc(q.id)}">[${RARITY_KO[q.rarity] || q.rarity}] ${esc(q.name)}</option>`).join('');
}
$('#fKind').onchange = fillItems;

const WHY = { 'too much': '한 번에 너무 많습니다', 'not enough': '잔액보다 많이 뺄 수 없습니다', 'no such item': '없는 아이템입니다', 'bad rating': '레이팅 범위를 벗어났습니다', 'nothing to do': '바뀐 것이 없습니다 (이미 가지고 있거나 없음)', 'no such account': '없는 계정입니다' };
async function grant(body, what) {
  if (!cur) return;
  if (!confirm(`${$('#dNick').textContent}에게: ${what}\n적용할까요?`)) return;
  const r = await api('grant', Object.assign({ acct: cur }, body));
  if (!r.ok) return toast(WHY[r.why] || r.why || '실패', 'bad');
  toast('적용했습니다', 'good'); open(cur);
}
$('#payForm').onsubmit = e => {
  e.preventDefault(); const coin = Math.trunc(+$('#fCoin').value || 0), dia = Math.trunc(+$('#fDia').value || 0);
  if (!coin && !dia) return toast('코인이나 다이아를 입력하세요', 'bad');
  grant({ coin, dia, why: $('#fWhy1').value }, `코인 ${coin >= 0 ? '+' : ''}${num(coin)}, 다이아 ${dia >= 0 ? '+' : ''}${num(dia)}`).then(() => { $('#fCoin').value = $('#fDia').value = ''; });
};
$('#itemForm').onsubmit = e => {
  e.preventDefault(); const take = e.submitter && e.submitter.dataset.act === 'take', kind = $('#fKind').value, id = $('#fItem').value;
  if (!id) return;
  grant({ kind, id, take, why: $('#fWhy2').value }, `${KIND_KO[kind]} '${itemName(kind, id)}' ${take ? '회수' : '지급'}`);
};
$('#damaForm').onsubmit = e => {
  e.preventDefault(); const dama = Math.round(+$('#fDama').value);
  if (!Number.isFinite(dama)) return;
  grant({ dama, why: $('#fWhy3').value }, `레이팅 ${num(dama)}로 설정`);
};

if (token) enter(); else drawButton();
</script>
</body>
</html>
