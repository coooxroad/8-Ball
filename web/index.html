<title>CUE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;500;700;800&family=Outfit:wght@400;500;600&family=Jua&display=swap">
<!--STYLE: build.sh puts style/*.css here, joined in name order-->
<div id="app" class="desk busy boot" data-theme="dark">
  <canvas id="gl"></canvas>
  <header id="deskBar" hidden>
    <div class="dk-logo">CUE</div>
    <div class="dk-tabs" role="tablist" id="dkTabs">
      <button class="dk-tab" role="tab" data-t="play"><svg class="ti" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.6" fill="currentColor" stroke="none"/></svg><span>플레이</span></button><button class="dk-tab" role="tab" data-t="train"><svg class="ti" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h6a2 2 0 0 1 2 2V20a2 2 0 0 0-2-2H4z"/><path d="M20 5.5h-6a2 2 0 0 0-2 2V20a2 2 0 0 1 2-2h6z"/></svg><span>훈련</span></button><button class="dk-tab" role="tab" data-t="gear"><svg class="ti" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20 17.5 7.5"/><path d="M15.5 5.5 18.5 8.5l2-2-3-3z" fill="currentColor"/><path d="M3.5 21.5l2-2"/></svg><span>내 장비</span></button><button class="dk-tab" role="tab" data-t="shop"><svg class="ti" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16l-1.4 10.2a1.5 1.5 0 0 1-1.5 1.3H6.9a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M8.5 9V7a3.5 3.5 0 0 1 7 0v2"/></svg><span>상점</span></button>
    </div>
    <span class="sp"></span>
    <button class="dk-me" id="dkMe" aria-label="이름 바꾸기"><i class="av">1</i><span><b class="nm"></b><small class="rc"></small></span></button>
    <div class="dk-wallet" id="dkWallet" aria-label="재화"><span class="dk-cur dia" title="다이아"><i></i><b>0</b></span><span class="dk-cur coin" title="코인"><i></i><b>0</b></span></div>
    <button class="dk-top" id="dkFull" hidden><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>전체 화면</span></button>
    <button class="dk-top" id="dkSet" aria-label="설정"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path fill-rule="evenodd" d="M10.3 2h3.4l.5 2.6a7.6 7.6 0 0 1 1.9 1.1l2.5-.9 1.7 2.9-2 1.7a7.7 7.7 0 0 1 0 2.2l2 1.7-1.7 2.9-2.5-.9a7.6 7.6 0 0 1-1.9 1.1l-.5 2.6h-3.4l-.5-2.6a7.6 7.6 0 0 1-1.9-1.1l-2.5.9-1.7-2.9 2-1.7a7.7 7.7 0 0 1 0-2.2l-2-1.7 1.7-2.9 2.5.9a7.6 7.6 0 0 1 1.9-1.1zM12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8z"/></svg></button>
  </header>
  <div id="rkBar" hidden role="status"><i class="sp" aria-hidden="true"><i></i><i></i><i></i></i><span class="t"></span><b class="tm">0:00</b><button id="rkCancel">취소</button></div>
  <div id="deskPlane" hidden><section id="desk">
    <div class="dk-rail" id="dkRail"></div>
    <div class="dk-tray"><div class="dk-head" id="dkHead"></div><div class="dk-stage" id="dkStage"></div><div class="dk-foot" id="dkFoot"></div></div>
    <div class="dk-slate" id="dkSlate"></div>
    <i class="dk-edge" aria-hidden="true"></i><i class="dk-prop towel" aria-hidden="true"></i><i class="dk-prop chalk" aria-hidden="true"></i><i class="dk-prop plant" aria-hidden="true"></i>
  </section></div>
  <div id="dkBeams" hidden aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <header id="hud" hidden>
    <button class="btn icon" id="menuBtn" aria-label="일시정지 메뉴"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button>
    <div class="pill" id="p0"><i class="av">1</i><div class="who"><span class="nm"></span><span class="sub"></span></div><div class="tray"></div><div class="pts"></div></div>
    <div id="badge"></div>
    <div id="clock" hidden aria-label="샷 시간"><i></i><b></b></div>
    <div class="pill r two" id="p1"><i class="av">2</i><div class="who"><span class="nm"></span><span class="sub"></span></div><div class="tray"></div><div class="pts"></div></div>
    <div id="pracBar" hidden></div>
    <button class="btn icon" id="viewBtn" aria-label="3D로 둘러보기" aria-pressed="false"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg></button>
    <div id="views" aria-label="시점">
      <button class="btn icon" id="topBtn" aria-label="위에서 보기 (2D)" aria-pressed="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="2"/><circle cx="10" cy="12" r="1.6" fill="currentColor"/><circle cx="15" cy="10" r="1.6" fill="currentColor"/></svg></button>
      <button class="btn icon" id="eyeBtn" aria-label="선수 시점" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.6"/></svg></button>
    </div>
  </header>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="fps" hidden></div>

  <div id="power" aria-label="샷 세기" hidden>
    <canvas id="powerCue"></canvas>
    <div id="powerLab">세기</div><div id="powerNum">0</div>
  </div>
  <div id="fine" aria-label="미세 조준" hidden><div id="fineLab">미세</div></div>
  <button id="spinBtn" aria-label="큐볼의 칠 곳 정하기" hidden><i id="spinDot"></i><b id="spinTag" hidden></b></button>
  <div id="spinPop" hidden>
    <div id="spinPad"><i class="sring"></i><i class="sdot" id="spinPadDot"></i></div>
    <div id="spinHint"></div>
    <div id="kindBox"><div class="lab">큐 세우기 <b id="elVal">0°</b><span id="elSay"></span></div><canvas id="elPad" aria-label="큐 각도"></canvas></div>
    <button class="btn flat" id="spinReset">가운데로</button>
  </div>

  <div class="scrim" id="sheet" hidden>
    <div class="sheet">
      <div class="sheet-h"><h2 id="sheetTitle"></h2><button class="btn flat" id="sheetX">닫기</button></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="reel" hidden>
    <div id="reelTint"></div>
    <canvas id="reelCv"></canvas>
    <div id="reelFrame"></div><div id="reelCard" hidden></div>
    <div class="lb t"></div><div class="lb b"></div>
    <div id="reelFx"></div>
    <div class="glowE"></div><div id="reelStreak"></div>
    <i id="reelBig"></i><b id="reelTag" hidden></b>
    <div id="reelFlash"></div>
    <div id="reelFade"></div>
    <button class="btn" id="reelSkip">건너뛰기</button>
  </div>
  <input type="file" id="songFile" accept="audio/*" multiple hidden>

  <section id="records" hidden>
    <header class="lg-top"><h1>전적</h1></header>
    <div id="recBody"></div>
  </section>

  <section id="result" hidden>
    <div class="r-plane">
      <header class="r-top"><span class="r-logo">CUE</span><small id="rSub"></small></header>
      <div class="r-tray">
        <div class="r-sheet">
          <div class="r-title"><i class="lf l"></i><span id="rTitle"></span><i class="lf r"></i></div>
          <div class="r-vs">
            <div class="r-p" id="rP0"><i class="ball"></i><div><div class="nm"></div><div class="rc"></div></div></div>
            <div class="r-score" id="rScore"></div>
            <div class="r-p two" id="rP1"><div><div class="nm"></div><div class="rc"></div></div><i class="ball"></i></div>
          </div>
          <div class="r-meta" id="rMeta"></div>
          <div id="rStats"></div>
        </div>
        <div id="rHlBox" hidden><div class="hl-lab">하이라이트</div><div id="rHl"></div></div>
      </div>
      <aside class="r-side">
        <h2>이번 경기</h2>
        <div id="rSide"></div>
        <p id="rWhy"></p>
        <div class="r-btns"><button class="btn" id="againBtn">한 판 더</button><button class="btn" id="homeBtn">로비로</button></div>
      </aside>
    </div>
  </section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
