# CUE's server on Cloudflare Workers. Deployed by .github/workflows/server.yml on every push that touches server/ or the
# game files it shares (web/physics.js, game.js, ai/, puzzles.js, highlights.js, tables.js, economy.js, content/).
name = "cue-server"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Match identities use the runtime's SHA-256 rather than a home-grown hash.
compatibility_flags = ["nodejs_compat"]

[vars]
# how a match played on the device is checked before it pays (src/core.js): "slices" played again a slice at a time
# (bounded batches), "true" all at once, "false" not checked (a daily allowance)
CHECK_MATCHES = "slices"
# Google sign-in (src/google.js): the web OAuth client's ID - not a secret, the page shows it to Google
GOOGLE_CLIENT_ID = "373306860735-qgfad34u67m4vvgimioc1gpct1e06a47.apps.googleusercontent.com"

[[durable_objects.bindings]]
name = "VAULT"
class_name = "Vault"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Vault"]

# ranked games: a lobby for each game, a room for each game being played
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby", "Room"]
